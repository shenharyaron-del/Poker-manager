:root{
  color-scheme: dark;
  --bg1:#04402f; --bg2:#0c0a09;
  --card:#064e3b; --card-b:#065f46;
  --input:#022c22; --input-b:#047857;
  --text:#f5f5f4; --muted:#6ee7b7; --muted2:#34d399;
  --gold:#fbbf24; --gold-text:#1c1917;
  --rose:#4c0519; --rose-b:#be123c; --rose-t:#fda4af;
  --green-box:#065f46;
}
*{box-sizing:border-box;}
/* Blocks pinch-zoom and double-tap-zoom (reported live: pinch-zooming the table screen) -
   the maximum-scale=1 viewport meta tag alone isn't reliable for this anymore, since modern
   mobile browsers deliberately ignore it (an accessibility override, so a page can't lock
   out a low-vision user's zoom) - touch-action is the actual supported way to opt out.
   pan-x/pan-y still allow normal scrolling/panning, only the zoom gestures are blocked. */
html,body{touch-action:pan-x pan-y;}
html,body{margin:0;padding:0;background:var(--bg2);}
body{
  font-family:'Rubik',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--text);
  min-height:100vh;
  background:linear-gradient(to bottom,var(--bg1),var(--bg2));
}
.serif{font-family:'Frank Ruhl Libre',Georgia,serif;}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:40px;}
.px5{padding-left:20px;padding-right:20px;}
.notice{background:#78350f;color:#fde68a;font-size:12px;text-align:center;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;}
.notice button{background:none;border:none;color:inherit;text-decoration:underline;cursor:pointer;font-size:12px;}
.top{padding:24px 20px 10px;}
.screen-tag{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.15em;text-align:center;padding:12px 20px 0;opacity:.8;}
.eyebrow{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.2em;margin-bottom:4px;}
h1{font-size:28px;margin:0;font-weight:700;}
h1.sm{font-size:20px;}
.sub{color:var(--muted);font-size:13px;margin-top:6px;}
.card{background:var(--card);border:1px solid var(--card-b);border-radius:16px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.card-open{border-color:var(--gold);background:rgba(251,191,36,.08);}
.open-badge{font-size:11px;font-weight:700;color:var(--gold-text);background:var(--gold);border-radius:8px;padding:3px 8px;}
.poker-loading-spin{display:inline-flex;animation:pokerChipSpin .8s linear infinite;}
@keyframes pokerChipSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.card:active{transform:scale(0.98);}
.card .name{font-weight:700;font-size:16px;}
.card .meta{color:var(--muted);font-size:12px;margin-top:4px;display:flex;align-items:center;gap:5px;}
.chev{color:#059669;flex-shrink:0;}
.row{display:flex;align-items:center;gap:12px;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
.flex1{flex:1;}
.btn{border:none;border-radius:12px;font-weight:700;font-size:14px;padding:11px 16px;cursor:pointer;font-family:inherit;}
.btn:active{transform:scale(0.96);}
.btn-primary{background:var(--gold);color:var(--gold-text);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-ghost{background:#065f46;color:var(--text);border:1px solid var(--card-b);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px;}
.icon-btn{background:#065f46;border:none;color:var(--text);padding:7px;border-radius:9px;cursor:pointer;display:flex;}
.icon-btn.danger{background:#450a0a;color:#fca5a5;}
.icon-btn.gold{color:var(--gold);}
.icon-btn.ok{background:#065f46;color:#6ee7b7;}
/* Table screen only: the table circle used to be sized purely from its own width (a
   padding-top percentage trick) with a guessed fixed margin reserved for the fixed
   bottom action panel - on a real phone (especially with browser chrome eating into the
   visible height, or a taller action panel) the true content routinely exceeded one
   screen, forcing a page scroll. This instead makes the table screen a column that's
   exactly the visible viewport tall: the header and action panel keep their natural
   size, and the table circle - now sized from the ACTUAL remaining height, not a guess -
   flexes to fill whatever's left, shrinking on a short screen rather than overflowing it. */
/* --real-vh (set from JS via the Visual Viewport API - see updateRealVh) overrides 100dvh
   whenever it's available: some mobile browsers (Samsung Internet reported live, with a
   screenshot showing the bottom action buttons cut off and unreachable) don't subtract
   their OWN on-screen toolbar from what they report as the dynamic viewport, so 100dvh
   ends up taller than what's actually visible - and since this container clips its
   overflow, whatever's cut off (the bottom of the flex column, i.e. the action buttons)
   isn't just scrolled out of view, it's genuinely unreachable. Falls back to 100dvh/100vh
   on a browser with no Visual Viewport API (or before the JS has run once). */
/* min-height:0 cancels out the general body/#app min-height:100vh rules (see their own
   definitions) - those act as a FLOOR, so a smaller --real-vh (a real toolbar eating into
   the visible area) was being overridden right back up to the full, too-tall 100vh/100dvh
   regardless - the exact same clipping bug this whole var() override exists to fix,
   just via min-height instead of height. Caught by testing this against a simulated
   shrunk --real-vh, not visible on a normal desktop browser where real-vh always equals
   100vh/100dvh anyway. */
body.table-screen{height:100vh;height:100dvh;height:var(--real-vh, 100dvh);min-height:0;overflow:hidden;}
body.table-screen #app{height:100vh;height:100dvh;height:var(--real-vh, 100dvh);min-height:0;display:flex;flex-direction:column;padding-bottom:0;}
/* Wraps whichever face of the table screen is showing (see render()) - re-establishes
   the column layout #app used to give its children directly, now one level removed.
   touch-action:pan-y lets native vertical scroll work everywhere inside (the felt, the
   player screen's history/feed lists) while leaving horizontal swipes entirely to the JS
   swipe handlers in attachHandlers, unblocked by the browser's own gesture handling. */
body.table-screen .table-swipe-root{display:flex;flex-direction:column;flex:1;min-height:0;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
/* The actual swipeable carousel (see render()) - both faces (player screen + circles
   view) are mounted side by side at all times when seated, so dragging visibly slides
   the real content under the finger like a phone home screen, instead of an invisible
   gesture that silently swaps views only once released. The viewport clips to one page's
   width; the track is what .swipe-track's own transform moves in attachHandlers.
   direction:ltr on the track (with direction:rtl put back on each .swipe-page) is what
   makes "first DOM child = leftmost, translateX(0)" hold regardless of the page's own
   RTL setting - plain physical left/right math instead of RTL-flexbox's reversed order. */
body.table-screen .swipe-track-viewport{flex:1;min-height:0;overflow:hidden;position:relative;}
body.table-screen .swipe-track{display:flex;direction:ltr;height:100%;}
body.table-screen .swipe-page{flex:0 0 100%;width:100%;min-width:0;direction:rtl;display:flex;flex-direction:column;min-height:0;}
body.table-screen .top{flex-shrink:0;touch-action:none;}
/* The table itself now fills all remaining vertical space below the header - there's no
   bottom action panel competing for room any more (buy-in/leave/settlement all moved to
   the player screen, see renderPlayerScreen). */
body.table-screen .poker-table-wrap{flex:1;min-height:80px;width:100%;padding-top:0;max-width:100%;max-height:100%;margin:4px 0 8px;overflow:hidden;touch-action:none;}
/* The identityName modal's own mini seat-picker table (see seatPickerHtml) reuses this
   same .poker-table-wrap class for its felt/watermark look, but it's a plain block inside
   a fixed-width wrapper, not the real table screen's flex-fit box above - so when that
   modal is opened while body still carries table-screen from the screen behind it, the
   rule above wrongly matched it too and collapsed it to min-height:80px instead of its
   normal width-based aspect ratio. Reported live as the profile screen's seat picker
   looking smaller/denser than the same picker opened from the mandatory post-login
   "הגדרת שחקן" screen (nav.screen isn't "table" yet at that point, so body never had
   table-screen to begin with there). Needs the extra .modal in the selector to
   out-specificity the rule above. */
body.table-screen .modal .poker-table-wrap{flex:none;min-height:0;padding-top:145%;max-width:100%;max-height:none;overflow:visible;}
/* The inner box keeps a fixed aspect ratio driven by WIDTH alone, so its height never
   shrinks just because the outer viewport (.poker-table-wrap, above) got shorter - it only
   ever gets clipped by that viewport's overflow:hidden. Anchoring to top vs bottom (set
   per-render in renderTable from the viewer's own seat position - see getMySeatPosition)
   decides which end stays fully visible. */
body.table-screen .poker-table-inner{position:absolute;left:0;right:0;width:100%;aspect-ratio:1/1.45;}
/* A flush 0 offset clips the closest seat's own content right at the edge - a top-row
   seat's avatar circle (crop-from-bottom, anchored at the top) and a bottom-row seat's
   caption text (crop-from-top, anchored at the bottom) both extend a bit past the felt's
   own nominal edge by design (see .seat-wrap's centered translate). These offsets (kept
   in sync with layoutTableSize's own TOP_CROP_BUFFER/BOTTOM_CROP_BUFFER) reserve just
   enough slack for that overhang instead of cropping into it. */
body.table-screen .poker-table-inner.crop-from-bottom{top:20px;bottom:auto;}
body.table-screen .poker-table-inner.crop-from-top{bottom:16px;top:auto;}
/* The player screen's own content (name/total, buy-in row, history, table-activity feed,
   leave button) - a column that fills the available height with no page scroll of its
   own (nothing here should ever push the screen taller than the phone); every child
   except the activity feed keeps its natural size (flex-shrink:0, set per-element below),
   and the feed alone (flex:1) absorbs whatever room is left, shrinking or growing so the
   leave button after it always stays on screen instead of getting pushed off. */
body.table-screen .player-screen-scroll{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:0 20px 20px;}
/* Shared by the player screen's history and table-activity sections - a genuinely FIXED
   size (height, not max-height - stays put whether there's 1 message or 30) by default,
   so both read as their own defined panel instead of open-ended lists pushing the page
   taller. Both sections override this base height inline (see renderPlayerScreen): the
   history frame to a shorter ~2-bubble height, the table-activity one to flex:1 so it
   absorbs whatever room is left. The doodle background is the user-
   supplied WhatsApp-style reference image, tiled; the dark overlay underneath keeps the
   bubbles/text readable against it instead of the image's own light color showing
   through at full strength. */
.chat-frame{background-repeat:repeat;background-size:auto,220px;border-radius:12px;padding:10px;height:158px;overflow-y:auto;touch-action:pan-y;}
/* Purchase history (dark blue) vs table activity (charcoal) - picked from a handful of
   proposed options, see git history. */
.chat-frame[data-player-history]{background:linear-gradient(rgba(10,25,55,.85),rgba(10,25,55,.85)),url('/static/chat-bg.png');}
.chat-frame[data-player-feed]{background:linear-gradient(rgba(20,20,24,.85),rgba(20,20,24,.85)),url('/static/chat-bg.png');}
/* Same "bounded panel" idea as .chat-frame above, for the buy-in button row - a plain
   border box rather than a dark fill, so the gold buttons inside stay the brightest thing
   in it instead of competing with a tinted background. */
.buyin-frame{border:1px solid var(--card-b);border-radius:12px;padding:10px;}
/* History/table-activity used to be two always-visible stacked panels (a short fixed-height
   one plus a flex:1 one); now they share one tab-switched panel instead, so whichever is
   selected gets ALL the space both used to split between them. The unselected tab is fully
   transparent - the real page background (the gradient behind everything) shows through it
   exactly, rather than an approximated flat color - while the selected tab is a rounded
   "raised" pill matching the panel's own color (navy for history, charcoal for feed)
   directly below it, same idea as a browser tab merging into its own page. */
.player-history-feed{display:flex;flex-direction:column;flex:1;min-height:0;margin-bottom:14px;}
.player-history-feed-tabs{display:flex;flex-shrink:0;}
.player-history-feed-tab{flex:1;padding:10px 4px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.04em;background:none;border:none;color:rgba(255,255,255,.45);cursor:pointer;font-family:inherit;}
.player-history-feed-tab.active{border-radius:10px 10px 0 0;color:var(--gold);background-repeat:repeat;background-size:auto,220px;}
.player-history-feed.mode-history .player-history-feed-tab.active{background-image:linear-gradient(rgba(10,25,55,.85),rgba(10,25,55,.85)),url('/static/chat-bg.png');}
.player-history-feed.mode-feed .player-history-feed-tab.active{background-image:linear-gradient(rgba(20,20,24,.85),rgba(20,20,24,.85)),url('/static/chat-bg.png');}
.player-history-feed-body{flex:1;min-height:0;overflow-y:auto;padding:10px;touch-action:pan-y;border-radius:0 0 12px 12px;background-repeat:repeat;background-size:auto,220px;}
.player-history-feed-body.mode-history{background-image:linear-gradient(rgba(10,25,55,.85),rgba(10,25,55,.85)),url('/static/chat-bg.png');}
.player-history-feed-body.mode-feed{background-image:linear-gradient(rgba(20,20,24,.85),rgba(20,20,24,.85)),url('/static/chat-bg.png');}
/* Time sits tucked in the bubble's own bottom-left corner instead of a separate full-width
   row underneath - floating it lets the message text wrap around it exactly like a real
   chat bubble, landing beside the last line when there's room and below it otherwise. */
.chat-bubble{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:13px;color:var(--text);overflow:hidden;}
.chat-bubble:last-child{margin-bottom:0;}
.chat-bubble .bubble-time{float:left;font-size:10px;color:var(--muted);margin:3px 0 0 6px;}
/* Table-activity rows only (not the plain chat-bubble ones elsewhere, which rely on
   .bubble-time's float) - an icon ahead of the time+text block, which keeps its own float
   layout since it's still a plain block, just no longer the bubble's only child. */
.chat-bubble.with-icon{display:flex;gap:6px;align-items:flex-start;}
.chat-bubble.with-icon>svg{flex-shrink:0;margin-top:2px;opacity:.85;}
.empty{text-align:center;padding:50px 20px;color:#059669;font-size:14px;}
.section-title{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.05em;margin:0 0 8px;padding:0 20px;}
.field{display:block;margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;}
input[type=text],input[type=number],input[type=date],input[type=email],.select-input{
  width:100%;padding:11px 14px;border-radius:12px;background:var(--input);border:1px solid var(--input-b);
  color:var(--text);font-family:inherit;font-size:15px;outline:none;
}
input:focus,.select-input:focus{border-color:var(--gold);}
.chip-row{display:flex;gap:8px;margin-bottom:12px;}
.chip-btn{flex:1;padding:9px;border-radius:9px;background:var(--input);border:1px solid var(--input-b);color:var(--text);font-family:inherit;cursor:pointer;transition:transform .08s ease;}
.chip-btn:disabled{opacity:.4;cursor:not-allowed;}
.chip-btn:active{transform:scale(.93);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.chip-btn.buyin-selected{background:var(--gold);color:var(--gold-text);border-color:var(--gold);font-weight:700;}
.overlay{position:fixed;inset:0;background:#000;display:flex;align-items:flex-end;justify-content:center;z-index:50;}
@media(min-width:600px){.overlay{align-items:center;}}
/* Anchors the sheet to the top of the screen instead of the bottom - used for the
   chip-counting screen (seatChips), which got long enough (recap header + mode tabs +
   mode body) that opening from the bottom kept its own top - the part you look at
   first - furthest from the thumb/eye. */
.overlay.overlay-top{align-items:flex-start;}
.overlay.overlay-top .modal{border-radius:0 0 20px 20px;}
@media(min-width:600px){.overlay.overlay-top .modal{border-radius:20px;}}
/* A dedicated screen, not a sheet - the group-setup flow (chipSetup/payboxSettings) got
   involved enough (title, tabs, a save flow with its own unsaved-changes guard) that a
   partial bottom sheet read as cramped and out of place; this fills the whole viewport
   top to bottom instead, same as a real screen would. */
.overlay.overlay-fullscreen{align-items:stretch;padding:0;}
.overlay.overlay-fullscreen .modal{max-width:none;width:100%;height:100%;max-height:none;border-radius:0;border:none;}
.modal{background:#064e3b;width:100%;max-width:480px;border-radius:20px 20px 0 0;border:1px solid var(--card-b);padding:20px;max-height:85vh;overflow-y:auto;}
@media(min-width:600px){.modal{border-radius:20px;}}
/* showAlert() - custom stand-in for the browser's native alert(), which always prefixes
   its own message with "<hostname> says". Stacks above any open modal (.overlay is
   z-index:50). */
.custom-alert{position:fixed;inset:0;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:16px;}
@media(min-width:600px){.custom-alert{align-items:flex-start;}}
.custom-alert-box{pointer-events:auto;background:#0c3d2e;border:1px solid var(--gold);border-radius:14px;padding:14px 16px;width:100%;max-width:440px;color:var(--text);font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:custom-alert-in .2s ease-out;}
.custom-alert-close{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;flex-shrink:0;}
@keyframes custom-alert-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.custom-confirm{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:201;padding:16px;}
.custom-confirm-box{background:#0c3d2e;border:1px solid var(--gold);border-radius:14px;padding:18px 16px;width:100%;max-width:400px;color:var(--text);font-size:14px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:custom-alert-in .2s ease-out;}
.custom-confirm-actions{display:flex;gap:10px;margin-top:16px;}
.buyin-confirm-overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px;}
.buyin-confirm-card{pointer-events:auto;background:#15803d;color:#fff;border-radius:18px;padding:28px 32px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:buyin-confirm-pop 4s linear;max-width:300px;}
.buyin-confirm-card.fade-out{animation:buyin-confirm-fade .3s ease forwards;}
/* Quick fade-in (opacity only, scale untouched) at 0-3%, then a constant-rate (linear)
   grow to 120% over the next 1.5s (3%-37.5% of the 4s total), back down to 100% over
   another 1.5s at the same rate (37.5%-75%), then holds at 100% for the remaining ~1s. */
@keyframes buyin-confirm-pop{0%{transform:scale(.3);opacity:0;}3%{transform:scale(.3);opacity:1;}37.5%{transform:scale(1.2);opacity:1;}75%{transform:scale(1);opacity:1;}100%{transform:scale(1);opacity:1;}}
@keyframes buyin-confirm-fade{to{opacity:0;transform:scale(.95);}}
/* Blocking first-entry welcome screen (replaces the green confirm card for isEntry
   buy-ins) - unlike .overlay (solid black), this sits above the already-rendered player
   screen with a translucent+blurred backdrop so the app is visible-but-blurred behind it,
   and has no close-x/outside-tap dismissal anywhere - only its own button clears it. */
.game-welcome-overlay{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,20,14,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:custom-alert-in .25s ease-out;}
.game-welcome-card{background:#064e3b;border:1px solid var(--card-b);border-radius:20px;padding:30px 24px;width:100%;max-width:400px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.55);}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-head h3{margin:0;font-size:18px;}
.close-x{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;}
.roster-row{display:flex;align-items:center;justify-content:space-between;background:var(--input);border:1px solid var(--card-b);border-radius:12px;padding:10px 14px;margin-bottom:8px;}
.scroll-list{max-height:50vh;overflow-y:auto;padding-left:2px;}
.checkbox-row{display:flex;align-items:center;gap:10px;background:var(--input);border:1px solid var(--card-b);border-radius:12px;padding:10px 14px;margin-bottom:6px;}
.checkbox-row input{width:17px;height:17px;accent-color:var(--gold);}
.coin{border-radius:50%;border:2px solid #78716c;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;background:#022c22;}
.coin.sm{width:36px;height:36px;font-size:11px;}
.coin.pos{border-color:#34d399;color:#6ee7b7;}
.coin.neg{border-color:#fb7185;color:#fda4af;}
.player-card{display:flex;align-items:center;gap:12px;background:var(--input);border:1px solid #14532d;border-radius:16px;padding:14px;margin-bottom:8px;}
.poker-table-wrap{position:relative;width:100%;padding-top:145%;margin:4px 0 18px;}
/* Stadium shape (straight sides, fully-rounded caps) rather than a plain ellipse - a
   border-radius bigger than half the element's own width gets capped there by the CSS
   spec itself, which is exactly what produces straight vertical sides with round ends on
   a box taller than it is wide. The 3D read comes from three independent layers: the
   radial gradient fakes an overhead light (brighter upper-center, darker at the rim), the
   outer box-shadow lifts the whole table off the page, and the two inset shadows fake a
   concave felt surface (a soft highlight where the light would catch it, darkening
   toward the rail) - no pseudo-elements/extra stacking contexts needed. */
.poker-table-felt{
  position:absolute;inset:4% 11%;border-radius:999px;
  /* A real photographed table (wood rail + felt already baked into one image) replaced

<body>
<div id="app"></div>

<script>
// ---------- Real persistence: backed by the app's own server + database ----------
function uid(){ return Math.random().toString(36).slice(2,10); }

// A stable per-browser id so the server knows which "personal identity" bucket belongs
// to this device. Not a login - just lets each browser keep its own typed-in name.
function getClientId(){
  let id = localStorage.getItem("poker-tracker-client-id");
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : (uid()+uid()+uid()));
    localStorage.setItem("poker-tracker-client-id", id);
  }
  return id;
}

// ---------- AI vision helper (calls our server, which calls Claude with the real API key) ----------
async function callClaudeVisionMulti(dataUrls, promptText){
  const response = await fetch("/api/vision", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ dataUrls, promptText })
  });
  if (!response.ok) throw new Error("vision request failed");
  return await response.json();
}
// ---------- Poker equity calculator (exact deck simulation - no LLM math involved) ----------
// Claude's only job for this feature is reading the cards off the photo into structured
// JSON (fast, reliable - the same kind of task the chip-counting feature already does).
// The actual percentages come from dealing the unknown cards thousands of times here and
// tallying outcomes - deterministic, instant, and always correct, unlike asking an LLM to
// reason through combinatorics (which proved slow and unreliable in practice).
const CARD_RANKS = "23456789TJQKA";
function parsePokerCard(s){
  const rank = CARD_RANKS.indexOf(s[0].toUpperCase()) + 2;
  const suit = s[1].toLowerCase();
  return {rank, suit};
}
function fullPokerDeck(){
  const deck = [];
  for (let r = 2; r <= 14; r++) for (const s of "cdhs") deck.push({rank:r, suit:s});
  return deck;
}
function pokerCardKey(c){ return c.rank + c.suit; }
function evaluate5(cards){
  const ranks = cards.map(c=>c.rank).sort((a,b)=>b-a);
  const suits = cards.map(c=>c.suit);
  const isFlush = new Set(suits).size === 1;
  const uniqueRanks = Array.from(new Set(ranks)).sort((a,b)=>b-a);
  let isStraight = false, straightHigh = null;
  if (uniqueRanks.length === 5) {
    if (uniqueRanks[0]-uniqueRanks[4] === 4) { isStraight = true; straightHigh = uniqueRanks[0]; }
    else if (uniqueRanks.join(",") === "14,5,4,3,2") { isStraight = true; straightHigh = 5; }
  }
  const counts = {};
  ranks.forEach(r => counts[r] = (counts[r]||0)+1);
  const countItems = Object.entries(counts).map(([r,c])=>[Number(r),c]).sort((a,b)=> b[1]-a[1] || b[0]-a[0]);
  const pattern = countItems.map(x=>x[1]).join(",");
  const orderedRanks = countItems.map(x=>x[0]);

  if (isStraight && isFlush) return [8, straightHigh];
  if (pattern === "4,1") return [7, orderedRanks[0], orderedRanks[1]];
  if (pattern === "3,2") return [6, orderedRanks[0], orderedRanks[1]];
  if (isFlush) return [5, ...ranks];
  if (isStraight) return [4, straightHigh];
  if (pattern === "3,1,1") return [3, orderedRanks[0], ...orderedRanks.slice(1)];
  if (pattern === "2,2,1") return [2, orderedRanks[0], orderedRanks[1], orderedRanks[2]];
  if (pattern === "2,1,1,1") return [1, orderedRanks[0], ...orderedRanks.slice(1)];
  return [0, ...ranks];
}
function compareHandRank(a, b){
  for (let i=0;i<Math.max(a.length,b.length);i++){
    const av = a[i]===undefined?-1:a[i], bv = b[i]===undefined?-1:b[i];
    if (av !== bv) return av - bv;
  }
  return 0;
}
function kCombinations5(arr){
  // all 5-card subsets of a 6 or 7 card array
  const results = [];
  function helper(start, combo){
    if (combo.length === 5) { results.push(combo.slice()); return; }
    for (let i=start;i<arr.length;i++){ combo.push(arr[i]); helper(i+1, combo); combo.pop(); }
  }
  helper(0, []);
  return results;
}
function bestHandRank(cards){
  let best = null;
  for (const combo of kCombinations5(cards)) {
    const r = evaluate5(combo);
    if (best === null || compareHandRank(r, best) > 0) best = r;
  }
  return best;
}
function simulatePokerOdds(hands, board, iterations){
  const parsedHands = hands.map(h => h.map(parsePokerCard));
  const parsedBoard = board.map(parsePokerCard);
  const usedKeys = new Set([...parsedBoard, ...parsedHands.flat()].map(pokerCardKey));
  const remaining = fullPokerDeck().filter(c => !usedKeys.has(pokerCardKey(c)));
  const needed = 5 - parsedBoard.length;
  const n = parsedHands.length;

  const winCount = new Array(n).fill(0);
  const tieCount = new Array(n).fill(0);
  const bothRunsCount = new Array(n).fill(0);
  const oneRunCount = new Array(n).fill(0);
  const neitherRunCount = new Array(n).fill(0);

  function sampleCards(deck, k){
    const arr = deck.slice();
    for (let i=0;i<k;i++){
      const j = i + Math.floor(Math.random()*(arr.length-i));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr.slice(0,k);
  }
  function resolveRun(boardExtra){
    const fullBoard = parsedBoard.concat(boardExtra);
    const ranks = parsedHands.map(h => bestHandRank(h.concat(fullBoard)));
    let best = ranks[0];
    for (let i=1;i<n;i++) if (compareHandRank(ranks[i], best) > 0) best = ranks[i];
    const winners = [];
    for (let i=0;i<n;i++) if (compareHandRank(ranks[i], best) === 0) winners.push(i);
    return winners;
  }

  for (let iter=0; iter<iterations; iter++){
    const sample = needed > 0 ? sampleCards(remaining, needed*2) : [];
    const run1Extra = sample.slice(0, needed);
    const run2Extra = sample.slice(needed, needed*2);

    const winners1 = resolveRun(run1Extra);
    if (winners1.length === 1) winCount[winners1[0]]++;
    else winners1.forEach(i => tieCount[i]++);

    const winners2 = resolveRun(run2Extra);
    const set1 = new Set(winners1), set2 = new Set(winners2);
    for (let i=0;i<n;i++){
      const w1 = set1.has(i), w2 = set2.has(i);
      if (w1 && w2) bothRunsCount[i]++;
      else if (w1 || w2) oneRunCount[i]++;
      else neitherRunCount[i]++;
    }
  }

  return parsedHands.map((h,i) => ({
    winPct: winCount[i]/iterations*100,
    tiePct: tieCount[i]/iterations*100,
    bothRunsPct: bothRunsCount[i]/iterations*100,
    oneRunPct: oneRunCount[i]/iterations*100,
    neitherRunPct: neitherRunCount[i]/iterations*100,
  }));
}
// ---------- Omaha Hi/Lo pot-split calculator ----------
// Unlike the hold'em equity calculator above, the whole board is already known (a
// showdown photo, not a live hand) - so this is a single deterministic best-hand
// search, not a simulation. Reuses evaluate5/compareHandRank/parsePokerCard as-is;
// only the Omaha-specific "exactly 2 hole + 3 board" combination rule and the
// ace-to-8 low hand are new.
const HIGH_CATEGORY_NAMES = ["קלף גבוה","זוג","שני זוגות","שלישייה","סטרייט","פלאש","פול האוס","רביעייה","סטרייט פלאש"];
function combinationsOf(arr, k){
  const results = [];
  function helper(start, combo){
    if (combo.length === k) { results.push(combo.slice()); return; }
    for (let i=start;i<arr.length;i++){ combo.push(arr[i]); helper(i+1, combo); combo.pop(); }
  }
  helper(0, []);
  return results;
}
function evaluateLow5(cards){
  // Ace-to-8 low ("8 or better"): 5 distinct ranks, all 8-or-under (ace counts as low).
  // Returns a descending-sorted array for comparison (lexicographically smaller = the
  // better/lower hand), or null if this particular 5-card combo doesn't qualify.
  const lowVals = cards.map(c => c.rank === 14 ? 1 : c.rank);
  if (lowVals.some(v => v > 8)) return null;
  if (new Set(lowVals).size !== 5) return null;
  return lowVals.slice().sort((a,b)=>b-a);
}
function compareLowRank(a, b){
  for (let i=0;i<5;i++){ if (a[i]!==b[i]) return a[i]-b[i]; }
  return 0;
}
function cardToStr(c){ return CARD_RANKS[c.rank-2] + c.suit; }
function evaluateOmahaPlayer(holeCards, boardCards){
  // Omaha's defining rule (unlike hold'em's bestHandRank over any 5 of 7): exactly 2
  // hole cards + 3 board cards, for high and low independently.
  let bestHigh = null, bestHighCards = null, bestLow = null, bestLowCards = null;
  for (const hp of combinationsOf(holeCards, 2)) {
    for (const bt of combinationsOf(boardCards, 3)) {
      const five = hp.concat(bt);
      const high = evaluate5(five);
      if (!bestHigh || compareHandRank(high, bestHigh) > 0) { bestHigh = high; bestHighCards = five; }
      const low = evaluateLow5(five);
      if (low && (!bestLow || compareLowRank(low, bestLow) < 0)) { bestLow = low; bestLowCards = five; }
    }
  }
  return {bestHigh, bestHighCards, bestLow, bestLowCards};
}
function computeOmahaHiLoSplit(hands, board){
  const parsedBoard = board.map(parsePokerCard);
  const evals = hands.map(h => evaluateOmahaPlayer(h.map(parsePokerCard), parsedBoard));
  let bestHigh = evals[0].bestHigh;
  evals.forEach(e => { if (compareHandRank(e.bestHigh, bestHigh) > 0) bestHigh = e.bestHigh; });
  const highWinners = evals.map((e,i)=>i).filter(i => compareHandRank(evals[i].bestHigh, bestHigh) === 0);
  const lowCandidates = evals.map((e,i)=>i).filter(i => evals[i].bestLow);
  let lowWinners = [];
  if (lowCandidates.length) {
    let bestLow = evals[lowCandidates[0]].bestLow;
    lowCandidates.forEach(i => { if (compareLowRank(evals[i].bestLow, bestLow) < 0) bestLow = evals[i].bestLow; });
    lowWinners = lowCandidates.filter(i => compareLowRank(evals[i].bestLow, bestLow) === 0);
  }
  const hasLow = lowWinners.length > 0;
  const highShare = hasLow ? 50 : 100;
  const lowShare = hasLow ? 50 : 0;
  return evals.map((e,i) => ({
    pct: (highWinners.includes(i) ? highShare/highWinners.length : 0) + (lowWinners.includes(i) ? lowShare/lowWinners.length : 0),
    bestHigh: e.bestHigh, bestHighCards: e.bestHighCards.map(cardToStr),
    bestLow: e.bestLow, bestLowCards: e.bestLowCards ? e.bestLowCards.map(cardToStr) : null,
    wonHigh: highWinners.includes(i), wonLow: lowWinners.includes(i), hasLow,
  }));
}
// Resize to Claude's own vision cap before sending, so any pixel coordinates it
// returns line up exactly with the image we display (no separate resize on their end).
function resizeImageDataUrl(dataUrl, maxDim, callback){
  const img = new Image();
  img.onload = () => {
    let w = img.naturalWidth, h = img.naturalHeight;
    if (Math.max(w,h) > maxDim) {
      const scale = maxDim / Math.max(w,h);
      w = Math.round(w*scale); h = Math.round(h*scale);
    }
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL("image/jpeg", 0.85), w, h);
  };
  img.src = dataUrl;
}
// The poker-odds photo is always laid out wide (hands in a row above the board) - if the
// phone captured it in portrait, rotate it 90deg so the display and what Claude sees both
// match that layout instead of showing a tall, mostly-empty box.
function ensureLandscapeDataUrl(dataUrl, callback){
  const img = new Image();
  img.onload = () => {
    const w = img.naturalWidth, h = img.naturalHeight;
    if (h <= w) { callback(dataUrl); return; }
    const canvas = document.createElement("canvas");
    canvas.width = h; canvas.height = w;
    const ctx = canvas.getContext("2d");
    ctx.translate(h, 0);
    ctx.rotate(Math.PI/2);
    ctx.drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL("image/jpeg", 0.9));
  };
  img.src = dataUrl;
}

function defaultState(){
  return { communities: [], games: [] };
}

// Throws on any failure (network error, non-2xx) instead of silently returning empty
// defaults - a fresh install already gets {communities:[],games:[]} from the server itself
// (200 OK), so a thrown error here always means the fetch genuinely failed. Every caller
// must handle that by keeping whatever's already in memory, never by falling back to
// defaultState() - doing so and then saving would wipe real data with an empty snapshot.
// Checks the tiny /api/state/hash endpoint first and skips the full fetch if nothing
// changed since our last load - this is what actually cuts the Render bandwidth usage,
// since most polls happen while nothing changed. (A real conditional GET with ETag/304
// would be the standard way to do this, but Render's edge silently strips a custom ETag
// response header before it reaches the browser, so that never actually worked - this
// sidesteps it with a plain small JSON body instead of relying on any header surviving.)
// Returns null when unchanged - every caller must treat that as "keep current state",
// never as an empty/missing result.
let lastStateHash = null;
async function loadState(){
  try {
    const hashRes = await fetch("/api/state/hash");
    if (hashRes.ok) {
      const { hash } = await hashRes.json();
      if (hash === lastStateHash) return null;
      lastStateHash = hash;
    }
  } catch(e) { /* hash check failed - fall through and fetch the full state anyway */ }
  const res = await fetch("/api/state");
  if (!res.ok) throw new Error("failed to load state: " + res.status);
  return await res.json();
}

// The relational-API equivalent of loadState(), used by doRefreshNow when
// USE_RELATIONAL_API is on (production). /api/state GET (loadState above) serves the
// LEGACY shared_state blob - server.py's _get_cached_state()/_set_cached_state() are only
// ever touched by the old POST /api/state handler, which nothing calls once writes go
// through /api/v2/... instead. That blob is therefore frozen from whenever the cutover to
// the relational API happened and never updates again - every periodic/SSE-triggered
// refresh was silently reverting the live view back to that one frozen snapshot, wiping
// out real buy-ins/cashouts/etc. and diverging two devices that each refreshed at a
// different moment. Same eager-fetch-every-game shape init() already uses (see its own
// comment on why that's a shortcut, not the final lazy-load design) - consistent with
// what's actually deployed today rather than half-fixing only the refresh path.
async function loadStateV2(){
  const communities = await v2Fetch("GET", "/communities");
  const gameSummaries = (await Promise.all(
    communities.map(c => v2Fetch("GET", `/communities/${c.id}/games`))
  )).flat();
  // Skip re-fetching a game's full detail (7 joined queries server-side - see
  // v2_get_game's own comment) when its updatedAt, already given for free by the cheap
  // summary list above, hasn't moved since we last had it in memory - this function runs
  // on EVERY periodic refresh tick (every 6s) for EVERY game in EVERY community, so
  // re-running all 7 queries for games nothing happened to tonight (every past night, and
  // most ticks of the one actually being played) was pure waste - this was the real
  // source of the DB connection-pool contention found during the avatar-upload
  // investigation. Keeps the cached object as-is (full buyins/seats/etc, whatever shape
  // it already had) rather than touching it, so nothing downstream needs to change.
  const games = await Promise.all(gameSummaries.map(gs => {
    const cached = getGame(gs.id);
    if (cached && cached.updatedAt && gs.updatedAt && cached.updatedAt === gs.updatedAt) return cached;
    return v2Fetch("GET", `/games/${gs.id}`);
  }));
  return { communities, games };
}

// Applies a loadState()/loadStateV2() result to the live `state`. loadState()'s result is
// the complete legacy blob and fully replaces state, same as always - but loadStateV2()
// only ever carries communities/games (globalPlayers/customAvatars/hiddenAvatarKeys/the
// avatar-category overrides never got a v2 table or endpoint - see loadStateV2's own
// comment - they still live ONLY in the legacy blob). A bare `state = fresh` after a
// loadStateV2() call was wiping every one of those fields back to undefined on every
// refresh - fine right up until the next refresh landed, at which point a player's own
// avatar (and any admin-added custom avatars) visibly vanished. Overlaying just
// communities/games instead - the same "start from the blob, layer v2 on top" shape
// init() already uses for its own initial load - keeps the rest of state untouched.
// Whether applyFreshState has ever actually overlaid a real fetch yet - false only for the
// very first call (seeding state from whatever's already on the server when the app
// opens), which must never queue a confirm card for every buy-in that already existed.
let hasAppliedFreshStateOnce = false;
// Cross-device buy-in confirm card (item 4): comparing each game's buyins BEFORE this
// overlay against the freshly-fetched ones catches any id that didn't exist a moment ago,
// regardless of which device actually added it or which screen is currently showing - the
// same diff this function already does to apply the fetch, reused rather than a parallel
// polling loop. The device that itself performed the add already shows this card directly
// from performBuyin once its own request resolves - skipped here via pendingBuyinRequest
// so it doesn't also get caught by this diff a moment later and double up.
function detectAndAnnounceNewBuyins(oldGames, newGames){
  (newGames||[]).forEach(ng => {
    const og = (oldGames||[]).find(g => g.id === ng.id);
    const oldIds = new Set((og ? og.buyins : []).map(b => b.id));
    const playerBuyins = {};
    (ng.buyins||[]).forEach(b => { (playerBuyins[b.playerId] = playerBuyins[b.playerId] || []).push(b); });
    (ng.buyins||[]).forEach(b => {
      if (oldIds.has(b.id)) return;
      if (pendingBuyinRequest && pendingBuyinRequest.gameId === ng.id && pendingBuyinRequest.id === b.id) return;
      if (announcedBuyinIds.has(b.id)) return;
      // Belt-and-suspenders against every other guard somehow missing at once (see
      // announcedBuyinIds's own comment on the silent-restart failure mode this is all
      // defending against): a buy-in old enough that it can't plausibly be "just
      // happened" doesn't deserve a popping confirm card even if it IS genuinely new to
      // this device - mark it seen and move on instead of animating a stale notification.
      if (b.ts && (Date.now() - b.ts) > 2*60*1000) { rememberAnnouncedBuyin(b.id); return; }
      const player = (ng.players||[]).find(p => p.id === b.playerId);
      const sorted = (playerBuyins[b.playerId]||[]).slice().sort((a,c)=>(a.ts||0)-(c.ts||0));
      const isEntry = sorted.length > 0 && sorted[0].id === b.id;
      showBuyinConfirmCard(b.id, player ? player.name : "שחקן", b.amount, isEntry);
    });
  });
}
function applyFreshState(fresh){
  if (fresh === null) return;
  if (USE_RELATIONAL_API) {
    if (hasAppliedFreshStateOnce) detectAndAnnounceNewBuyins(state.games, fresh.games);
    hasAppliedFreshStateOnce = true;
    state.communities = fresh.communities;
    state.games = fresh.games;
  } else {
    state = fresh;
  }
}
// globalPlayers/customAvatars/hiddenAvatarKeys/the avatar-category overrides never got a
// v2 table (see applyFreshState's own comment) - they're still written as a POST of the
// ENTIRE legacy blob (saveState(), with no baseHash/conflict check for this call path - see
// every setGlobalPlayer(...); saveState(); site), so whichever of those saves lands last on
// the server wins outright, silently discarding any OTHER field someone else changed in the
// meantime (reported live as "I uploaded a new avatar and it reverted back to my old one" -
// someone else saving their own unrelated change, built on a copy from before the upload,
// overwrote it). Fetches just this handful of fields fresh from the server, hash-gated the
// same cheap way loadState() already is - reuses lastStateHash since nothing else reads or
// writes it in relational mode (mutateAndSave/its baseHash conflict check is legacy-path
// only). Returns whether it actually found something new to merge in.
async function syncLegacyOnlyFields(){
  try {
    const hashRes = await fetch("/api/state/hash");
    if (!hashRes.ok) return false;
    const { hash } = await hashRes.json();
    if (hash === lastStateHash) return false;
    const res = await fetch("/api/state");
    if (!res.ok) return false;
    const fresh = await res.json();
    lastStateHash = hash;
    state.globalPlayers = fresh.globalPlayers;
    state.customAvatars = fresh.customAvatars;
    state.hiddenAvatarKeys = fresh.hiddenAvatarKeys;
    state.avatarCategoryLabelOverrides = fresh.avatarCategoryLabelOverrides;
    state.avatarCategoryOrder = fresh.avatarCategoryOrder;
    return true;
  } catch(e) { return false; /* best-effort - caller proceeds on whatever it already had */ }
}
// Periodic-refresh side of syncLegacyOnlyFields (called from doRefreshNow, same cadence as
// the regular refresh) - re-renders if it actually found something new, same skip-guard the
// rest of that refresh already uses. The OTHER side - syncing immediately before writing
// one of these fields - is each write site's own `await syncLegacyOnlyFields();` right
// before its local mutation (see setGlobalPlayer's callers), which closes most of the same
// lost-update race syncBeforeMutate already closes for buy-ins, just for this field instead.
async function refreshLegacyOnlyFields(){
  if (!USE_RELATIONAL_API) return; // loadState() already refreshes these every tick
  const changed = await syncLegacyOnlyFields();
  if (changed && !modal && !playerScreenCustomOpen && !Object.keys(adminBuyinUi).length && !seatDragInProgress && !shouldShowGameWelcome()) render();
}

// Temporary diagnostic overlay for tracking down a reported sync-flicker bug.

const DEBUG_SYNC = new URLSearchParams(location.search).get("debug") === "1";
const syncLog = [];
function logSync(msg){

let saveInFlight = null;
// A whole mutateAndSave call - which can involve several attempts (conflict, resync,
// reapply, retry) on a slow connection - not just its individual network POSTs. Only
// saveState() updates saveInFlight, and it does so per-attempt, so there's a real gap
// between a rejected attempt and the next one's retry where saveInFlight briefly looks
// "settled" even though the overall action is still in progress. doRefreshNow (see
// below) needs to wait out the FULL action, not just whichever single POST happens to be
// running at the moment it checks - see mutateAndSave for where this gets set.
let actionInFlight = null;
// baseHash, when passed, asks the server to reject this save (409) if the shared state
// has moved on since that hash was read - see mutateAndSave below for the retry loop
// that uses this. Returns "ok" (saved), "conflict" (rejected, base is stale), or
// "error" (network/other failure - already alerted). Existing callers that don't pass
// baseHash are unaffected - the server skips the check entirely when it's absent.
async function saveState(baseHash){
  // Serialize saves so overlapping calls don't race each other.
  logSync(`saveState() called, buyins=${(state.games||[]).map(g=>g.buyins.length).join(',')}`);
  const run = async () => {
    logSync("save: POST start");
    try {
      const params = [];
      if (baseHash) params.push("baseHash=" + encodeURIComponent(baseHash));
      const res = await fetch("/api/state" + (params.length ? "?" + params.join("&") : ""), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(state)
      });
      logSync("save: POST done");
      if (res.status === 409) return "conflict";
      // Cache the hash of what we just saved so the next mutateAndSave call can build
      // on it directly instead of needing a fresh GET first (see mutateAndSave).
      try { const body = await res.json(); if (body && body.hash) lastStateHash = body.hash; } catch(e) { /* fine - next save just re-syncs if needed */ }
      return "ok";
    }
    catch(e){ logSync("save: POST FAILED " + e); console.error("save failed", e); showAlert("שמירה נכשלה - בדוק את החיבור לאינטרנט ונסה שוב."); return "error"; }
  };
  saveInFlight = (saveInFlight || Promise.resolve()).then(run);
  return saveInFlight;
}

// Applies mutatorFn on top of the freshest known state and saves it, but if another
// device's save lands in between our sync and our save, the server rejects it (see
// saveState's baseHash) instead of silently overwriting their change - this re-syncs,
// re-applies the SAME mutation on the new base, and retries, rather than losing it.
// mutatorFn must look its own data up fresh each call (e.g. getGame(id) inside it), not
// close over references captured before this ran, since those become stale on retry.
// The first attempt skips the explicit re-sync GET and trusts lastStateHash as-is - it's
// already kept fresh by the periodic/SSE-driven background refresh, so paying for a full
// extra round trip before every single save just to confirm what we already knew doubled
// the visible latency of every action for no benefit in the common (no real conflict)
// case. The server's baseHash check still catches a genuinely stale base and rejects it
// (409) exactly as before - only THEN do we pay for a real sync, now that we know we
// actually need one, before retrying. lastStateHash can still be null this early (e.g.
// the very first action if the initial load's hash fetch itself failed) - that must
// never be sent as a falsy baseHash (the server skips its conflict check entirely when
// it's absent), so force a real sync in that case too.
async function mutateAndSave(mutatorFn){
  // Marks the ENTIRE call (every retry attempt, not just whichever POST happens to be
  // running right now) as in-flight, so a concurrent doRefreshNow waits out the whole
  // thing - see actionInFlight above. Without this, a conflict+retry on a slow connection
  // leaves a window, between the rejected attempt and the retry's own save, where
  // saveInFlight looks settled - a refresh landing in that window redraws the screen from
  // scratch with fresh (enabled) controls before this action has actually finished,
  // letting a frustrated second tap fire a genuine duplicate action.
  let resolveAction;
  actionInFlight = new Promise(res => { resolveAction = res; });
  try {
    const MAX_ATTEMPTS = 4;
    for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
      if (attempt > 0 || !lastStateHash) await syncBeforeMutate();
      const baseHash = lastStateHash;
      mutatorFn();
      const result = await saveState(baseHash);
      // true only once the server has actually accepted and stored this save - callers
      // that need to know the mutation is really confirmed (e.g. only playing a sound
      // once the backend confirms a buy-in landed, not just optimistically on click) rely
      // on this, not on the promise merely resolving.
      if (result !== "conflict") return result === "ok";
      logSync(`mutateAndSave: conflict on attempt ${attempt+1}, retrying`);
    }
    showAlert("לא הצלחנו לשמור בגלל התנגשות עם שמירה אחרת - נסו את הפעולה שוב.");
    return false;
  } finally {
    actionInFlight = null;
    resolveAction();
  }
}

// ---------- Relational-DB migration (Phase 6): roster/community write helpers ----------
// Feature-flagged off - the real production `public` schema doesn't have these tables
// yet (that only happens at the Phase 7 cutover), so this MUST stay false in anything
// deployed until then. Every wrapper below calls the /api/v2/... endpoints built in
// Phases 3-5, then patches the same local `state` object mutateAndSave's callers already
// mutate directly, so every existing render function keeps working unchanged regardless
// of which path is active - only the persistence mechanism differs.
// Server-controlled (see RELATIONAL_API_DEFAULT in server.py, set from init() below) -
// per-deployment, not hardcoded, so the exact same file serves production (off) and a
// staging deployment/local run (on, pointed at an isolated copy of the data) without
// ever needing to hand-edit this line and remember to revert it before committing.
let USE_RELATIONAL_API = false;

// Mirrors saveInFlight/actionInFlight above, but for THIS (v2Fetch-based) path - the one
// actually used in production (USE_RELATIONAL_API is on there). doRefreshNow's whole
// "don't apply a GET that raced a save still in flight" guard was built against
// mutateAndSave's tracking, which the v2AddBuyin/v2SetCashout/etc. wrappers never call -
// so in production that guard silently protected nothing, and a refresh landing between a
// v2 write's request and its local state patch could revert it (or diverge two devices)
// until the next refresh happened to catch up. Counted, not a single flag, since more
// than one v2Fetch call can genuinely overlap (e.g. initial load's parallel GETs).
let v2ActionCount = 0;
let v2ActionInFlight = null;
let resolveV2Idle = null;
function v2ActionBegin(){
  v2ActionCount++;
  if (v2ActionCount === 1) v2ActionInFlight = new Promise(res => { resolveV2Idle = res; });
}
function v2ActionFinish(){
  v2ActionCount = Math.max(0, v2ActionCount - 1);
  if (v2ActionCount === 0 && resolveV2Idle) {
    const r = resolveV2Idle;
    resolveV2Idle = null;
    v2ActionInFlight = null;
    r();
  }
}
// A hung request here (a bad connection, an overloaded/exhausted DB pool - a real
// possibility with several phones hitting the same small Postgres instance) would
// otherwise never resolve or reject at all, which - now that doRefreshNow waits out
// v2ActionInFlight before it's willing to trust a fresh GET - could wedge every future
// refresh right along with it, not just this one call. AbortController turns that into an
// ordinary failure after a bounded wait instead.
const V2_FETCH_TIMEOUT_MS = 20000;
async function v2Fetch(method, path, body){
  v2ActionBegin();
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), V2_FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(`/api/v2${path}`, {
      method,
      headers: body !== undefined ? {"Content-Type": "application/json"} : undefined,
      body: body !== undefined ? JSON.stringify(body) : undefined,
      signal: controller.signal,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 409) return {conflict: true};
      throw new Error(data.error || `${method} ${path} failed (${res.status})`);
    }
    return data;
  } catch(e) {
    if (e.name === "AbortError") throw new Error(`${method} ${path} timed out`);
    throw e;
  } finally {
    clearTimeout(timeoutId);
    v2ActionFinish();
  }
}

async function v2AddRosterPlayer(communityId, id, name){
  await v2Fetch("POST", `/communities/${communityId}/roster`, {id, name});
  getCommunity(communityId).roster.push({id, name});
}

async function v2RemoveRosterPlayer(communityId, playerId){
  await v2Fetch("DELETE", `/communities/${communityId}/roster/${playerId}`);
  const c = getCommunity(communityId);
  const removed = c.roster.find(p => p.id === playerId);
  c.roster = c.roster.filter(p => p.id !== playerId);
  if (removed && removed.clientId) {
    const stillLinkedElsewhere = state.communities.some(cm => cm.roster.some(p => p.clientId === removed.clientId));
    if (!stillLinkedElsewhere && state.globalPlayers) delete state.globalPlayers[removed.clientId];
  }
}

async function v2LinkRosterPlayer(communityId, playerId, clientId){
  await v2Fetch("PATCH", `/communities/${communityId}/roster/${playerId}`, {clientId});
  const p = getCommunity(communityId).roster.find(pl => pl.id === playerId);
  if (p) p.clientId = clientId;
}

// Adds a NEW permanent roster player already linked to an account for the given email,
// instead of the one-off "guest" path (see pickSeat) that never touches the roster at all.
// Refuses (throws with .status 409) if that email is already registered - this is for
// bringing in a genuinely new person, not for silently repointing an existing account.
// Three calls, not one - the server side deliberately stays three small, already-existing
// pieces (account pre-registration, roster insert, roster/account link) rather than one
// new endpoint that duplicates what v2AddRosterPlayer/v2LinkRosterPlayer already do.
async function v2PreRegisterPlayer(communityId, name, email){
  const playerId = uid();
  const res = await fetch("/api/auth/pre-register", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({email, name, playerId}),
  });
  const body = await res.json().catch(() => ({}));

async function v2RenamePlayerEverywhere(clientId, name){

// Retries an update-with-conflict-token call once after a 409 instead of leaving the
// caller (and ultimately the user) to treat it as an outright failure. Most of these
// conflicts are exactly the case doRefreshNow/applyFreshState's own comments describe -
// the client's locally-held updatedAt going stale between refreshes, not a real
// simultaneous edit - so re-syncing that one token and reapplying the SAME fields almost
// always succeeds on the very next attempt. Bounded to a single retry, not unconditional,
// so a genuinely repeated conflict (two people actually editing this at once) still ends
// up surfacing to the caller exactly like before. `attempt` must read the current
// updatedAt fresh each call (not close over a reference captured before `resync` ran) or
// the retry would just repeat the same stale token and conflict again.
async function withConflictRetry(attempt, resync){
  let result = await attempt();
  if (result.conflict) {
    await resync();
    result = await attempt();
  }
  return result;
}

// Returns the fresh updatedAt on success, or null on a 409 (caller should re-sync and
// retry, same shape mutateAndSave's callers already expect from a failed save).
async function v2UpdateCommunity(communityId, fields){
  const result = await withConflictRetry(
    () => v2Fetch("PATCH", `/communities/${communityId}`, {...fields, updatedAt: getCommunity(communityId).updatedAt}),
    async () => { state.communities = await v2Fetch("GET", "/communities"); }
  );
  if (result.conflict) return null;
  const c = getCommunity(communityId);
  Object.assign(c, fields);
  c.updatedAt = result.updatedAt;
  return result.updatedAt;
}

async function v2SetChipValues(communityId, chipValues, chipRatio){
  const result = await withConflictRetry(
    () => v2Fetch("PUT", `/communities/${communityId}/chip-values`, {chipValues, chipRatio, updatedAt: getCommunity(communityId).updatedAt}),
    async () => { state.communities = await v2Fetch("GET", "/communities"); }
  );
  if (result.conflict) return false;
  const c = getCommunity(communityId);
  c.chipValues = chipValues;
  c.chipRatio = chipRatio;
  c.updatedAt = result.updatedAt;
  return true;
}

// ---------- Phase 7: seating/buy-in/settlement write helpers (same pattern as Phase 6's
// roster/community ones above - call the /api/v2 endpoint, then patch the same local
// `state` object mutateAndSave's callers already mutate directly). Still behind
// USE_RELATIONAL_API - see that flag's own comment for why this can't be a partial cutover.

async function v2LoadGameFull(gameId){
  const g = await v2Fetch("GET", `/games/${gameId}`);
  const idx = state.games.findIndex(x => x.id === gameId);
  if (idx === -1) state.games.push(g); else state.games[idx] = g;
  return g;
}
// Cheap counterpart for a closed-and-settled game (see shouldShowGameResults/
// renderGameResultsScreen) - buyinTotals (one aggregated row per player, not every
// individual buy-in) instead of the full buyins/events v2LoadGameFull pulls, which stay
// unbounded as a community logs more rebuys over its lifetime. Stored on the SAME game
// object under a different field name (buyinTotals, not buyins) so code that expects full
// detail can't accidentally treat this partial load as if it were one.
async function v2LoadGameSummary(gameId){
  const g = await v2Fetch("GET", `/games/${gameId}/summary`);
  const idx = state.games.findIndex(x => x.id === gameId);
  if (idx === -1) state.games.push(g); else Object.assign(state.games[idx], g);
  return g;
}
// True once everyone's seated player has cashed out AND the declared chips roughly match
// what was bought in (same ±₪5 rounding tolerance the admin screen's own potUnbalanced
// check uses) - only then is a game truly final (see renderGameResultsScreen's own
// comment on why "closed" alone isn't enough: maybeAutoCloseNight sets g.closed the moment
// everyone's cashed out, even if the numbers don't actually add up yet, and that case still
// needs the full admin screen's pot-fix tools, not the simple read-only results screen).
function isGameSettled(g){
  if (!g.closed) return false;
  const buyinTotal = g.buyinTotals
    ? g.buyinTotals.reduce((s,bt)=>s+bt.amount, 0)
    : (g.buyins||[]).reduce((s,b)=>s+b.amount, 0);
  const cashedOutTotal = Object.values(g.cashouts||{}).reduce((s,co)=>s+(co.amount||0), 0);
  return Math.abs(cashedOutTotal - buyinTotal) <= 5;
}
// Loads whatever this game needs for the screen it's about to show, if it isn't already
// loaded - the cheap summary for a closed game (upgrading to full detail only if that
// turns out to be unbalanced and needs the admin screen's pot-fix tools after all), or full
// detail directly for a still-open one, which needs live interactivity either way.
async function ensureGameLoadedForView(gameId){
  let g = getGame(gameId);
  if (!g) return null;
  if (!g.closed) {
    if (!g.buyins) await v2LoadGameFull(gameId);
    return getGame(gameId);
  }
  if (!g.buyinTotals && !g.buyins) await v2LoadGameSummary(gameId);
  g = getGame(gameId);
  if (!isGameSettled(g) && !g.buyins) await v2LoadGameFull(gameId);
  return getGame(gameId);
}

async function v2CreateGame(id, communityId, name, date, createdByName, creatorPlayerId, creatorPlayerName){

// Returns the fresh updatedAt on success, null on a 409 (same shape as v2UpdateCommunity).
async function v2UpdateGame(gameId, fields){
  const result = await withConflictRetry(
    () => v2Fetch("PATCH", `/games/${gameId}`, {...fields, updatedAt: getGame(gameId).updatedAt}),
    () => v2LoadGameFull(gameId)
  );
  if (result.conflict) return null;
  const g = getGame(gameId);
  Object.assign(g, fields);
  g.updatedAt = result.updatedAt;
  return result.updatedAt;
}

// Returns true on success, false if the seat was already taken (caller re-syncs that one
// seat and lets the user pick another - see the section comment on the server side for
// why this is a single atomic DB check rather than a read-modify-write).
async function v2ClaimSeat(gameId, seatIndex, playerId, name){
  const result = await v2Fetch("POST", `/games/${gameId}/seats/${seatIndex}`, {playerId, name});
  if (result.conflict) return false;
  const g = getGame(gameId);
  g.seats = result.seats;
  g.updatedAt = result.updatedAt;
  if (!g.players.some(p => p.id === playerId)) g.players.push({id: playerId, name});
  if (g.liveChips[playerId] === undefined) g.liveChips[playerId] = 0;
  // First time ever seated in this game (not a returning cashed-out player - that path
  // clears their cashout entry directly, never calls claimSeat again) - auto-buy-in with
  // the community's first configured amount instead of leaving them seated with nothing
  // bought in and no screen asking them to pick one. Fire-and-forget: seat-claiming itself
  // must not block on a second full round trip, and performBuyin owns its own render()/
  // error handling/pending-banner lifecycle independently. myIdentity.name (whoever is
  // actually operating this device - themselves, or an admin seating someone else from
  // the admin screen), not the seated player's own `name`, so the feed attributes it
  // correctly either way (see performBuyin's actorName===playerName self-buy check).
  if (!g.buyins.some(b => b.playerId === playerId) && !pendingBuyinRequest) {
    const c = getCommunity(g.communityId);
    performBuyin(gameId, playerId, getBuyinAmounts(c)[0], {isEntry: true, actorName: myIdentity.name});
  }
  return true;
}

// v2 equivalent of seatPlayerIfRoom - finds an empty seat client-side and claims it via
// the atomic per-seat endpoint, retrying the next empty index on a 409 (someone else took
// that exact seat in the interim) instead of a whole-blob retry loop. Returns true if
// seated (including "already seated"), false if the table is genuinely full.
async function v2SeatPlayerIfRoom(gameId, playerId, name){
  const g = getGame(gameId);
  if (g.seats.includes(playerId)) return true;
  for (let attempt = 0; attempt < 3; attempt++) {
    const freshSeats = attempt === 0 ? g.seats : (await v2LoadGameFull(gameId)).seats;
    if (freshSeats.includes(playerId)) return true;
    let emptyIdx = freshSeats.findIndex((s,i) => i < 9 && !s);
    if (emptyIdx === -1 && freshSeats.length < 10) emptyIdx = freshSeats.length === 9 ? 9 : -1;
    if (emptyIdx === -1) return false; // table full (10/10)
    if (await v2ClaimSeat(gameId, emptyIdx, playerId, name)) return true;
    // Conflict - someone else claimed that exact seat between our read and our claim;
    // loop re-fetches and tries the next empty one.
  }
  return false;
}

// v2 equivalent of the local maybeAutoCloseNight(g) mutation - that one just flips
// g.closed and rides along inside whatever mutateAndSave save is already in flight; here
// there's no ambient save to ride along with, so this makes its own follow-up PATCH only
// when the check actually flips something.
async function v2MaybeAutoCloseNight(gameId){
  // Re-fetches fresh rather than trusting the local g.updatedAt: v2ClaimSeat/v2ClearSeat/
  // v2SwapSeats all bump games.updated_at server-side but don't return the new value to
  // sync locally, so the local copy of that field can be stale here - confirmed by
  // testing (a claim/clear right before this call made the very next v2UpdateGame below
  // silently no-op on a spurious 409, since it was still sending the old token).
  const g = await v2LoadGameFull(gameId);
  const seated = (g.seats || []).filter(Boolean);
  const shouldClose = g.players.length > 0 && seated.every(pid => pid in g.cashouts);
  if (shouldClose && !g.closed) await v2UpdateGame(gameId, {closed: true});
}

async function v2ClearSeat(gameId, seatIndex){
  const g = getGame(gameId);
  const playerId = g.seats[seatIndex];
  const result = await v2Fetch("DELETE", `/games/${gameId}/seats/${seatIndex}`);
  g.seats[seatIndex] = null;
  g.updatedAt = result.updatedAt;
  if (playerId) {
    g.buyins = g.buyins.filter(b => b.playerId !== playerId);
    delete g.liveChips[playerId];
  }
  await v2MaybeAutoCloseNight(gameId);
}

async function v2SwapSeats(gameId, fromIndex, toIndex){
  const result = await v2Fetch("PUT", `/games/${gameId}/seats/swap`, {fromIndex, toIndex});
  const g = getGame(gameId);
  g.seats = result.seats;
  g.updatedAt = result.updatedAt;
}

async function v2RemoveGamePlayer(gameId, playerId){
  const g = getGame(gameId);
  const wasClosed = g.closed;
  await v2Fetch("DELETE", `/games/${gameId}/players/${playerId}`);
  g.players = g.players.filter(p => p.id !== playerId);
  g.buyins = g.buyins.filter(b => b.playerId !== playerId);
  g.payboxPayments = (g.payboxPayments||[]).filter(pp => pp.playerId !== playerId);
  delete g.cashouts[playerId];
  delete g.liveChips[playerId];
  g.seats = g.seats.map(s => s === playerId ? null : s);
  if (wasClosed) g.closed = false;
  await v2MaybeAutoCloseNight(gameId);
}
