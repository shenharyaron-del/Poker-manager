// Percentage [x,y] position of each of the 9 main seat slots around the oval table -
// asymmetric on purpose (2 across the top, 3 down each side, a single seat at the
// bottom) rather than a mirrored layout, matching a real oval table's own seating.
// Index 5 (the single bottom seat) is the default "my seat" slot - see
// getMySeatPosition - and index 9 is the special "extra player" overflow slot,
// positioned separately. Shared between the real table render and the small preview in
// the identityName "המיקום שלי בשולחן" picker, so both draw from the exact same layout.
const SEAT_POS = [
  [32,7],[68,7],[89,26],[89,52],[78,76],[38,92],[18,76],[7,52],[7,26],[3,90]
];
// The table screen's default face for a seated player: their own name/total up top, their
// buy-in history, a one-tap buy-in row, a leave-the-table shortcut, and a WhatsApp-style
// feed of the whole table's recent buy-ins. Swipe left (see attachHandlers) to reach the
// classic circles view (renderTable) instead - isSeatedInGame in render() is what decides
// whether this screen is even reachable for the current viewer.
// Blocking welcome screen shown the first time a player opens their own player screen for
// a given game (see showBuyinConfirmCard, which now skips the green card/sound entirely for
// isEntry buy-ins in favor of this). hasWelcomedGame/markGameWelcomed (per-device
// localStorage, same pattern as announcedBuyinIds) make this fire exactly once per game.
function renderGameWelcomeOverlay(gameId, playerId){
  const g = getGame(gameId);
  if (!g) return "";
  const c = getCommunity(g.communityId) || {roster:[]};
  const p = g.players.find(pl => pl.id === playerId);
  const buyinTotal = g.buyins.filter(b => b.playerId === playerId).reduce((s,b) => s+b.amount, 0);
  const rp = c.roster.find(pl => pl.id === playerId);
  const female = !!rp && rp.gender === "female";
  const name = (p && p.name) || myIdentity.name || "שחקן";
  const careVerb = female ? "דאגי" : "דאג";
  return `
    <div class="game-welcome-overlay">
      <div class="game-welcome-card">
        <h2 class="serif" style="color:var(--gold);margin:0 0 14px;font-size:21px;">שלום ${esc(name)}!</h2>
        <p style="color:var(--text);font-size:15px;line-height:1.7;margin:0 0 16px;">
          נכנסת למשחק חדש עם <b style="color:var(--gold);">₪${buyinTotal}</b> בזיטונים.<br>
          כל ריביי (קנייה נוספת) במהלך הערב הוא באחריותך לדווח עליו באפליקציה.<br>
          כדי ש-Poker Manager ימשיך לעבוד כמו שצריך, ${careVerb} להישאר בתוך האפליקציה במהלך הערב ולשמור שהטלפון יהיה בהישג יד.
        </p>
        <p style="color:var(--muted);font-size:13px;margin:0 0 20px;">שיהיה לך ערב מוצלח!</p>
        <button class="btn btn-primary btn-block" data-dismiss-game-welcome="${gameId}">הבנתי, נתחיל לשחק</button>
        <button data-cancel-game-welcome="${gameId}" data-cancel-game-welcome-player="${playerId}" style="display:block;width:100%;background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;margin-top:12px;padding:6px;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:3px;">ביטול – נכנסתי בטעות</button>
      </div>
    </div>
  `;
}
function renderPlayerScreen(gameId){
  const g = getGame(gameId);
  if (!g) return `<div class="empty">משחק לא נמצא</div>`;
  const c = getCommunity(g.communityId) || {name:"קבוצה", roster:[]};
  const myPlayerId = myIdentity.myPlayers && myIdentity.myPlayers[g.communityId];
  const pid = myPlayerId;
  const p = g.players.find(pl => pl.id === pid);
  const myBuyins = g.buyins.filter(b => b.playerId === pid).slice().sort((a,b) => (a.ts||0)-(b.ts||0));
  const buyinTotal = myBuyins.reduce((s,b) => s+b.amount, 0);
  // Identifies the history frame's newest row, same purpose as latestFeedEventKey below -
  // render() only force-scrolls this frame to the bottom when this actually changes.
  const latestHistoryKey = myBuyins.length ? myBuyins[myBuyins.length-1].id : "";
  const cashedOut = pid in g.cashouts;
  // Once every seated player has cashed out (the night auto-closes via maybeAutoCloseNight
  // at that point - see its own comment) and the pot is balanced, show THIS player directly
  // who they owe/are owed by - computed purely from final chip counts (settleTransactions/
  // computeFinalBalances, same min-transfer pairing the admin screen's "מי מעביר למי" already
  // uses), not from any manual "who did you pay" selection.
  const seatedIdsForSettlement = (g.seats||[]).filter(Boolean);
  const allCashedOutForSettlement = seatedIdsForSettlement.length > 0 && seatedIdsForSettlement.every(sid => sid in g.cashouts);
  const totalBuyinsForSettlement = g.buyins.reduce((s,b)=>s+b.amount,0);
  const totalCashedOutForSettlement = Object.values(g.cashouts).reduce((s,co)=>s+co.amount,0);
  const potBalancedForSettlement = Math.abs(totalBuyinsForSettlement - totalCashedOutForSettlement) <= 5;
  const mySettlementTxns = (cashedOut && allCashedOutForSettlement && potBalancedForSettlement)
    ? settleTransactions(computeFinalBalances(g), g.players).filter(t => t.from === pid || t.to === pid)
    : [];
  // Cashed-out recap (buy-in / final chips / profit) plus a settlement-status line that
  // depends on the community's settlement mode and how far the night has progressed -
  // see the branches below for each combination.
  let cashedOutInfoHtml = "";
  if (cashedOut) {
    const finalChipsForInfo = (g.cashouts[pid]||{}).amount || 0;
    const profitForInfo = Math.round((finalChipsForInfo - buyinTotal) * 100) / 100;
    // Enlarged (was a plain 14px line alongside the buy-in/final-chips figures) now that
    // the history/feed sections below it are hidden once cashed out (item 8) - this is the
    // one number that freed-up space exists to foreground.
    const profitLine = profitForInfo >= 0
      ? `<div style="font-weight:800;font-size:34px;color:#6ee7b7;margin-top:6px;">רווח ${profitForInfo} שח</div>`
      : `<div style="font-weight:800;font-size:34px;color:#fda4af;margin-top:6px;">הפסד ${Math.abs(profitForInfo)} שח</div>`;
    const breakdownHtml = `
      <div style="font-size:14px;color:var(--muted);line-height:1.6;margin-top:6px;">
        <div>קניה: ${Math.round(buyinTotal)} שח</div>
        <div>ז'יטונים בסוף הערב: ${Math.round(finalChipsForInfo)} שח</div>
      </div>
      ${profitLine}
    `;
    const exitHighlights = computeExitHighlights(c, g, pid);
    const exitHighlightsHtml = exitHighlights.length ? `
      <div style="margin-top:18px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;">
        ${exitHighlights.map(t => `<div style="background:rgba(255,255,255,.06);border:1px solid var(--card-b);border-radius:12px;padding:12px 14px;text-align:center;font-size:14px;font-weight:600;color:var(--text);">${esc(t)}</div>`).join("")}
      </div>
    ` : "";
    const activePayboxLink = getActivePayboxLink(c);
    const activeBitLink = getActiveBitLink(c);
    let statusHtml = "";
    if (c.settlementDefault === 'paybox') {
      statusHtml = profitForInfo >= 0
        ? `<div style="font-size:13px;color:var(--muted);margin-top:10px;">הרווח יחולק אחרי שכולם ישלמו לקבוצה</div>`
        : (activePayboxLink
            ? `<a href="${esc(activePayboxLink)}" class="btn btn-block" style="margin-top:10px;background:#0891b2;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;"><img src="/static/paybox-icon.png" style="height:20px;width:auto;display:block;"> העברה לקבוצת פייבוקס</a>`
            : `<div style="font-size:12px;color:var(--muted);margin-top:10px;">לא הוגדרה קבוצת פייבוקס</div>`);
    } else if (c.settlementDefault === 'bit') {
      statusHtml = profitForInfo >= 0
        ? `<div style="font-size:13px;color:var(--muted);margin-top:10px;">הרווח יחולק אחרי שכולם ישלמו לקבוצה</div>`
        : (activeBitLink
            ? `<a href="${esc(activeBitLink)}" class="btn btn-block" style="margin-top:10px;background:#0070E0;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;"><img src="/static/bit-icon.png" style="height:20px;width:auto;display:block;"> העברה לביט הקבוצתי</a>`
            : `<div style="font-size:12px;color:var(--muted);margin-top:10px;">לא הוגדרה קבוצת ביט</div>`);
    } else if (allCashedOutForSettlement && potBalancedForSettlement) {
      statusHtml = mySettlementTxns.map(t => t.from === pid ? `
        <div style="margin-top:10px;">
          <div style="font-weight:700;color:#fda4af;">${t.amount} שח מעביר ל-${esc(t.toName)}</div>
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button class="btn flex1" data-open-bit-generic style="background:#0070E0;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;"><img src="/static/bit-icon.png" style="height:20px;width:auto;display:block;"> ביט</button>
            <a href="https://links.payboxapp.com" class="btn flex1" style="background:#0891b2;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;"><img src="/static/paybox-icon.png" style="height:20px;width:auto;display:block;"> פייבוקס</a>
          </div>
        </div>
      ` : `<div style="margin-top:10px;font-weight:700;color:#6ee7b7;">מקבל מ-${esc(t.fromName)} ${t.amount} שח</div>`).join("");
    } else if (g.closed) {
      statusHtml = `<div style="font-size:13px;color:var(--muted);margin-top:10px;">ממתין/ה שכולם יצאו מהשולחן</div>`;
    } else if (profitForInfo >= -0.005) {
      statusHtml = `<div style="font-size:13px;color:var(--muted);margin-top:10px;">הרווח יישלח אליך בסוף הערב</div>`;
    }
    // Lost, mid-game, not closed: no inline status text - the "who do I pay" modal
    // auto-opens itself instead (see attachHandlers/autoOpenedDirectPay).
    cashedOutInfoHtml = breakdownHtml + statusHtml + exitHighlightsHtml;
  }
  const canDeleteBuyins = true; // viewing/editing your own history here, always allowed
  // Carries its own playerId (data-delete-seat-buyin-player) rather than relying on
  // openHistorySeatPlayerId like the table view's popup does - this screen is always
  // mounted alongside the table view now (see the swipe carousel in render()), so setting
  // that shared global here on every render would constantly clobber the table view's own
  // open/closed popup state out from under it.
  const historyRows = myBuyins.map((b,idx) => {
    const trashBtn = (canDeleteBuyins && idx>0 && !cashedOut) ? `<button style="background:none;border:none;padding:2px;color:#dc2626;cursor:pointer;display:flex;float:left;margin-right:4px;" data-delete-seat-buyin="${b.id}" data-delete-seat-buyin-player="${pid}" title="ביטול תשלום">${icon('trash')}</button>` : '';
    return `<div class="chat-bubble">${trashBtn}<span class="bubble-time">${fmtTime(b.ts)}</span>${idx===0?'כניסה':`ריביי ${idx}`} · ₪${b.amount}</div>`;
  }).join("") || `<div class="chat-bubble" style="color:#888;">אין קניות עדיין</div>`;
  // Whole-table activity, oldest first (WhatsApp order) - buy-ins and cash-outs (derived
  // straight from g.buyins/g.cashouts, which already durably record them) merged with the
  // small game_events log (see logGameEvent/v2AddGameEvent) for the handful of action types
  // that leave no other trace to derive a feed entry from afterward: a deleted buy-in, a
  // player returned to the table, a seat removed outright, the whole night declared over.
  // Each buy-in's wording depends on whether it was that player's very first (their entry)
  // or a later rebuy, same distinction the history popup above already draws via idx===0;
  // each cash-out shows their final chip count and profit/loss against everything they
  // bought in for up to that point. Color coding (gray/white/red) and "ע"י X" attribution
  // when an admin acted on someone else's behalf - see FEED_COLORS/actorSuffix below.
  // Record every buy-in this device personally observes (see localBuyinLogs's own
  // comment), then diff against the current live list - any id that's in the log but no
  // longer in g.buyins was deleted, and gets its own struck-through "ghost" row back at
  // its true original timestamp instead of only the separate cancellation line.
  if (!localBuyinLogs[g.id]) localBuyinLogs[g.id] = {};
  const myBuyinLog = localBuyinLogs[g.id];
  g.buyins.forEach(b => { if (!myBuyinLog[b.id]) myBuyinLog[b.id] = {ts:b.ts, playerId:b.playerId, amount:b.amount, actorName:b.actorName}; });
  const liveBuyinIds = new Set(g.buyins.map(b => b.id));
  const ghostBuyins = Object.keys(myBuyinLog).filter(id => !liveBuyinIds.has(id)).map(id => Object.assign({id}, myBuyinLog[id]));
  const feedEvents = g.buyins.map(b => ({ts:b.ts, kind:"buyin", buyin:b}));
  ghostBuyins.forEach(b => feedEvents.push({ts:b.ts, kind:"buyin", buyin:b, ghost:true}));
  Object.keys(g.cashouts||{}).forEach(playerId => {
    feedEvents.push({ts: g.cashouts[playerId].ts, kind:"cashout", playerId, amount: g.cashouts[playerId].amount});
  });
  (g.events||[]).forEach(ev => feedEvents.push({ts: ev.ts, kind: ev.type, playerId: ev.playerId, amount: ev.amount, actorName: ev.actorName}));
  feedEvents.sort((a,b) => (a.ts||0)-(b.ts||0));
  // Identifies the newest event so render() can tell a genuinely new one apart from just
  // a re-render of the same data (see lastSeenFeedEventKey) - the vibrate trigger.
  const latestFeedEvent = feedEvents[feedEvents.length-1];
  const latestFeedEventKey = latestFeedEvent ? `${latestFeedEvent.ts}-${latestFeedEvent.kind}-${latestFeedEvent.kind==='buyin'?latestFeedEvent.buyin.id:latestFeedEvent.playerId}` : "";
  const FEED_COLORS = { gray: "#5c5c5c", white: "var(--text)" };
  // Carries an actorName whenever the actor differs from the player it's about - the 4
  // log-based event types always have (see logGameEvent/v2AddGameEvent); a buyin only does
  // for ones saved since actor_name was added to the buyins table (see performBuyin) -
  // older rows just read as undefined, same as a player doing it for themselves normally
  // reads. Omitted entirely (not "ע"י [own name]") when the actor IS the player it's about.
  const actorSuffix = (playerName, actorName) => (actorName && actorName !== playerName) ? ` ע"י ${esc(actorName)}` : "";
  // Picks the right verb form for the table activity feed - gender comes from the
  // player's own roster row (set from the identityName screen, see
  // v2SetGenderEverywhere), defaulting to male for a one-off guest (never in the roster
  // at all) same as the server does.
  const isFemale = playerId => { const rp = c.roster.find(pl => pl.id === playerId); return !!rp && rp.gender === "female"; };
  const feedCounts = {}, feedTotals = {};
  const feedRows = feedEvents.map(ev => {
    let text, rowIcon;
    // All white now - size/weight (see isRecent below) carries the "what's fresh"
    // distinction instead of a gray/white color split. A ghost (deleted) buy-in dims to
    // the gray instead, struck through - see the final return below.
    const color = ev.ghost ? FEED_COLORS.gray : FEED_COLORS.white;
    if (ev.kind === "buyin") {
      const b = ev.buyin;
      const player = g.players.find(pl => pl.id === b.playerId);
      const name = esc(player ? player.name : "שחקן");
      const fem = isFemale(b.playerId);
      rowIcon = 'coinsPlus';
      if (ev.ghost) {
        // Deleted since this device last saw it - a plain "עשה ריביי" without the
        // entry-vs-rebuy distinction (no longer knowable once it's gone) or a running
        // total (which must only reflect buy-ins that still actually count).
        text = `${name} ${fem?'עשתה':'עשה'} ריביי של ₪${b.amount}${actorSuffix(player?player.name:name, b.actorName)}`;
      } else {
        feedCounts[b.playerId] = (feedCounts[b.playerId]||0) + 1;
        feedTotals[b.playerId] = (feedTotals[b.playerId]||0) + b.amount;
        const isRebuy = feedCounts[b.playerId] > 1;
        text = isRebuy
          ? `${name} ${fem?'עשתה':'עשה'} ריביי של ₪${b.amount} (סה"כ קנייה של ₪${feedTotals[b.playerId]})${actorSuffix(player?player.name:name, b.actorName)}`
          : `${name} ${fem?'נכנסה':'נכנס'} לשולחן עם ₪${b.amount}${actorSuffix(player?player.name:name, b.actorName)}`;
      }
    } else if (ev.kind === "cashout") {
      const player = g.players.find(pl => pl.id === ev.playerId);
      const name = esc(player ? player.name : "שחקן");
      const totalBuyin = feedTotals[ev.playerId] || 0;
      const profit = ev.amount - totalBuyin;
      const profitText = profit >= 0 ? `₪${Math.round(profit)} רווח` : `₪${Math.abs(Math.round(profit))} הפסד`;
      text = `${name} ${isFemale(ev.playerId)?'יצאה':'יצא'} מהשולחן עם ₪${ev.amount} ז'יטונים בספירה (${profitText})`;
      rowIcon = 'out';
    } else if (ev.kind === "buyin_deleted") {
      const player = g.players.find(pl => pl.id === ev.playerId);
      const pname = player ? player.name : "שחקן";
      // The deleted buy-in's own row no longer comes from here - see the ghost-buyin
      // entries built from localBuyinLogs above, which (when this device saw the original
      // buy-in itself) show it struck through at its own true original timestamp instead
      // of paired next to this cancellation line.
      text = `${esc(pname)} ${isFemale(ev.playerId)?'ביטלה':'ביטל'} קנייה בסך ₪${ev.amount}${actorSuffix(pname, ev.actorName)}`;
      rowIcon = 'trash';
    } else if (ev.kind === "returned_to_table") {
      const player = g.players.find(pl => pl.id === ev.playerId);
      const pname = player ? player.name : "שחקן";
      text = `${esc(pname)} ${isFemale(ev.playerId)?'חזרה':'חזר'} לשולחן${actorSuffix(pname, ev.actorName)}`;
      rowIcon = 'undo';
    } else if (ev.kind === "seat_removed") {
      const player = g.players.find(pl => pl.id === ev.playerId);
      const pname = player ? player.name : "שחקן";
      text = `${esc(pname)} ${isFemale(ev.playerId)?'הוצאה':'הוצא'} מהשולחן${actorSuffix(pname, ev.actorName)}`;
      rowIcon = 'x';
    } else if (ev.kind === "night_declared_over") {
      text = `הוכרז על סיום ערב`;
      rowIcon = 'check';
    } else {
      return "";
    }
    // Bold + one font-size step up for anything in the last 5 minutes - draws the eye to
    // what's actually fresh without needing a separate "new" badge. Never applied to a
    // ghost row (a cancelled buy-in) regardless of how recent it was - struck through and
    // dimmed instead, which would otherwise visually fight with "fresh and bold".
    const isRecent = !ev.ghost && ev.ts && (Date.now() - ev.ts) < 5*60*1000;
    return `<div class="chat-bubble with-icon" style="color:${color};font-weight:${isRecent?700:400};font-size:${isRecent?15:13}px;${ev.ghost?'text-decoration:line-through;opacity:.7;':''}">${icon(rowIcon)}<div style="flex:1;min-width:0;"><span class="bubble-time">${fmtTime(ev.ts)}</span>${text}</div></div>`;
  }).join("") || `<div class="chat-bubble" style="color:#f5f5f4;">אין עדיין פעילות בשולחן</div>`;
  // Every rebuy control (including "אחר") stays disabled from the moment a buy-in request
  // is sent until it settles (success, cancel, or error) - see performBuyin/
  // pendingBuyinRequest - so a second tap can't fire a genuine duplicate buy-in while the
  // first one is still in flight.
  const buyinPending = !!(pendingBuyinRequest && pendingBuyinRequest.gameId === g.id && !pendingBuyinRequest.cancelled);
  const buyinButtonsHtml = playerScreenCustomOpen ? `
    <div class="buyin-frame" style="display:flex;gap:8px;margin-bottom:14px;flex-shrink:0;">
      <input type="number" inputmode="decimal" id="player-screen-custom-amount" placeholder="סכום" autofocus ${buyinPending?'disabled':''} style="flex:1;padding:14px 8px;font-size:18px;text-align:center;border-radius:9px;border:1px solid var(--gold);background:var(--input);color:var(--text);">
      <button class="chip-btn" data-player-buyin-custom-confirm ${buyinPending?'disabled':''} style="flex:0 0 auto;padding:14px 18px;font-size:16px;font-weight:700;">${icon('coinsPlus')}</button>
    </div>
  ` : `
    <div class="buyin-frame" style="display:flex;gap:8px;margin-bottom:14px;flex-shrink:0;">
      ${getBuyinAmounts(c).map(v=>`<button class="chip-btn" data-player-instant-buyin="${v}" ${buyinPending?'disabled':''} style="flex:1;padding:14px 2px;font-size:18px;">₪${v}</button>`).join("")}
      <button class="chip-btn" data-player-buyin-other ${buyinPending?'disabled':''} style="flex:1;padding:14px 2px;font-size:18px;">אחר</button>
    </div>
  `;
  // Order (top to bottom): name/total, ריביי buttons, the shared history/feed panel
  // (.player-history-feed, flex:1 - the one section whose size actually adapts, toggled
  // between the two tabs via playerHistoryTab so the leave-table box after it always stays
  // on screen), leave-table box. Nothing on this screen scrolls as a page (see
  // .player-screen-scroll) - only the active .player-history-feed-body pane scrolls internally.
  return `
    <div class="top row" style="padding-top:14px;padding-bottom:16px;flex-shrink:0;">
      <button class="back-arrow" data-back-community="${g.communityId}">${icon('back')}</button>
      <div class="flex1" style="min-width:0;">
        <h1 class="serif sm" style="color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(g.name || c.name)}</h1>
        <div class="meta" style="color:#6ee7b7;font-size:11px;display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${icon('cal')}${esc(g.date)}${g.createdByName ? ` · נוצר ע"י ${esc(g.createdByName)}` : ""}</div>
      </div>
      <button class="icon-btn gold" data-invite-game="${g.id}" title="הזמנת שחקן" style="flex-shrink:0;display:flex;align-items:center;gap:3px;font-size:10px;font-weight:700;white-space:nowrap;padding:5px 7px;">${icon('share')}הזמנת שחקן</button>
    </div>
    <div class="player-screen-scroll">
      <div style="text-align:center;padding:6px 0 16px;flex-shrink:0;">
        <div style="font-size:26px;font-weight:700;color:var(--text);">${esc(p?p.name:"")}</div>
        ${cashedOut ? "" : `<div data-player-total style="font-size:40px;font-weight:800;color:var(--gold);margin-top:4px;">₪${buyinTotal}</div>`}
        ${(() => {
          // Direct-settlement arrangement(s) involving this player (either side - see
          // getArrangementNotes), same note shown on the admin screen's rows.
          const notes = pid ? getArrangementNotes(g, pid) : [];
          if (!notes.length) return "";
          return `<div style="font-size:12px;color:var(--muted);margin-top:4px;">${notes.map(n => `${n.received?'קיבל':'העביר'} ₪${n.amount} ${n.received?'מ-':'ל-'}${esc(n.name)}`).join(' · ')}</div>`;
        })()}
        ${cashedOutInfoHtml}
      </div>
      ${cashedOut ? "" : `<div class="section-title" style="padding:0;margin:0 0 6px;flex-shrink:0;">ריביי</div>`}
      ${cashedOut ? "" : buyinButtonsHtml}
      ${cashedOut ? "" : `
      <div class="player-history-feed mode-${playerHistoryTab}">
        <div class="player-history-feed-tabs">
          <button class="player-history-feed-tab${playerHistoryTab==='history'?' active':''}" data-player-tab="history">היסטוריית הקניות שלי</button>
          <button class="player-history-feed-tab${playerHistoryTab==='feed'?' active':''}" data-player-tab="feed">פעילות בשולחן</button>
        </div>
        ${playerHistoryTab === 'history'
          ? `<div class="player-history-feed-body mode-history" data-player-history data-latest-buyin="${latestHistoryKey}">${historyRows}</div>`
          : `<div class="player-history-feed-body mode-feed" data-player-feed data-latest-event="${latestFeedEventKey}">${feedRows}</div>`}
      </div>
      `}
      ${cashedOut ? "" : `
      <div class="section-title" style="padding:0;margin:0 0 6px;flex-shrink:0;">סיום ערב (יציאה מהשולחן)</div>
      <div class="buyin-frame" style="display:flex;gap:6px;flex-shrink:0;">
        <button class="btn flex1" style="background:#B8862B;color:#1a1a1a;display:flex;align-items:center;justify-content:center;gap:4px;padding:11px 4px;font-size:13px;white-space:nowrap;" data-player-leave-table>${icon('out')}ספירת ז'יטונים</button>
        <button class="btn flex1" style="background:#B23A3A;color:#fff;display:flex;align-items:center;justify-content:center;gap:4px;padding:11px 4px;font-size:13px;white-space:nowrap;" data-player-leave-no-chips>${icon('out')}נשארתי בלי ז'יטונים 😞</button>
      </div>`}
    </div>
  `;
}

// Final, read-only screen for a game that's closed AND balanced (see isGameSettled) -
// takes over the "table" nav screen entirely instead of the player/table/admin carousel,
// since there's nothing left to edit once the pot itself is settled, only money left to
// actually hand over. Consolidates what used to be scattered across the player screen's
// cashed-out recap and the admin screen's own "מי מעביר למי" into one screen, and is also
// the destination ensureGameLoadedForView was built for - this is the one place a closed
// game's cheap v2LoadGameSummary payload (buyinTotals/cashouts/payments, no per-buyin
// rows or seats) is actually enough to render from, full v2LoadGameFull data never needed.
//
// Two layouts depending on the community's settlementDefault (confirmed with the user via
// mockups, see PR/commit history for the back-and-forth): 'direct' shows the player
// results list, then a SEPARATE "who pays whom" section grouped by payer with a checkbox
// per recipient (backed by player_payments); 'paybox'/'bit' shows a single group-payment
// button up top, then the same player list but with a checkbox on EVERY row (backed by
// paybox_payments) and no separate transfers section, since every payment routes through
// that one shared group link instead of player-to-player.
function renderGameResultsScreen(gameId){
  const g = getGame(gameId);
  if (!g) return `<div class="empty">משחק לא נמצא</div>`;
  const c = getCommunity(g.communityId) || {name:"קבוצה", roster:[]};
  // Works whether g came from v2LoadGameFull (g.buyins, individual rows) or
  // v2LoadGameSummary (g.buyinTotals, one aggregated row per player already) -
  // computeBalances/settleTransactions/computeFinalBalances only ever sum buyins per
  // player, never care which shape they started as.
  const synthGame = {
    players: g.players,
    buyins: g.buyins || (g.buyinTotals||[]).map(bt => ({playerId: bt.playerId, amount: bt.amount})),
    cashouts: g.cashouts || {},
  };
  const balances = computeBalances(synthGame);
  const myPlayerId = myIdentity.myPlayers && myIdentity.myPlayers[g.communityId];
  const results = g.players
    .filter(p => p.id in balances)
    .map(p => ({ id: p.id, name: p.name, profit: Math.round(balances[p.id].profit * 100) / 100 }))
    .sort((a,b) => b.profit - a.profit);
  const topProfit = results.length ? results[0].profit : 0;
  const isGroupPay = c.settlementDefault === 'paybox' || c.settlementDefault === 'bit';

  const payboxPayments = g.payboxPayments || [];
  const playerPayments = g.playerPayments || [];
  const payboxPaymentIdByPlayer = {};
  payboxPayments.forEach(pp => { payboxPaymentIdByPlayer[pp.playerId] = pp.id; });

  const playerRowsHtml = results.map(r => {
    const isMe = r.id === myPlayerId;
    const isWinner = r.profit > 0.005 && r.profit >= topProfit - 0.005;
    // Fixed-width slot rendered on EVERY row (empty when not the winner) rather than only
    // adding the crown's width for the one row that has it - otherwise every other name
    // starts one icon-width further right than the winner's, which read as misaligned.
    const crownHtml = `<span style="width:18px;display:inline-flex;justify-content:center;flex-shrink:0;color:var(--gold);">${isWinner ? icon('crown') : ''}</span>`;
    const paymentId = payboxPaymentIdByPlayer[r.id];
    const checked = isGroupPay && !!paymentId;
    // Checkbox placed AFTER the amount (not before) so it's the flex item flush against
    // the card's own edge, at the same x on every row - put first, its position would
    // shift with the amount's own width (digit count), which is exactly what looked
    // unaligned before.
    const checkboxHtml = isGroupPay
      ? `<input type="checkbox" data-result-paybox-toggle="${r.id}" data-amount="${r.profit}" data-payment-id="${paymentId||''}" ${checked?'checked':''} style="width:18px;height:18px;accent-color:var(--gold);flex-shrink:0;">`
      : "";
    return `
      <div class="card" style="cursor:default;${isMe ? 'border:1.5px solid var(--gold);' : ''}">
        <div class="flex1" style="display:flex;align-items:center;gap:6px;min-width:0;">
          ${crownHtml}
          <span style="font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(r.name)}${isMe ? ' <span style="color:var(--muted);font-weight:400;font-size:13px;">(את/ה)</span>' : ''}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
          <span style="font-weight:800;font-size:17px;color:${profitColor(r.profit)};${checked?'text-decoration:line-through;opacity:.5;':''}">₪${Math.abs(r.profit)}</span>
          ${checkboxHtml}
        </div>
      </div>`;
  }).join("");

  let topButtonHtml = "";
  let transfersHtml = "";
  if (isGroupPay) {
    if (c.settlementDefault === 'paybox') {
      const activeLink = getActivePayboxLink(c);
      topButtonHtml = activeLink
        ? `<a href="${esc(activeLink)}" class="btn btn-primary btn-block" style="margin-top:8px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:6px;"><img src="/static/paybox-icon.png" style="height:20px;width:auto;display:block;">פתיחת פייבוקס קבוצתי</a>`
        : `<div style="font-size:12px;color:var(--muted);margin-top:8px;margin-bottom:16px;text-align:center;">לא הוגדרה קבוצת פייבוקס</div>`;
    } else {
      topButtonHtml = `<button class="btn btn-primary btn-block" data-open-bit-generic style="margin-top:8px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:6px;background:#0070E0;color:#fff;"><img src="/static/bit-icon.png" style="height:20px;width:auto;display:block;">פתיחת ביט קבוצתי</button>`;
    }
  } else {
    const txns = settleTransactions(computeFinalBalances(synthGame), g.players);
    const byPayer = {};
    txns.forEach(t => { (byPayer[t.from] = byPayer[t.from] || {name:t.fromName, items:[]}).items.push(t); });
    const payerCardsHtml = Object.keys(byPayer).map(fromId => {
      const payer = byPayer[fromId];
      const rowsHtml = payer.items.map(t => {
        const existing = playerPayments.find(pp => pp.fromPlayerId === fromId && pp.toPlayerId === t.to);
        const paidStyle = existing ? 'text-decoration:line-through;opacity:.5;' : '';
        return `
          <div class="row-between" style="padding:6px 0;">
            <span style="${paidStyle}">${esc(t.toName)}</span>
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-weight:700;color:var(--gold);${paidStyle}">₪${t.amount}</span>
              <input type="checkbox" data-result-player-payment-toggle data-from="${fromId}" data-to="${t.to}" data-amount="${t.amount}" data-payment-id="${existing?existing.id:''}" ${existing?'checked':''} style="width:18px;height:18px;accent-color:var(--gold);">
            </div>
          </div>`;
      }).join("");
      return `
        <div class="roster-row" style="flex-direction:column;align-items:stretch;">
          <div style="font-weight:700;color:var(--text);margin-bottom:4px;">${esc(payer.name)} מעביר ל:</div>
          ${rowsHtml}
        </div>`;
    }).join("");
    transfersHtml = `
      <div class="section-title" style="padding:0;margin:20px 0 8px;">מי מעביר למי</div>
      ${payerCardsHtml || `<div class="empty" style="padding:10px 0;font-size:13px;">אין תשלומים נדרשים</div>`}
    `;
  }

  return `
    <div class="top row" style="padding-top:14px;padding-bottom:16px;flex-shrink:0;">
      <button class="back-arrow" data-back-community="${g.communityId}">${icon('back')}</button>

        <h1 class="serif sm" style="color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(g.name || c.name)}</h1>
        <div class="meta" style="color:#6ee7b7;font-size:11px;display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${icon('cal')}${esc(g.date)} · ${g.players.length} שחקנים</div>
      </div>
    </div>
    <div style="flex:1;min-height:0;overflow-y:auto;padding:0 20px 20px;touch-action:pan-y;">
      ${topButtonHtml}
      ${playerRowsHtml}
      ${transfersHtml}

}

// The admin screen (third carousel page, only for a table admin - see swipePageOrder/
// isTableAdmin) - the on-behalf-of-someone-else management actions that used to live in
// the table screen's bottom action panel before that was removed in favor of the player
// screen: buy in for another player, end their night, remove their seat entirely (a
// different action from ending their night - see PENDING_CHANGES history), bring a
// cashed-out player back, seat a new player into an empty slot, fix an unbalanced pot, and
// a read-only view of who still needs to pay whom. Reuses several existing modals as-is
// (buyin, seatChips, removeSeat, pickSeat, the data-return-to-game handler) rather than
// building parallel ones - they were already generic on m.playerId, just never had a
// trigger left pointing at someone OTHER than the viewer's own seat after that panel was
// removed.
function renderAdminScreen(gameId){
  const g = getGame(gameId);
  if (!g) return `<div class="empty">משחק לא נמצא</div>`;
  const c = getCommunity(g.communityId) || {name:"קבוצה", roster:[]};
  const seats = g.seats || new Array(9).fill(null);
  const buyinTotals = {};
  g.buyins.forEach(b => { buyinTotals[b.playerId] = (buyinTotals[b.playerId]||0) + b.amount; });
  const liveChips = g.liveChips || {};
  const seatedIds = seats.filter(Boolean);
  const stillActiveIds = seatedIds.filter(pid => !(pid in g.cashouts));
  const collapseOverrides = getAdminCollapseOverrides(gameId);
  const collapsedIds = stillActiveIds.filter(pid => defaultAdminCollapsed(g, pid) !== collapseOverrides.includes(pid));
  const activeIds = stillActiveIds.filter(pid => !collapsedIds.includes(pid));
  const cashedOutIds = seatedIds.filter(pid => pid in g.cashouts);
  const allCashedOut = seatedIds.length > 0 && cashedOutIds.length === seatedIds.length;
  const totalBuyinAll = seatedIds.reduce((s,pid)=>s+(buyinTotals[pid]||0),0);
  const totalChipsAll = seatedIds.reduce((s,pid)=>s+(liveChips[pid]||0),0);
  const diff = totalChipsAll - totalBuyinAll;
  const potUnbalanced = allCashedOut && Math.abs(diff) > 5;
  const nameOf = pid => (g.players.find(pl=>pl.id===pid)||{}).name || "?";
  // Small "קיבל/העביר ₪X מ-/ל-Y" line for a player's own direct-settlement arrangement(s)
  // (either side - see getArrangementNotes) - shown under their name wherever this screen
  // already shows them.
  const notesHtml = pid => {
    const notes = getArrangementNotes(g, pid);
    if (!notes.length) return "";
    return `<div style="font-size:11px;color:var(--muted);margin-top:2px;">${notes.map(n => `${n.received?'קיבל':'העביר'} ₪${n.amount} ${n.received?'מ-':'ל-'}${esc(n.name)}`).join(' · ')}</div>`;
  };

  const activeRows = activeIds.map((pid, idx) => {
    // A still-active player can already be the OTHER side of someone else's arrangement
    // (that someone already cashed out and named them) even before they themselves cash
    // out - lighting up their own "סיים ערב" button is a heads-up not to lose track of it
    // once they do.
    const hasArrangement = getArrangementNotes(g, pid).length > 0;
    // Inline ריביי row (replaces the old "buyin" modal) - "presets" shows the group's
    // configured amounts + "אחר" like the player screen's own one-tap row (see
    // buyinButtonsHtml), "custom" swaps that for a plain amount input, same two-level
    // toggle as playerScreenCustomOpen there. Disabling the other two buttons while open
    // avoids starting a conflicting action (end-night/remove-seat) mid-buy-in.
    const buyinUi = adminBuyinUi[pid] || "closed";
    const buyinOpen = buyinUi !== "closed";
    const buyinRowHtml = buyinUi === "custom" ? `
      <div style="display:flex;gap:6px;padding:0 10px 12px;">
        <input type="number" inputmode="decimal" id="admin-buyin-custom-${pid}" placeholder="סכום" autofocus ${pendingBuyinRequest?'disabled':''} style="flex:1;padding:10px 8px;font-size:15px;text-align:center;border-radius:9px;border:1px solid var(--gold);background:var(--input);color:var(--text);">
        <button class="chip-btn" data-admin-buyin-custom-confirm="${pid}" ${pendingBuyinRequest?'disabled':''} style="flex:0 0 auto;padding:10px 16px;font-size:14px;font-weight:700;">${icon('coinsPlus')}</button>
      </div>
    ` : buyinUi === "presets" ? `
      <div style="display:flex;gap:6px;padding:0 10px 12px;">
        ${getBuyinAmounts(c).map(v=>`<button class="chip-btn" data-admin-instant-buyin="${pid}" data-amount="${v}" ${pendingBuyinRequest?'disabled':''} style="flex:1;padding:10px 2px;font-size:13px;">₪${v}</button>`).join("")}
        <button class="chip-btn" data-admin-buyin-other="${pid}" ${pendingBuyinRequest?'disabled':''} style="flex:1;padding:10px 2px;font-size:13px;">אחר</button>
      </div>
    ` : "";
    return `
    <div class="roster-row" style="display:block;padding:0;overflow:hidden;">
      <div style="padding:12px 14px 8px;">
        <div class="row" style="justify-content:space-between;">
          <span style="font-weight:700;font-size:16px;">${esc(nameOf(pid))}</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span style="color:var(--gold);font-weight:800;font-size:20px;">₪${buyinTotals[pid]||0}</span>
            <button data-admin-collapse="${pid}" title="העבר למטה" style="background:none;border:none;color:var(--muted);padding:3px;cursor:pointer;line-height:0;">${icon('collapseDown')}</button>
          </span>
        </div>
        ${notesHtml(pid)}
      </div>
      <div style="display:flex;gap:5px;padding:0 10px 12px;">
        <button class="icon-btn ok" data-admin-buyin-toggle="${pid}" title="${buyinOpen?'בטל ריביי':'הוסף ריביי'}" ${pendingBuyinRequest?'disabled':''} style="flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:11px 1px;font-size:12px;font-weight:700;border-radius:10px;white-space:nowrap;">${buyinOpen?'':icon('coinsPlus')}${buyinOpen?'ביטול ריביי':'ריביי'}</button>
        <button class="icon-btn" style="flex:1;background:${hasArrangement?'#78350f':'#57534e'};color:${hasArrangement?'#fde68a':'#f5f5f4'};display:flex;align-items:center;justify-content:center;gap:4px;padding:11px 1px;font-size:12px;font-weight:700;border-radius:10px;white-space:nowrap;opacity:${buyinOpen?.4:1};" data-admin-end-night="${pid}" ${buyinOpen?'disabled':''} title="${hasArrangement?'יש סידור תשלום ישיר עם השחקן הזה - ':''}סיים ערב">${icon('out')}סיום ערב</button>
        <button class="icon-btn danger" data-admin-remove-seat="${pid}" title="הסר מושב" ${buyinOpen?'disabled':''} style="flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:11px 1px;font-size:12px;font-weight:700;border-radius:10px;white-space:nowrap;opacity:${buyinOpen?.4:1};">${icon('trash')}הסרה מהשולחן</button>
      </div>
      ${buyinRowHtml}
    </div>
  `;
  }).join("") || `<div class="empty" style="padding:10px 0;font-size:13px;">אין שחקנים פעילים</div>`;

  const collapsedRowsHtml = collapsedIds.length ? `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;">
      ${collapsedIds.map(pid => `
        <div data-admin-restore="${pid}" title="החזר לרשימה" style="display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--card-b);border-radius:10px;padding:6px 8px;min-width:0;cursor:pointer;">
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600;">${esc(nameOf(pid))}</span>
          <span style="color:var(--muted);padding:2px;line-height:0;flex-shrink:0;">${icon('undo')}</span>
        </div>
      `).join("")}
    </div>
  ` : "";

  const cashedOutRows = cashedOutIds.map(pid => {
    const profit = (liveChips[pid]||0) - (buyinTotals[pid]||0);
    return `<div class="roster-row">
      <div>
        <div class="row" style="gap:8px;"><span>${esc(nameOf(pid))}</span><span style="font-weight:700;color:${profitColor(profit)};">${profit>0?'+':''}₪${Math.round(profit)}</span></div>
        ${notesHtml(pid)}
      </div>
      <button class="btn btn-ghost btn-sm" data-admin-return-to-game="${pid}">${icon('undo')} החזר לשולחן</button>
    </div>`;
  }).join("");

  // Only the 9 real seats - index 9 is a vestigial "extra player" overflow slot from
  // elsewhere in the app (renderTable's own seatsHtml skips its empty state the same way,
  // see "if (i === 9) return \"\"") that isn't actually meant to be used - 9 players is the
  // real cap.
  const emptySeatIndices = seats.map((pid,i) => (pid===null && i<9) ? i : -1).filter(i=>i>=0);
  // One summary row instead of one per empty seat - any of them works identically for
  // seating a new player, so listing each by number added nothing but length.
  const emptySeatRows = emptySeatIndices.length ? `
    <div class="roster-row">
      <span style="color:var(--muted);">${emptySeatIndices.length} מקומות פנויים</span>
      <button class="btn btn-ghost btn-sm" data-admin-add-seat="${emptySeatIndices[0]}">${icon('plus')} הוסף שחקן</button>
    </div>
  ` : "";

  // Once everyone's cashed out but the declared chips don't match what was bought in by
  // more than ₪5, settling up between players off those numbers would just be wrong - an
  // equal-split correction across whichever players are checked, same as the old panel's
  // own pot-balance fix.
  let potFixHtml = "";
  if (potUnbalanced) {
    const direction = diff > 0.5 ? "חוסר" : "עודף";
    const selectedIds = seatedIds.filter(id => adminBalanceFixSelected[id]);
    const perPlayer = selectedIds.length ? Math.round((-diff / selectedIds.length) * 100) / 100 : 0;
    potFixHtml = `
      <div class="section-title" style="padding:0;margin:16px 0 8px;">סדר קופה</div>
      <div style="background:#450a0a;color:#fca5a5;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;text-align:center;font-weight:700;">הקופה לא מאוזנת - ${direction} של ₪${Math.abs(Math.round(diff))}</div>
      ${seatedIds.map(pid => {
        const playerProfit = (liveChips[pid]||0) - (buyinTotals[pid]||0);
        return `<div class="checkbox-row" style="cursor:pointer;">
          <input type="checkbox" data-admin-balance-fix-toggle="${pid}" ${adminBalanceFixSelected[pid]?'checked':''}>
          <span class="flex1">${esc(nameOf(pid))} <span style="color:${profitColor(playerProfit)};font-weight:700;">${playerProfit>0?'+':''}₪${Math.round(playerProfit)}</span></span>
        </div>`;
      }).join("")}
      ${selectedIds.length ? `<div style="text-align:center;color:var(--muted);font-size:12px;margin:6px 0;">${perPlayer>=0?'כל שחקן מסומן יקבל':'מכל שחקן מסומן יילקח'} ₪${Math.abs(perPlayer)}</div>` : ""}
      <button class="btn btn-primary btn-block" data-admin-fix-pot-balance style="background:#0891b2;color:#fff;" ${selectedIds.length?"":"disabled"}>${icon('coins')} סדר קופה</button>
    `;
  }

  // Read-only ("מידע בלבד", not a payment-recording UI) - who still needs to pay whom,
  // once the pot itself is balanced. Reuses the existing (previously orphaned)
  // settleTransactions/computeFinalBalances min-transfer calculation.
  let settlementHtml = "";
  if (allCashedOut && !potUnbalanced) {
    const txns = settleTransactions(computeFinalBalances(g), g.players);
    settlementHtml = `
      <div class="section-title" style="padding:0;margin:16px 0 8px;">מי מעביר למי</div>
      ${txns.length ? txns.map(t => `<div class="roster-row"><span>${esc(t.fromName)} ← ${esc(t.toName)}</span><span style="font-weight:700;color:var(--gold);">₪${t.amount}</span></div>`).join("") : `<div class="empty" style="padding:10px 0;font-size:13px;">אין תשלומים נדרשים</div>`}
    `;
  }

  return `
    <div class="top row" style="padding-top:14px;padding-bottom:16px;flex-shrink:0;">
      <button class="back-arrow" data-back-community="${g.communityId}">${icon('back')}</button>
      <div class="flex1" style="min-width:0;">
        <h1 class="serif sm" style="color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(g.name || c.name)}</h1>
        <div class="meta" style="color:#6ee7b7;font-size:11px;display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${icon('cal')}${esc(g.date)}${g.createdByName ? ` · נוצר ע"י ${esc(g.createdByName)}` : ""}</div>
      </div>
      <button class="icon-btn gold" data-invite-game="${g.id}" title="הזמנת שחקן" style="flex-shrink:0;display:flex;align-items:center;gap:3px;font-size:10px;font-weight:700;white-space:nowrap;padding:5px 7px;">${icon('share')}הזמנת שחקן</button>
    </div>
    <div data-admin-scroll style="flex:1;min-height:0;overflow-y:auto;padding:0 20px 20px;touch-action:pan-y;">
      ${(c.settlementDefault === 'paybox' || c.settlementDefault === 'bit') ? "" : `
      <div class="checkbox-row" style="cursor:pointer;margin-bottom:16px;" data-toggle-end-night="${g.id}">
        <input type="checkbox" ${g.closed?'checked':''} onclick="return false;">
        <span class="flex1">סיום ערב</span>
      </div>`}
      <div class="section-title" style="padding:0;margin:0 0 8px;">שחקנים פעילים</div>
      ${activeRows}
      ${collapsedRowsHtml}
      ${cashedOutIds.length ? `<div class="section-title" style="padding:0;margin:16px 0 8px;">יצאו מהשולחן</div>${cashedOutRows}` : ""}
      ${emptySeatRows ? `<div class="section-title" style="padding:0;margin:16px 0 8px;">מושבים פנויים</div>${emptySeatRows}` : ""}
      ${potFixHtml}
      ${settlementHtml}
    </div>
  `;
}
function renderTable(gameId){
  const g = getGame(gameId);
  if (!g) return `<div class="empty">משחק לא נמצא</div>`;
  const c = getCommunity(g.communityId) || {name:"קבוצה", roster:[]};
  const seats = g.seats || new Array(9).fill(null);
  const buyinTotals = {};
  g.buyins.forEach(b => { buyinTotals[b.playerId] = (buyinTotals[b.playerId]||0) + b.amount; });
  const liveChips = g.liveChips || {};
  if (DEBUG_SYNC) logSync(`renderTable: ${g.buyins.length} buyins, totals=${JSON.stringify(buyinTotals)}`);

  const seatedIds = seats.filter(Boolean);
  const allCashedOut = seatedIds.length > 0 && seatedIds.every(pid => pid in g.cashouts);
  const admin = isTableAdmin(g, c);
  const myPlayerId = myIdentity.myPlayers && myIdentity.myPlayers[g.communityId];

  // Rotate the visual layout only (the underlying seat indices are untouched, so
  // drag-to-swap - driven by data-seat/DOM position, not a hardcoded coordinate - keeps
  // working unchanged) so the viewer's own seat always
  // lands at their chosen slot (see getMySeatPosition/"המיקום שלי בשולחן" in the
  // identityName screen - defaults to index 5, bottom-center), everyone else arranged
  // around it. Seat 9, the special "extra player" overflow slot, never rotates.
  const mySeatIdx = myPlayerId ? seats.indexOf(myPlayerId) : -1;
  const rotationOffset = (mySeatIdx >= 0 && mySeatIdx < 9) ? ((getMySeatPosition() - mySeatIdx) % 9 + 9) % 9 : 0;
  const visualPos = (i) => i === 9 ? 9 : (i + rotationOffset) % 9;

  const seatsHtml = seats.map((pid, i) => {
    const [x,y] = SEAT_POS[visualPos(i)];
    if (!pid) {
      if (i === 9) return ""; // the 10th slot's empty state is handled by the dedicated "add extra player" button instead
      if (allCashedOut) return ""; // once the night is over, empty seats are just clutter
      // Only the table/community creator can seat a guest into an empty seat - everyone
      // else gets a plain circle (no +) that's still a valid drop target for repositioning
      // an already-seated player via drag, just not tappable to add someone new.
      return `<div class="seat-wrap" style="left:${x}%;top:${y}%;" data-seat="${i}"><div class="seat-circle vacant">${admin?'+':''}</div></div>`;
    }
    const p = g.players.find(pl => pl.id === pid);
    const name = p ? p.name : "?";
    const cashedOut = pid in g.cashouts;
    const buyin = buyinTotals[pid] || 0;
    const chips = liveChips[pid] || 0;
    const rosterP = c.roster.find(rp => rp.id === pid);
    const photo = rosterP && getPlayerPhoto(rosterP);
    let caption = `קנייה <span data-caption-for="${pid}">₪${buyin}</span>`;
    if (cashedOut) {
      const profit = chips - buyin;
      const sign = profit > 0 ? "+" : "";
      const profitColor = profit > 0.5 ? "#6ee7b7" : (profit < -0.5 ? "#fda4af" : "inherit");
      caption = `<span style="color:${profitColor};font-weight:700;font-size:16px;" data-caption-for="${pid}">${sign}₪${Math.round(profit)}</span>`;
    }
    // No avatar photo - show the P logo rather than name initials, same fallback already
    // used for the home-screen avatar and the identityName preview.
    const circleStyle = cashedOut ? "" : ` style="background-image:url('${photo || '/static/logo-watermark.png'}');background-size:cover;background-position:center;"`;
    const doorIconBig = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>';
    const circleInner = cashedOut ? doorIconBig : "";
    // The ring stays the fixed cashed-out gray for a player who's already left - only an
    // active seat's ring changes color, cyan for the viewer's own seat.
    const ringClass = cashedOut ? "" : (pid === myPlayerId ? " ring-self" : "");
    // The buy-in history chevron/popup (only for an active seat - once cashed out, this
    // is covered by the summary screen instead). First buy-in is labeled "כניסה", every
    // one after it "ריביי N". Only the viewed player themselves or the table's creator
    // can delete a row from here, matching the same admin gate used everywhere else on
    // this screen (isTableAdmin).
    let historyToggleHtml = "", historyPopupHtml = "", infoRadius = "";
    let popupBelow = true;
    if (!cashedOut) {
      const historyOpen = openHistorySeatPlayerId === pid;
      const canDeleteBuyins = pid === myPlayerId || admin;
      const sortedBuyins = g.buyins.filter(b => b.playerId === pid).slice().sort((a,b) => (a.ts||0)-(b.ts||0));
      historyToggleHtml = `<button class="seat-history-toggle${historyOpen?' open':''}" data-toggle-seat-history="${pid}" title="היסטוריית קניות">
        <svg width="10" height="7" viewBox="0 0 12 8"><path d="M1 1L6 6L11 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>`;
      if (historyOpen) {
        // The first buy-in ("כניסה") is what got them into the table at all - it can't be
        // deleted from here, only the rebuys after it. The trash icon's own slot is
        // always reserved (even empty,
        // on the כניסה row) so the label text itself always starts at the same x position
        // whether or not that row actually has a delete button.
        const rows = sortedBuyins.map((b,idx) => {
          const trashBtn = (canDeleteBuyins && idx>0) ? `<button style="background:none;border:none;padding:2px;color:#dc2626;cursor:pointer;display:flex;" data-delete-seat-buyin="${b.id}" title="ביטול תשלום">${icon('trash')}</button>` : '';
          return `
          <div class="seat-history-row">
            <span style="display:flex;align-items:center;gap:4px;">
              <span style="width:20px;flex-shrink:0;display:inline-flex;justify-content:center;">${trashBtn}</span>
              <span>${idx===0?'כניסה':`ריביי ${idx}`}${b.ts?` · ${fmtTime(b.ts)}`:''}</span>
            </span>
            <span>₪${b.amount}</span>
          </div>`;
        }).join("") || `<div class="seat-history-row" style="border:none;color:#888;">אין קניות עדיין</div>`;
        const hAlign = x > 60 ? 'right:0;' : (x < 40 ? 'left:0;' : 'left:50%;transform:translateX(-50%);');
        // A seat low enough on the table has too little room below it before hitting
        // .poker-table-wrap's own overflow:hidden edge - open upward instead (over the
        // avatar) so the popup lands on visible felt instead of getting clipped away.
        popupBelow = y <= 60;
        const vAlign = popupBelow ? 'top:100%;bottom:auto;margin-top:0;' : 'top:auto;bottom:100%;margin-bottom:4px;';
        // Square off the edge that touches the nameplate so the two read as one
        // continuous card (see infoRadius below) - only when opening downward, since
        // opening upward overlaps the avatar instead of the nameplate.
        const radius = popupBelow ? '0 0 10px 10px' : '10px';
        historyPopupHtml = `<div class="seat-history-popup" style="${hAlign}${vAlign}border-radius:${radius};" data-seat-history-popup>${rows}</div>`;
        if (popupBelow) infoRadius = "border-radius:10px 10px 0 0;";
      }
    }
    // Trapped inside .seat-wrap's own stacking context (the transform below creates one),
    // so a plain z-index on the popup can't outrank a LATER sibling seat's own content -
    // only raising the whole open seat's wrap actually lifts its popup above every other
    // seat, regardless of table order.
    const wrapZ = openHistorySeatPlayerId === pid ? 'z-index:70;' : '';
    return `<div class="seat-wrap" style="left:${x}%;top:${y}%;${wrapZ}" data-seat="${i}">
      <div class="seat-circle filled ${cashedOut?'cashed-out':''}${ringClass}"${circleStyle}>${circleInner}</div>
      <div class="seat-info" data-seat-info style="position:relative;${infoRadius}">
        ${historyToggleHtml}
        <div class="seat-name">${esc(name)}</div>
        <div class="seat-caption">${caption}</div>
        ${historyPopupHtml}
      </div>
    </div>`;
  }).join("");

  const totalBuyinAll = seatedIds.reduce((s,pid)=>s+(buyinTotals[pid]||0),0);
  const totalChipsAll = seatedIds.reduce((s,pid)=>s+(liveChips[pid]||0),0);
  const diff = totalChipsAll - totalBuyinAll;
  const diffLabel = diff > 0.5 ? "קופה בחוסר" : (diff < -0.5 ? "קופה בעודף" : "קופה מאוזנת");
  const diffColor = diff > 0.5 ? "#fda4af" : (diff < -0.5 ? "#6ee7b7" : "var(--muted)");

  // Once everyone's cashed out, the pot's balanced, and the community settles directly
  // (not via a shared paybox pot) - draw who-pays-whom straight onto the table as arrows
  // between seats (see drawSettlementArrows, called from render() after this markup is in
  // the DOM). Filtered to the viewer's own transfers when they're seated at this table -
  // full picture for everyone else (e.g. a non-playing admin watching).
  currentSettlementTransfers = null;
  const potUnbalanced = allCashedOut && Math.abs(diff) > 5;
  if (allCashedOut && !potUnbalanced && c.settlementDefault !== "paybox") {
    const { remaining, alreadyPaid } = computeSettlementTransfers(g);
    const allTransfers = [
      ...remaining.map(t => ({ fromId: t.from, toId: t.to, amount: t.amount, paid: false })),
      ...alreadyPaid.map(t => ({ fromId: t.fromPlayerId, toId: t.toPlayerId, amount: t.amount, paid: true })),
    ];
    // Defaults to the viewer's own seat (not "show everyone"); tapping another seat while
    // arrows are showing overrides this to that player instead (see attachHandlers'
    // [data-seat] handling) - tapping the same one again clears back to this default.
    const defaultFilterId = seatedIds.includes(myPlayerId) ? myPlayerId : null;
    const filterId = (settlementFilterPlayerId && seatedIds.includes(settlementFilterPlayerId)) ? settlementFilterPlayerId : defaultFilterId;
    currentSettlementTransfers = { seats, transfers: allTransfers, filterId };
  }

  // Which half of the table the viewer's own seat slot falls in, so the crop direction
  // (see .poker-table-inner CSS above) always keeps THEIR seat in view: a seat in the top
  // half means the table should crop away from the bottom instead, everyone else crops
  // from the top.
  const mySlotY = SEAT_POS[getMySeatPosition()][1];
  const cropClass = mySlotY < 50 ? "crop-from-bottom" : "crop-from-top";

  return `
    <div class="top row" style="padding-top:14px;padding-bottom:16px;">
      <button class="back-arrow" data-back-community="${g.communityId}">${icon('back')}</button>
      <div class="flex1" style="min-width:0;">
        <h1 class="serif sm" style="color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(g.name || c.name)}</h1>
        <div class="meta" style="color:#6ee7b7;font-size:11px;display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${icon('cal')}${esc(g.date)}${g.createdByName ? ` · נוצר ע"י ${esc(g.createdByName)}` : ""}</div>
      </div>
      <button class="icon-btn gold" data-invite-game="${g.id}" title="הזמנת שחקן" style="flex-shrink:0;display:flex;align-items:center;gap:3px;font-size:10px;font-weight:700;white-space:nowrap;padding:5px 7px;">${icon('share')}הזמנת שחקן</button>
    </div>
    ${!allCashedOut ? `
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:0 20px 10px;">
      <span data-open-poker-odds style="color:#C8902F;font-size:12px;text-align:center;line-height:1.3;cursor:pointer;">מחשבון<br>סיכויי פוקר</span>
      <button class="icon-btn" data-open-poker-odds title="מה הסיכויים שלי" style="flex-shrink:0;width:48px;height:auto;background:none;border:none;padding:0;display:inline-flex;align-items:center;justify-content:center;">
        <img src="/static/odds-coin.png" style="width:48px;height:auto;display:block;">
      </button>
    </div>` : ""}
    <div class="poker-table-wrap">
      <div class="poker-table-inner ${cropClass}">
        <div class="poker-table-felt"></div>
        ${seatsHtml}
        <div id="settlement-overlay" style="position:absolute;inset:0;pointer-events:none;"></div>
        <div style="position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;z-index:3;">
          <img src="/static/logo-p-crown.png" style="width:37px;height:auto;margin-bottom:8px;pointer-events:none;">
          <div style="color:var(--muted);font-size:12px;">סה"כ קנייה ₪${totalBuyinAll}</div>
          <div style="color:var(--muted);font-size:12px;">סה"כ ז'יטונים ₪${totalChipsAll}</div>
          <div style="color:${diffColor};font-weight:700;font-size:13px;margin-top:4px;">${diffLabel}${Math.abs(diff)>=0.5?` ₪${Math.abs(Math.round(diff))}`:""}</div>
        </div>
      </div>
    </div>
  `;
}

      <p style="color:var(--muted);font-size:12px;margin:0 0 14px;">הגדרת סכומי הריביי וסכום הכניסה לשולחן.</p>
      <div class="section-title" style="padding:0;margin:0 0 6px;">ריביי</div>
      <p style="color:var(--muted);font-size:12px;margin:0 0 10px;">3 הסכומים שיוצגו בכל כפתורי הריביי באפליקציה - כל אחד חייב להיות גדול מהקודם לו.</p>
      <div style="display:flex;gap:8px;margin-bottom:6px;">
        ${getBuyinAmounts(c).map((v,i) => `<input type="number" inputmode="numeric" data-buyin-amount-input="${i}" value="${v}" style="flex:1;text-align:center;">`).join("")}
      </div>
      <p style="color:var(--muted);font-size:11px;margin:0 0 18px;">סכום הכניסה לשולחן הוא הסכום הימני (הראשון).</p>
      <button class="btn btn-primary btn-block" data-save-buyin-amounts>שמור שינויים</button>
    `;
  } else if (m.type === "pickSeat") {
    const g = getGame(m.gameId);
    const c = getCommunity(g.communityId);
    const seated = new Set((g.seats||[]).filter(Boolean));
    const avail = c.roster.filter(p => !seated.has(p.id)).sort((a,b) => a.name.localeCompare(b.name, 'he'));
    title = `מי יושב במקום ${m.seatIndex+1}?`;
    body = `
      ${avail.length ? `
        <div class="scroll-list">
          ${avail.map(p => `<div class="checkbox-row" data-pick-player="${p.id}"><span class="flex1">${esc(p.name)}</span></div>`).join("")}

      ` : `<div class="empty" style="padding:12px 0;">כל השחקנים בקבוצה כבר יושבים בשולחן.</div>`}
