      <p style="color:var(--muted);font-size:11px;margin:0 0 8px;">שחקן חד-פעמי למשחק הזה בלבד - לא יתווסף לרשימת השחקנים הקבועה של הקבוצה.</p>
      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <input type="text" id="pick-seat-guest-name" placeholder="שם האורח" style="flex:1;">
        <button class="btn btn-primary" data-add-guest-seat>${icon('plus')}</button>
      </div>
      <div class="section-title" style="padding:0;margin:0 0 8px;">או הוסיפו שחקן קבוע לקבוצה</div>
      <p style="color:var(--muted);font-size:11px;margin:0 0 8px;">יתווסף לרשימת השחקנים הקבועה, ויוכל להתחבר בעתיד עם האימייל הזה.</p>
      <div class="field"><input type="text" id="pick-seat-permanent-name" placeholder="שם השחקן"></div>
      <div class="field"><input type="email" id="pick-seat-permanent-email" placeholder="אימייל" dir="ltr"></div>
      ${m.permanentError ? `<p style="color:#fda4af;font-size:12px;margin-bottom:8px;">${esc(m.permanentError)}</p>` : ""}
      <button class="btn btn-primary btn-block" data-add-permanent-seat>${icon('plus')} הוסף שחקן קבוע</button>
    `;
  } else if (m.type === "seatBuyins") {
    const g = getGame(m.gameId);
    const p = g.players.find(pl=>pl.id===m.playerId);
    const buyinTotal = g.buyins.filter(b=>b.playerId===m.playerId).reduce((s,b)=>s+b.amount,0);
    title = esc(p ? p.name : "שחקן");
    body = `
      <div class="roster-row"><span>סה"כ קנייה</span><span style="font-weight:700;">₪${buyinTotal}</span></div>
      <label style="display:block;color:#059669;font-size:11px;margin-bottom:4px;">סכום קנייה</label>
      ${!m.otherOpen ? `
        <div class="chip-row">
          ${[50,80,100,200].map(v=>`<button class="chip-btn" data-seat-instant-chip="${v}">₪${v}</button>`).join("")}
          <button class="chip-btn" data-seat-other-toggle>אחר</button>
        </div>
      ` : `
        <div class="field"><input type="number" inputmode="decimal" id="seat-buyin-amount" placeholder="הסכום" autofocus></div>
        <button class="btn btn-ghost btn-block" data-confirm-seat-buyin style="margin-bottom:14px;">${icon('plus')} הוסף קנייה</button>
      `}
      <button class="btn btn-ghost btn-block" data-seat-history style="margin-bottom:14px;">${icon('bar')} היסטוריית קניות הערב</button>
    `;
  } else if (m.type === "seatChips") {
    const g = getGame(m.gameId);
    const c = getCommunity(g.communityId);
    const p = g.players.find(pl=>pl.id===m.playerId);
    const chips = (g.liveChips||{})[m.playerId] || 0;
    const buyinTotal = g.buyins.filter(b=>b.playerId===m.playerId).reduce((s,b)=>s+b.amount,0);
    const cashedOut = m.playerId in g.cashouts;
    title = `סיום ערב: ${esc(p ? p.name : "שחקן")}`;
    const chipValues = c.chipValues || [];
    const ratio = c.chipRatio;
    // Four distinct, mutually-exclusive ways to arrive at the same ₪ total - shown one at
    // a time behind a mode switch instead of several inline together, which read as one
    // confusing combined form (unclear which field to actually use, leftover values in
    // the others). Only offer a mode the community actually has data for; "direct"
    // (typing the ₪ total by hand) is always available as a fallback.
    const availableModes = [
      {key:"chips", label:"סכום ז'יטונים"},
      {key:"profit", label:"רווח/הפסד"},
      chipValues.length ? {key:"byColor", label:"לפי צבע"} : null,
    ].filter(Boolean);
    const mode = (m.chipsMode && availableModes.some(am => am.key === m.chipsMode)) ? m.chipsMode : availableModes[0].key;
    const modeTabs = `
      <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;">
        ${availableModes.map(am => `<button class="btn ${mode===am.key?'btn-primary':'btn-ghost'} flex1" data-chips-mode="${am.key}" style="padding:8px;font-size:12px;min-width:80px;">${am.label}</button>`).join("")}
      </div>
    `;
    // Fixed, non-editable recap at the top - same three numbers regardless of which mode
    // is active below, live-updated on every keystroke in that mode's own input(s).
    const initProfit = Math.round((chips-buyinTotal)*100)/100;
    const headerHtml = `
      <div style="background:rgba(255,255,255,.05);border-radius:12px;padding:12px 4px;margin-bottom:22px;display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;">
        <div><div style="font-size:11px;color:var(--muted);">סה"כ קנייה</div><div style="font-weight:700;">₪${buyinTotal}</div></div>
        <div><div style="font-size:11px;color:var(--muted);">ז'יטונים שספרנו</div><div id="chips-header-counted" style="font-weight:700;">₪${chips}</div></div>
        <div><div style="font-size:11px;color:var(--muted);">רווח/הפסד</div><div id="chips-header-profit" style="font-weight:700;color:${profitColor(initProfit)};">${initProfit>0?'+':''}₪${initProfit}</div></div>
      </div>
    `;
    // If any already-departed player arranged payment directly through THIS player (see
    // arrangedWith below and computeArrangementAdjustments), note it right under the
    // recap - otherwise the jump in what this player owes the group looks unexplained.
    const arrangedByOthers = Object.entries(g.cashouts).filter(([id,co]) => id !== m.playerId && co.arrangedWith && co.arrangedWith.includes(m.playerId));
    let arrangedNoteHtml = "";
    if (arrangedByOthers.length) {
      const rawBalances = computeBalances(g);
      const names = [];
      let total = 0;
      arrangedByOthers.forEach(([id]) => {
        const pl = g.players.find(pp => pp.id === id);
        total += Math.abs((rawBalances[id]||{}).profit || 0);
        if (pl) names.push(pl.name);
      });
      arrangedNoteHtml = `<p style="color:var(--text);font-size:12px;margin:-14px 0 16px;text-align:center;">כולל ₪${Math.round(total)} שהועברו ע"י ${names.map(esc).join(', ')} שעזב/ו את השולחן</p>`;
    }
    // Separate from arrangedNoteHtml above - this is a direct player-to-player payment,
    // not a cash handoff folded into the group settlement math. Without this, a player
    // who was paid this way off-app has no way to see it reflected on their own
    // end-of-night screen at all.
    const directPaymentsReceived = (g.playerPayments||[]).filter(pp => pp.toPlayerId === m.playerId);
    let directPaymentsNoteHtml = "";
    if (directPaymentsReceived.length) {
      const total = directPaymentsReceived.reduce((s,pp) => s+pp.amount, 0);
      const names = directPaymentsReceived.map(pp => {
        const pl = g.players.find(pp2 => pp2.id === pp.fromPlayerId);
        return pl ? pl.name : "?";
      });
      directPaymentsNoteHtml = `<p style="color:var(--text);font-size:12px;margin:-14px 0 16px;text-align:center;">קיבלת ₪${Math.round(total)} מ-${names.map(esc).join(', ')}</p>`;
    }
    let modeBody;
    if (mode === "byColor") {
      // Photo-count sub-feature: reuses the exact same AI-vision plumbing chipSetup
      // already uses (callClaudeVisionMulti/resizeImageDataUrl/urlToDataUrl) - the
      // reference photo per chip type captured there is exactly what lets this tell two
      // similarly-colored denominations apart instead of guessing from color alone. Stack
      // markers are positioned over each photo the same %-offset way chipSetup's own
      // markers are, just read-only (no drag/resize - correcting a miscount is done in
      // the table below, not on the photo). Up to 2 photos (m.chipPhotos) - a single shot
      // covers most tables, but a second one lets stacks that didn't fit the first frame
      // get counted too; the table below sums across whichever photos exist (see
      // refillCountsFromPhotos in attachHandlers).
      const chipPhotos = m.chipPhotos || [];
      const renderPhotoBlock = (photo, isAnalyzing) => {
        const stackMarkers = (photo.w && photo.h) ? (photo.stacks||[]).map(st => {
          const [x1,y1,x2,y2] = st.box;
          const leftPct = (x1/photo.w)*100, topPct = (y1/photo.h)*100;
          const wPct = ((x2-x1)/photo.w)*100, hPct = ((y2-y1)/photo.h)*100;
          const cv = chipValues.find(v => v.id === st.chipValueId);
          // Only the label itself is framed (one thin border, transparent fill) - this
          // used to also draw a second border+tint around the whole detected box, which
          // read as two overlapping squares. Positioned INSIDE the detected area, anchored
          // to its top edge (not floating above it) so a stack near the top of the photo
          // doesn't push the label above the image entirely, clipped and invisible.
          return `
            <div style="position:absolute;left:${leftPct}%;top:${topPct}%;width:${wPct}%;height:${hPct}%;pointer-events:none;">
              <div style="position:absolute;top:2px;left:50%;transform:translateX(-50%);background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:2px 6px;font-weight:800;font-size:12px;line-height:1.3;text-align:center;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.9);">
                <div>${st.count}</div>
                <div style="font-weight:700;font-size:10px;">× ₪${cv ? cv.value : '?'}</div>
              </div>
            </div>`;
        }).join("") : "";
        return `
          <div style="width:100%;margin-bottom:8px;position:relative;">
            <img src="${photo.src}" draggable="false" style="width:100%;border-radius:12px;display:block;${isAnalyzing?'opacity:.5;':''}">
            ${stackMarkers}
            ${isAnalyzing ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;"><span class="poker-loading-spin">${icon('chip')}</span></div>` : ""}
          </div>`;
      };
      // Which stack sizes actually exist tonight - told to the AI as a hard constraint
      // instead of letting it guess/default. Guessing was the root of a real, persistent
      // failure mode: when only two of the four possible sizes are physically present (say
      // 5 and 1, no 10 anywhere), the model has no absolute reference to tell "this is the
      // tallest pile because it's a 10" apart from "this is the tallest pile because it's
      // the tallest of only two sizes actually here" - four different prompt rewordings
      // all failed to fix this through reasoning alone. Asking the user (who already knows)
      // removes the ambiguity entirely instead of hoping the model infers it.
      const ALL_CHIP_SIZES = [10,5,3,1];
      const selectedSizes = (m.chipStackSizes && m.chipStackSizes.length) ? m.chipStackSizes : [10,5,1];
      const sizeTogglesHtml = `
        <div style="display:flex;gap:6px;margin-bottom:6px;">
          ${ALL_CHIP_SIZES.map(sz => `<button type="button" class="btn ${selectedSizes.includes(sz)?'btn-primary':'btn-ghost'} flex1" data-chip-size-toggle="${sz}" style="padding:8px 4px;font-size:14px;font-weight:700;">${sz}</button>`).join("")}
        </div>
        <p style="color:var(--muted);font-size:11px;margin:0 0 12px;">סמנו אילו גדלי ערימות קיימים הערב - זה מונע מה-AI לנחש גדלים שלא קיימים.</p>
      `;
      const photoAreaHtml = chipPhotos.length ? `
        ${chipPhotos.map((photo,i) => renderPhotoBlock(photo, m.analyzingChipCount && i === chipPhotos.length-1)).join("")}
        <p style="color:var(--muted);font-size:12px;margin:0 0 10px;">${m.analyzingChipCount ? "סופר ז'יטונים אוטומטית..." : "הספירה מולאה בטבלה למטה - אפשר לתקן ידנית כל מספר שלא נראה נכון."}</p>
        ${sizeTogglesHtml}
        ${chipPhotos.length < 2 ? `
        <div style="position:relative;margin-bottom:8px;">
          <button type="button" class="btn btn-ghost btn-block" style="pointer-events:none;display:flex;align-items:center;justify-content:center;gap:6px;" ${m.analyzingChipCount?"disabled":""}>${icon('plus')} עוד תמונה (ערמות שלא נכנסו לפריים)</button>
          <input type="file" accept="image/*" capture="environment" id="chip-count-camera-input-add" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;" ${m.analyzingChipCount?"disabled":""}>
        </div>` : ""}
        <button class="btn btn-ghost btn-block" style="margin-bottom:10px;" data-retake-chip-count-photo ${m.analyzingChipCount?"disabled":""}>${icon('plus')} התחל מחדש</button>
      ` : `
        ${sizeTogglesHtml}
        <div style="position:relative;margin-bottom:10px;">
          <button type="button" class="btn btn-ghost btn-block" style="pointer-events:none;display:flex;align-items:center;justify-content:center;gap:6px;" ${selectedSizes.length?"":"disabled"}>${icon('plus')} ספירה אוטומטית מצילום</button>
          <input type="file" accept="image/*" capture="environment" id="chip-count-camera-input" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;" ${selectedSizes.length?"":"disabled"}>
        </div>
        <p style="color:var(--muted);font-size:12px;margin:-4px 0 14px;">לדיוק הכי טוב, סדרו את הערמות בשורות לפי מרחק מהמצלמה: הכי רחוק = הגודל הכי גדול שסימנתם, הכי קרוב = הגודל הכי קטן. כל ערמה מז'יטונים מאותו הסוג בלבד. אם לא כל הערמות נכנסות לפריים אחד, אפשר להוסיף עוד תמונה אחר כך. נזהה את הסוג והכמות של כל ערמה ונמלא את הטבלה למטה.</p>
      `;
      modeBody = `
        ${photoAreaHtml}
        <div class="scroll-list" style="margin-bottom:14px;">
          ${chipValues.map((cv) => `
            <div class="roster-row">
              <div class="row" style="gap:4px;">
                ${cv.image ? `<img src="${cv.image}" style="width:28px;height:28px;object-fit:cover;border-radius:6px;border:1px solid rgba(255,255,255,.3);flex-shrink:0;margin-left:6px;">` : ""}
                <span style="direction:ltr;display:inline-flex;align-items:center;gap:4px;">
                  <span style="color:var(--muted);">(</span>
                  <input type="number" data-color-correction="${cv.id}" placeholder="±0" title="תיקון ידני (חיובי או שלילי) מעל/מתחת למה שנספר בתמונה" style="width:52px;height:34px;font-size:13px;text-align:center;">
                  <span data-color-count="${cv.id}" data-color-value="${cv.value}" style="min-width:20px;text-align:center;font-weight:700;">+0</span>
                  <span style="color:var(--muted);">)</span>
                </span>
                <span>× ₪${cv.value}</span>
              </div>
              <span class="badge badge-ok" style="display:flex;flex-direction:column;align-items:center;line-height:1.25;flex-shrink:0;">
                <span data-color-count-value="${cv.id}">= ₪0</span>
              </span>
            </div>
          `).join("")}
        </div>
      `;
    } else if (mode === "chips") {
      // Ratio-aware: typing chip count or shekels fills in the other field automatically
      // (see the matching oninput wiring in attachHandlers), replacing the old separate
      // "ספירת ז'יטונים"/"סכום ז'יטונים בש"ח" mode tabs with one combined field pair.
      // RTL layout, right to left: ₪ field, "=", ratio, "÷", chip-count field - reads left
      // to right as the actual math ("qty ÷ ratio = ₪"). The separator symbols get their
      // own top margin (not just align-items:center on the row) so they line up with the
      // INPUT boxes specifically, not the vertical center of label+input together - without
      // it they read as centered against the label too and sit visibly too high.
      modeBody = (ratio && ratio !== 1) ? `
        <p style="color:var(--muted);font-size:12px;margin:0 0 10px;">הקלידו כמה ז'יטונים נשאר לכם ביציאה, או ישר את הסכום בשקלים - השדה השני יתמלא אוטומטית (1 ש"ח שווה ${ratio} ז'יטונים).</p>
        <div style="display:flex;align-items:flex-start;gap:8px;justify-content:center;margin-bottom:6px;">
          <div class="field" style="margin:0;width:110px;text-align:center;">
            <label style="text-align:center;">סכום בש"ח</label>
            <div style="display:flex;align-items:center;justify-content:center;gap:4px;border-radius:12px;background:var(--input);border:1px solid var(--input-b);padding:0 10px;">
              <span style="color:var(--muted);font-weight:700;">₪</span>
              <input type="number" inputmode="numeric" id="seat-chips-direct" value="${chips}" onfocus="this.select()" style="width:60px;text-align:center;background:transparent;border:none;padding:11px 0;">
            </div>
          </div>
          <span style="font-weight:700;color:var(--muted);margin-top:28px;">=</span>
          <span style="font-weight:700;color:var(--muted);margin-top:28px;">${ratio}</span>
          <span style="font-weight:700;color:var(--muted);margin-top:28px;">÷</span>
          <div class="field" style="margin:0;width:100px;text-align:center;">
            <label style="text-align:center;">כמות ז'יטונים</label>
            <input type="number" inputmode="numeric" id="total-chip-qty" placeholder="0" style="width:100%;text-align:center;">
          </div>
        </div>
      ` : `
        ${ratio === 1 ? `<p style="color:var(--muted);font-size:12px;margin:0 0 10px;">הקלידו כמה ז'יטונים נשאר לכם ביציאה.</p>` : ""}
        <div class="field" style="text-align:center;">
          <label style="text-align:center;">סכום ז'יטונים בש"ח</label>
          <div style="display:flex;align-items:center;justify-content:center;gap:4px;border-radius:12px;background:var(--input);border:1px solid var(--input-b);padding:0 10px;max-width:120px;margin:0 auto;">
            <span style="color:var(--muted);font-weight:700;">₪</span>
            <input type="number" inputmode="numeric" id="seat-chips-direct" value="${chips}" onfocus="this.select()" style="width:80px;text-align:center;background:transparent;border:none;padding:11px 0;">
          </div>
        </div>
      `;
    } else if (mode === "profit") {
      // Sign picked via a toggle instead of typing a minus sign - a plain numeric keypad
      // (inputmode="numeric") doesn't reliably offer a "-" key on mobile, and the picked
      // sign is clearer at a glance than scanning for one anyway. The toggle and the
      // amount field are one combined widget (big sign+number display, toggle bar right
      // under it) rather than a row of mode buttons sitting above a separate plain field.
      const profitSign = m.profitSign === "loss" ? "loss" : "profit";
      const isLoss = profitSign === "loss";
      const signColor = isLoss ? "#fb923c" : "#6ee7b7";
      modeBody = `
        <style>#seat-chips-profit::selection{color:${signColor};background:#1d4ed8;-webkit-text-fill-color:${signColor};}</style>
        <div style="background:#1f1f1f;border-radius:16px;overflow:hidden;margin-bottom:14px;">
          <div style="padding:22px 16px 14px;text-align:center;">
            <div style="display:flex;align-items:baseline;justify-content:center;gap:0;">
              <input type="number" inputmode="numeric" id="seat-chips-profit" placeholder="0" min="0" value="${esc(m.profitAmount||'')}" style="font-size:40px;font-weight:800;color:${signColor};background:transparent;border:none;width:${Math.max(String(m.profitAmount||'0').length,1)}ch;text-align:center;padding:0;" onfocus="this.select()">
              <span style="font-size:40px;font-weight:800;color:${signColor};">${isLoss?'-':'+'}</span>
            </div>
            <div style="color:var(--muted);font-size:12px;margin-top:8px;">הקש רווח (+) או הפסד (-)</div>
          </div>
          <div style="display:flex;">
            <button data-profit-sign="profit" style="flex:1;padding:12px 4px;border:none;font-weight:700;font-size:13px;background:#15803d;opacity:${!isLoss?1:.55};color:#fff;">רווח (+)</button>
            <div style="flex:1;padding:12px 4px;color:var(--muted);text-align:center;font-size:12px;display:flex;align-items:center;justify-content:center;">רווח/הפסד</div>
            <button data-profit-sign="loss" style="flex:1;padding:12px 4px;border:none;font-weight:700;font-size:13px;background:#c2410c;opacity:${isLoss?1:.55};color:#fff;">הפסד (-)</button>
          </div>
        </div>
      `;
    } else {
      modeBody = `<div class="field"><label>סכום ז'יטונים בש"ח</label><input type="number" inputmode="numeric" id="seat-chips-direct" value="${chips}" onfocus="this.select()"></div>`;
    }
    body = `
      ${headerHtml}
      ${arrangedNoteHtml}
      ${directPaymentsNoteHtml}
      ${modeTabs}
      ${modeBody}
      ${cashedOut ? `
        <p style="color:var(--muted);font-size:12px;">השחקן כבר יצא מהמשחק.</p>
        <button class="btn btn-ghost btn-block" data-return-to-game="${m.playerId}" style="margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:6px;">${icon('undo')} החזר למשחק</button>
      ` : `
        <button class="btn btn-block" style="background:#57534e;color:#f5f5f4;display:flex;align-items:center;justify-content:center;gap:6px;" data-quick-end="${m.playerId}">${icon('out')} סיים ערב</button>
      `}
    `;
  } else if (m.type === "removeSeat") {
    const g = getGame(m.gameId);
    const p = g.players.find(pl=>pl.id===m.playerId);
    const hasBuyins = g.buyins.some(b => b.playerId === m.playerId);
    const hasChips = ((g.liveChips||{})[m.playerId] || 0) > 0;
    title = "הסרה מהשולחן";
    body = `
      <p style="color:#6ee7b7;font-size:13px;">להסיר את <b>${esc(p?p.name:"")}</b> מהשולחן?</p>
      ${(hasBuyins || hasChips) ? `<p style="color:#fbbf24;font-size:12px;">לשחקן יש קניות/ז'יטונים בשולחן - הם יאופסו, כאילו לא ישב בשולחן. אם יחזור, הכל יעמוד על אפס.</p>` : ""}
      <button class="btn btn-block" style="background:#be123c;color:#fff;margin-top:8px;" data-confirm-clear-seat>הסר מהשולחן</button>
    `;
  } else if (m.type === "returnToGamePayment") {
    const g = getGame(m.gameId);
    const p = g.players.find(pl=>pl.id===m.playerId);
    title = "כבר בוצע תשלום";
    body = `
      <p style="color:#fbbf24;font-size:13px;">ל<b>${esc(p?p.name:"")}</b> כבר יש תשלום רשום מהיציאה הקודמת (₪${m.paidAmount}). לאפס את התשלום או להשאיר אותו?</p>
      <button class="btn btn-block" style="background:#be123c;color:#fff;margin-bottom:8px;" data-confirm-return-reset-payment>אפס תשלום וחזור למשחק</button>
      <button class="btn btn-ghost btn-block" data-confirm-return-keep-payment>השאר תשלום וחזור למשחק</button>
    `;
  } else if (m.type === "leave") {
    const g = getGame(m.gameId);
    const p = g.players.find(pl=>pl.id===m.playerId);
    title = `${esc(p.name)} יוצא מהמשחק`;
    body = `
      <p style="color:#6ee7b7;font-size:13px;margin-top:0;">כמה כסף יש ביד עכשיו?</p>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <label style="font-size:13px;font-weight:600;color:var(--muted);margin:0;">מכפיל ז'יטונים</label>
        <input type="number" inputmode="numeric" id="leave-multiplier" min="1" max="99" maxlength="2" step="1" value="${m.multiplier || 1}" style="width:52px;flex:none;text-align:center;padding:8px;">
      </div>
      <div class="field"><label>סכום ביציאה בשקלים</label><input type="number" inputmode="decimal" id="leave-amount" value="${m.amount||''}" placeholder="0" autofocus></div>
      <button class="btn btn-primary btn-block" data-confirm-leave>אישור יציאה</button>
    `;
  } else if (m.type === "endNight") {
    const g = getGame(m.gameId);
    const active = g.players.filter(p => !(p.id in g.cashouts));
    title = "סיום ערב";
    if (active.length === 0) {
      const balances = computeBalances(g);
      const totalBuyins = g.buyins.reduce((s,b)=>s+b.amount,0);
      const totalCashouts = Object.values(g.cashouts).reduce((s,co)=>s+co.amount,0);
      const balanced = Math.abs(totalBuyins-totalCashouts) < 0.5;
      body = `
        <div class="stats-net ${balanced?'pos':'neg'}" style="text-align:right;padding:12px 16px;font-size:13px;font-weight:700;">${balanced?"הסכומים מאוזנים ✓":"שימו לב: הסכומים לא מאוזנים במדויק — כדאי לבדוק לפני הסיום"}</div>
        <button class="btn btn-primary btn-block" data-confirm-end style="margin-top:14px;">סיים ערב וחשב סיכום</button>
      `;
    } else {
      const totalBuyins = g.buyins.reduce((s,b)=>s+b.amount,0);
      const alreadyOut = Object.values(g.cashouts).reduce((s,co)=>s+co.amount,0);
      const buyinTotals = {};
      g.buyins.forEach(b => { buyinTotals[b.playerId] = (buyinTotals[b.playerId]||0) + b.amount; });
      const paidTotals = {};
      (g.payboxPayments||[]).forEach(pp => { paidTotals[pp.playerId] = (paidTotals[pp.playerId]||0) + pp.amount; });
      body = `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
          <label style="font-size:13px;font-weight:600;color:var(--muted);margin:0;">מכפיל ז'יטונים</label>
          <input type="number" inputmode="numeric" id="chip-multiplier" min="1" max="99" maxlength="2" step="1" value="${m.multiplier || 1}" style="width:52px;flex:none;text-align:center;padding:8px;">
        </div>
        <div id="live-balance-box" class="pot-box" style="margin:0 0 14px;" data-total-buyins="${totalBuyins}" data-already-out="${alreadyOut}"></div>
        ${active.map(p => `
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
            <b style="white-space:nowrap;font-size:13px;">${esc(p.name)}</b>
            <input type="number" inputmode="decimal" data-end-amount="${p.id}" placeholder="0" style="width:80px;flex:none;text-align:center;" value="${m.amounts && m.amounts[p.id] !== undefined ? m.amounts[p.id] : ''}">
            <span style="color:var(--muted);font-size:11px;flex:1;min-width:0;">· קנה ₪${buyinTotals[p.id]||0}${paidTotals[p.id]?` · העביר ₪${paidTotals[p.id]}`:""}</span>
          </div>
        `).join("")}
        <button class="btn btn-primary btn-block" style="margin-top:6px;" data-confirm-end-bulk>סיים ערב וחשב סיכום</button>
      `;
    }
  } else if (m.type === "summary") {
    const g = getGame(m.gameId);
    const finalBalances = computeFinalBalances(g);
    const alreadyPaid = {};
    (g.payboxPayments||[]).forEach(pp => { alreadyPaid[pp.playerId] = (alreadyPaid[pp.playerId]||0) + pp.amount; });
    const buyinTotals = {};
    g.buyins.forEach(b => { buyinTotals[b.playerId] = (buyinTotals[b.playerId]||0) + b.amount; });
    const rows = Object.entries(finalBalances)
      .map(([id,b]) => ({ id, name: (g.players.find(pl=>pl.id===id)||{}).name || "?", remaining: b.profit + (alreadyPaid[id]||0), buyin: buyinTotals[id]||0, paid: alreadyPaid[id]||0 }))
      .filter(r => Math.abs(r.remaining) > 0.005)
      .sort((a,b) => b.remaining - a.remaining);
    title = "סיכום תשלומים לקבוצת פייבוקס";
    body = "";
    if (rows.length === 0) {
      body += `<div class="empty" style="padding:20px 0;">✓ הכל מאוזן — אין תשלומים נדרשים.</div>`;
    } else {
      body += rows.map(r => `
        <div class="roster-row">
          <span><span style="font-weight:700;">${esc(r.name)}</span> <span style="color:var(--muted);font-size:11px;">קנה ₪${r.buyin}${r.paid?` · העביר ₪${r.paid}`:""}</span></span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span style="font-weight:700;color:${r.remaining>0?'#6ee7b7':'#fda4af'};">${r.remaining>0?"+":"-"}₪${Math.round(Math.abs(r.remaining)*100)/100}</span>
            ${r.remaining < -0.005 ? `<button class="icon-btn gold" data-open-paybox-row="${r.id}" data-paybox-amount="${Math.round(Math.abs(r.remaining)*100)/100}" title="פתח פייבוקס עם הסכום">${icon('share')}</button>` : ""}
          </span>
        </div>
      `).join("");
    }
    body += `<div class="note">* ירוק = מקבל מקבוצת פייבוקס, אדום = מעביר לקבוצת פייבוקס.${Object.keys(alreadyPaid).length ? " הסכומים שכבר הועברו לפייבוקס במהלך הערב כבר נלקחו בחשבון." : ""}</div>`;
    if (rows.length) {
      body += `<button class="btn btn-primary btn-block" data-open-paybox-from-summary style="margin-top:14px;">${icon('share')} פייבוקס</button>`;
    }
    // The rows above are about what's still owed via paybox (arranged direct payments
    // already netted out, balanced players filtered out) - this recap is the plain,
    // complete picture: what every player actually won or lost tonight, buy-ins vs. what
    // they cashed out with.
    const profitRows = g.players.map(p => {
      const co = g.cashouts[p.id];
      if (!co) return null;
      const profit = co.amount - (buyinTotals[p.id] || 0);
      return {name: p.name, profit};
    }).filter(Boolean).sort((a,b) => b.profit - a.profit);
    if (profitRows.length) {
      body += `<div class="section-title" style="padding:0;margin:16px 0 8px;">סה"כ רווח / הפסד</div>`;
      body += profitRows.map(r => `<div class="roster-row"><span>${esc(r.name)}</span><span style="font-weight:700;color:${r.profit>0.005?'#6ee7b7':(r.profit<-0.005?'#fda4af':'inherit')};">${r.profit>0?'+':''}₪${Math.round(r.profit*100)/100}</span></div>`).join("");
    }
  } else if (m.type === "history") {
    const g = getGame(m.gameId);
    const p = g.players.find(pl=>pl.id===m.playerId);
    title = `היסטוריה — ${esc(p.name)}`;
    const buyins = g.buyins.filter(b=>b.playerId===m.playerId);
    const totalBuyin = buyins.reduce((s,b)=>s+b.amount,0);
    let rows = `<div class="roster-row"><span>מספר תשלומים שהכניס</span><span style="font-weight:700;">${buyins.length}</span></div>`;
    rows += `<div class="roster-row"><span>סה"כ הכניס</span><span style="font-weight:700;">₪${totalBuyin}</span></div>`;
    if (buyins.length) {
      rows += `<div class="section-title" style="padding:0;margin:10px 0 6px;">פירוט התשלומים</div>`;
      rows += buyins.map((b,i) => `<div class="roster-row"><span>תשלום ${i+1}${b.ts?` · ${fmtTime(b.ts)}`:""}</span><span style="display:flex;align-items:center;gap:10px;">₪${b.amount}<button class="icon-btn" style="color:#fda4af;" data-delete-buyin="${b.id}" title="ביטול תשלום">${icon('trash')}</button></span></div>`).join("");
    }
    const paybox = (g.payboxPayments||[]).filter(b=>b.playerId===m.playerId);
    if (paybox.length) {
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">העברות לקבוצת פייבוקס</div>`;
      rows += paybox.map((b,i) => `<div class="roster-row"><span>העברה ${i+1}${b.ts?` · ${fmtTime(b.ts)}`:""}</span><span style="display:flex;align-items:center;gap:10px;">₪${b.amount}<button class="icon-btn" style="color:#fda4af;" data-delete-paybox="${b.id}" title="ביטול העברה">${icon('trash')}</button></span></div>`).join("");
    }
    const directPayments = (g.playerPayments||[]).filter(b=>b.fromPlayerId===m.playerId);
    if (directPayments.length) {
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">העברות ישירות לשחקנים</div>`;
      rows += directPayments.map(b => {
        const toName = (g.players.find(pl=>pl.id===b.toPlayerId)||{}).name || "?";
        return `<div class="roster-row"><span>העביר ל-${esc(toName)}${b.ts?` · ${fmtTime(b.ts)}`:""}</span><span style="display:flex;align-items:center;gap:10px;">₪${b.amount}<button class="icon-btn" style="color:#fda4af;" data-delete-player-payment="${b.id}" title="ביטול העברה">${icon('trash')}</button></span></div>`;
      }).join("");
    }
    const myOut = g.cashouts[m.playerId];
    if (myOut) {
      const myProfitTotal = myOut.amount - totalBuyin;
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">יציאה מהמשחק</div>`;
      // The pencil edits the cashout amount itself - reachable from the regular "סיכום
      // ערב" summary button a player sees after cashing out.
      rows += `<div class="roster-row"><span>יצא עם${myOut.ts?` (בשעה ${fmtTime(myOut.ts)})`:""}</span><span style="display:flex;align-items:center;gap:8px;"><b>₪${myOut.amount}</b><button class="icon-btn" data-check-balance-edit-chips title="עדכן סכום ז'יטונים">${icon('pencil')}</button></span></div>`;
      rows += `<div class="roster-row"><span>סה"כ רווח / הפסד</span><span style="font-weight:700;color:${myProfitTotal>0.005?'#6ee7b7':(myProfitTotal<-0.005?'#fda4af':'inherit')};">${myProfitTotal>0?'+':''}₪${Math.round(myProfitTotal*100)/100}</span></div>`;
      if (myOut.arrangedWith && myOut.arrangedWith.length) {
        const myProfit = computeArrangementAdjustments(g).adjusted[m.playerId];
        const share = Math.round((myProfit / myOut.arrangedWith.length) * 100) / 100;
        rows += myOut.arrangedWith.map(id => {
          const name = (g.players.find(pl=>pl.id===id)||{}).name || "?";
          return `<div class="roster-row"><span>${share>=0 ? "קיבל מ-" : "העביר ל-"}${esc(name)}</span><span style="font-weight:700;">₪${Math.abs(share)}</span></div>`;
        }).join("");
      }
    }
    // incoming arrangements: other players who left and named this player as their counterpart
    const adj = computeArrangementAdjustments(g).adjusted;
    const incoming = [];
    Object.entries(g.cashouts).forEach(([otherId, co]) => {
      if (otherId === m.playerId) return;
      if (!co.arrangedWith || !co.arrangedWith.includes(m.playerId)) return;
      const otherName = (g.players.find(pl=>pl.id===otherId)||{}).name || "?";
      const otherProfit = adj[otherId];
      const share = Math.round((Math.abs(otherProfit) / co.arrangedWith.length) * 100) / 100;
      incoming.push({ otherName, received: otherProfit < 0, share }); // if the other player owed money, this player received from them
    });
    if (incoming.length) {
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">סידורים עם שחקנים שיצאו</div>`;
      rows += incoming.map(x => `<div class="roster-row"><span>${x.received ? "קיבל מ-" : "העביר ל-"}${esc(x.otherName)}</span><span style="font-weight:700;">₪${x.share}</span></div>`).join("");
    }
    if (g.closed) {
      const finalBalances = computeFinalBalances(g);
      const alreadyPaidPaybox = (g.payboxPayments||[]).filter(pp=>pp.playerId===m.playerId).reduce((s,pp)=>s+pp.amount,0);
      const alreadyPaidDirect = directPayments.reduce((s,dp)=>s+dp.amount,0);
      const fb = finalBalances[m.playerId];
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">חלק בסיכום הסופי</div>`;
      if (!fb) {
        rows += `<div class="roster-row"><span>לא נכלל בסיכום הסופי (סודר ישירות עם שחקן אחר)</span></div>`;
      } else {
        const remaining = fb.profit + alreadyPaidPaybox + alreadyPaidDirect;
        if (Math.abs(remaining) < 0.005) {
          rows += `<div class="roster-row"><span>מאוזן — אין תשלום נוסף נדרש</span></div>`;
        } else {
          const label = remaining>0 ? "מקבל מקבוצת פייבוקס" : "מעביר לקבוצת פייבוקס";
          rows += `<div class="roster-row"><span>${label}</span><span style="font-weight:700;color:${remaining>0?'#6ee7b7':'#fda4af'};">₪${Math.round(Math.abs(remaining)*100)/100}</span></div>`;
        }
      }
    }
    body = rows;
  }

  // directPay (item 15): closes only by picking a recipient or tapping "הערב נגמר",
  // never by dismissing - someone who left owing money shouldn't be able to just back
  // out of saying who they paid.
  const dismissable = m.type !== "loginRequired" && !(m.type === "identityName" && m.forced) && m.type !== "directPay";
  const topAnchored = m.type === "seatChips" || m.type === "loginRequired" || m.type === "newCommunity";
  const isSetupFlow = m.type === "chipSetup" || m.type === "payboxSettings" || m.type === "buyinSetup";
  return `
    <div class="overlay${topAnchored ? ' overlay-top' : ''}${isSetupFlow ? ' overlay-fullscreen' : ''}">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head"><h3 class="serif">${title}</h3>${dismissable ? `<button class="close-x" data-close-modal>${icon('x')}</button>` : ""}</div>
        ${body}
      </div>
    </div>
  `;
}

// ---------- Event handling (delegated) ----------
function attachHandlers(){
  const app = document.getElementById("app");

  // Auto-open the "who do I pay" modal the moment this player is cashed out at a loss
  // mid-game (direct settlement, not everyone else done yet, night not closed) - see
  // autoOpenedDirectPay's own comment. Deferred to a fresh tick (not called synchronously
  // from here) so it runs as its own top-level openModal()/render() cycle instead of
  // re-entering the render/attachHandlers pass that's still in progress right now.
  if (nav.screen === "table" && !modal) {
    const g = getGame(nav.gameId);
    const c = g && getCommunity(g.communityId);
    const pid = g && myIdentity.myPlayers && myIdentity.myPlayers[g.communityId];
    if (g && c && pid && (pid in g.cashouts) && c.settlementDefault !== "paybox") {
      const seatedIds = (g.seats||[]).filter(Boolean);
      const allOut = seatedIds.length > 0 && seatedIds.every(sid => sid in g.cashouts);
      const myBuyinTotal = g.buyins.filter(b=>b.playerId===pid).reduce((s,b)=>s+b.amount,0);
      const myProfit = (g.cashouts[pid].amount||0) - myBuyinTotal;
      const key = `${g.id}:${pid}`;
      if (!allOut && !g.closed && myProfit < -0.005 && !autoOpenedDirectPay.has(key)) {
        autoOpenedDirectPay.add(key);
        setTimeout(() => openModal({type:"directPay", gameId: g.id, fromPlayerId: pid, amount: String(Math.round(Math.abs(myProfit)*100)/100)}), 0);
      }
    }
  }

  // The two corner labels next to the carousel dots (3-page case only, see render()) -
  // naming the adjacent screen and letting a tap jump straight there, same destination a
  // swipe in that direction would reach.
  app.querySelectorAll("[data-swipe-to]").forEach(el => el.onclick = () => {
    tableSubView = el.dataset.swipeTo;
    render();
  });

  // Swipe between the player screen and the classic circles view - both are mounted side
  // by side in [data-swipe-track] (see render()) and this literally drags that track
  // under the finger in real time, phone-home-screen style, snapping to whichever side is
  // closer (or past the distance threshold) on release instead of only deciding on
  // release with no visible feedback while dragging - that version worked mechanically
  // but was repeatedly reported as "doesn't work" since nothing visibly happened until
  // the gesture ended. Seats/buttons/inputs/.chat-frame are excluded so their own
  // drag/tap/scroll handling stays untouched. Deliberately the FIRST thing attachHandlers
  // does, not somewhere in the middle of this (very long, single-function) file - an
  // uncaught exception anywhere earlier in this function would otherwise stop every
  // handler after it from ever being attached, including this one, with no visible sign
  // beyond "the swipe just doesn't do anything" (reported live, repeatedly, even after
  // the touch-handling itself was independently verified correct).
  try {
    const swipeRoot = app.querySelector(".table-swipe-root");
    const swipeTrack = app.querySelector("[data-swipe-track]");
    if (swipeRoot && swipeTrack) {
      const swipeGame = getGame(nav.gameId);
      const swipeCommunity = swipeGame && getCommunity(swipeGame.communityId);
      const pageOrder = swipePageOrder(swipeGame, swipeCommunity);
      const N = pageOrder.length;
      let swipeStartX = null, swipeStartY = null, swipeActive = false, swipeAbandoned = false, swipeLastDx = 0;
      const SWIPE_DECIDE_PX = 12;
      const pageWidth = () => swipeRoot.getBoundingClientRect().width;
      // Which real DOM page (see render() - [player, table] when N===2, or a
      // [prev, current, next] window centered on tableSubView when N===3) is currently in
      // which track slot (0 = left/first ... N-1 = right/last) - starts matching whatever
      // render() just authored, but an N===2 gesture can swap it (see ensureAdjacency
      // below) to make BOTH swipe directions always reveal the real other page from the
      // correct side, circular, with only two actual pages. Reset fresh every render(), so
      // a swap made mid-gesture never lingers into the next one.
      let trackOrder = N === 3 ? [cyclicPage(pageOrder, tableSubView, -1), tableSubView, cyclicPage(pageOrder, tableSubView, 1)] : pageOrder.slice();
      const slotOf = (which) => trackOrder.indexOf(which);
      const offsetForSlot = (slot) => -slot * pageWidth();
      const baseOffset = () => offsetForSlot(slotOf(tableSubView));
      const setTrack = (px, animated) => {
        swipeTrack.style.transition = animated ? "transform .25s ease" : "none";
        swipeTrack.style.transform = `translateX(${px}px)`;
      };
      // With only two real pages, "swipe left" and "swipe right" both need to look the
      // same either way: the OTHER page slides in from the side the finger is dragging
      // away from, never a rubber-band-then-jump. That only works automatically when the
      // other page is already the DOM-adjacent neighbor on that side (true for one
      // direction from each page, e.g. left-from-player or right-from-table, which is why
      // that direction always worked) - the other, "wrap-around" direction has no real
      // neighbor there in the authored [player, table] order. Fixing that: right when a
      // drag commits to a direction (or reverses mid-drag, past the start point), if the
      // needed neighbor isn't adjacent on that side, physically swap the two DOM nodes'
      // order and instantly (no transition) re-set the transform so the current page stays
      // pinned exactly where it visually already was - invisible to the eye, since it
      // happens before the drag has moved it anywhere - after which the needed neighbor IS
      // the adjacent one on that side, and the existing reveal math just works. With three
      // real pages this is provably always already satisfied (render()'s centered window
      // gives the current page a distinct real neighbor on both sides, every time), so the
      // reorder body below never actually runs for N===3 - it's dead code there, not a
      // bug, kept as a single code path instead of forking the whole drag handler on N.
      const ensureAdjacency = (dxSign) => {
        const cur = tableSubView;
        const neededNeighbor = cyclicPage(pageOrder, cur, dxSign < 0 ? 1 : -1);
        const curSlot = slotOf(cur);
        const desiredNeighborSlot = curSlot + (dxSign < 0 ? 1 : -1);
        if (slotOf(neededNeighbor) === desiredNeighborSlot) return;
        if (N !== 2) return; // see comment above - shouldn't be reachable, but never mutate the DOM for N!==2
        trackOrder.reverse();
        const kids = swipeTrack.children;
        if (kids.length === 2) swipeTrack.insertBefore(kids[1], kids[0]);
        setTrack(baseOffset(), false);
      };
      const settle = (dx, fromCancel) => {
        const w = pageWidth();
        const threshold = fromCancel ? 30 : w * 0.22;
        // Circular: either direction past the threshold moves one step around pageOrder -
        // dxSign<0 (dragged left) to the next page, dxSign>0 (dragged right) to the
        // previous one - regardless of which page this drag started on, so swiping right
        // from the first page in the order (nothing "before" it on screen) still wraps to
        // the last one, same as swiping left from the last page wraps to the first.
        if (Math.abs(dx) > threshold) tableSubView = cyclicPage(pageOrder, tableSubView, dx < 0 ? 1 : -1);
        // else: not past threshold - tableSubView stays what it already was, so
        // baseOffset() below naturally snaps back to where this drag started instead of
        // completing it.
        setTrack(baseOffset(), true);
        // The full render() (which drops the now-redundant transform/transition and
        // re-measures the table) only needs to happen once the slide animation has
        // actually finished, not before - doing it immediately would yank the DOM out
        // from under the still-running CSS transition. render() re-authors the canonical
        // DOM order for the new tableSubView regardless of any mid-gesture swap above,
        // with a transform matching the same visual position settle() just animated to
        // (see render()'s own restOffset) - so the swap between them is imperceptible.
        setTimeout(render, 260);
      };
      // {passive:false} is load-bearing, not decoration - modern browsers default touch-
      // driven pointer listeners to passive (for scroll perf), which makes
      // preventDefault() inside them a silent no-op with no error or warning.
      swipeRoot.addEventListener("pointerdown", (e) => {
        // Deliberately NOT excluding .chat-frame (history/activity) here - confirmed live
        // that swipe only worked from the dots area at the very bottom, not "the middle
        // of the screen", because that exclusion blocked it from ever starting anywhere
        // over either frame (which covers a lot of the player screen's vertical space).
        // The dx/dy comparison below already tells a horizontal swipe apart from a
        // vertical scroll attempt (swipeAbandoned when vertical wins, with no
        // preventDefault call in that case) - that's enough on its own to let a frame's
        // native vertical scroll and a horizontal swipe starting on the same element
        // coexist, without needing to block one of them outright.
        if (e.target.closest("[data-seat], button, input, textarea, select, a")) return;
        swipeStartX = e.clientX; swipeStartY = e.clientY; swipeActive = false; swipeAbandoned = false; swipeLastDx = 0;
        trackOrder = N === 3 ? [cyclicPage(pageOrder, tableSubView, -1), tableSubView, cyclicPage(pageOrder, tableSubView, 1)] : pageOrder.slice();
      }, {passive:false});
      swipeRoot.addEventListener("pointermove", (e) => {
        if (swipeStartX == null || swipeAbandoned) return;
        const dx = e.clientX - swipeStartX, dy = e.clientY - swipeStartY;
        swipeLastDx = dx;
        if (!swipeActive) {
          if (Math.abs(dy) > SWIPE_DECIDE_PX && Math.abs(dy) > Math.abs(dx)) { swipeAbandoned = true; return; }
          if (Math.abs(dx) > SWIPE_DECIDE_PX) swipeActive = true;
        }
        // Stop the browser from committing to its own native pan-y gesture while this
        // still reads as more horizontal than vertical - not just once swipeActive is
        // confirmed, but from the first sample, since a browser can lock into native
        // scrolling within the first few pixels of ANY movement (before SWIPE_DECIDE_PX
        // is even reached) and cut the pointer sequence off with a pointercancel, at
        // which point calling preventDefault later is already too late to matter.
        if ((swipeActive || Math.abs(dx) >= Math.abs(dy)) && e.cancelable) e.preventDefault();
        if (swipeActive) {
          // Checked on every sample, not just once - if the finger reverses past the
          // start point mid-drag, the side that needs the real neighbor adjacent flips
          // too (see ensureAdjacency's own comment). Cheap when nothing needs to change:
          // just a two-element array comparison.
          ensureAdjacency(dx < 0 ? -1 : 1);
          const w = pageWidth();
          const minOffset = -(N - 1) * w; // the leftmost real slot - 0 is the rightmost
          let raw = baseOffset() + dx;
          // Rubber-band past either edge instead of a hard stop - for dragging further
          // than the whole mounted track (all N real pages) already covers.
          if (raw > 0) raw = raw * 0.35;
          else if (raw < minOffset) raw = minOffset + (raw - minOffset) * 0.35;
          setTrack(raw, false);
        }
      }, {passive:false});
      swipeRoot.addEventListener("pointerup", (e) => {
        if (swipeStartX == null) return;
        const dx = e.clientX - swipeStartX;
        swipeStartX = null;
        if (!swipeActive || swipeAbandoned) return;
        settle(dx, false);
      });
      // Defense in depth: if a browser still cancels the gesture anyway (mid-drag,
      // before pointerup), settle from the last real movement sample instead of leaving
      // the track stranded wherever the cancel happened to catch it.
      swipeRoot.addEventListener("pointercancel", () => {
        if (swipeActive && !swipeAbandoned) settle(swipeLastDx, true);
        swipeStartX = null; swipeActive = false; swipeAbandoned = false;
      });
    }
  } catch(e) { logSync("swipe handler setup failed: " + e); }

    showButtonLoading(adminFixPotBtn);
    // Recompute against the freshest known state rather than a value cached before this
    // click - if a concurrent save changed the totals since this screen opened, the
    // correction must be based on the real current imbalance, not a stale one.
    const g2 = getGame(nav.gameId);
    const seats2 = g2.seats || new Array(9).fill(null);
    const seatedIds2 = seats2.filter(Boolean);
    const selectedIds2 = selectedIds.filter(pid => seatedIds2.includes(pid));
    if (!selectedIds2.length) { adminFixPotBtn.disabled = false; return; }
    const buyinTotals2 = {};
    g2.buyins.forEach(b => { buyinTotals2[b.playerId] = (buyinTotals2[b.playerId]||0) + b.amount; });
    const totalBuyinAll2 = seatedIds2.reduce((s,pid)=>s+(buyinTotals2[pid]||0),0);
    const totalChipsAll2 = seatedIds2.reduce((s,pid)=>s+((g2.liveChips||{})[pid]||0),0);
    const diff2 = totalChipsAll2 - totalBuyinAll2;
    const perPlayer2 = Math.round((-diff2 / selectedIds2.length) * 100) / 100;
    if (USE_RELATIONAL_API) {
      try {
        for (const pid of selectedIds2) {
          const newChips = Math.round(((g2.liveChips[pid]||0) + perPlayer2) * 100) / 100;

    } else {
      await mutateAndSave(() => {
        if (!g2.liveChips) g2.liveChips = {};

          g2.liveChips[pid] = Math.round(((g2.liveChips[pid]||0) + perPlayer2) * 100) / 100;
          if (g2.cashouts[pid]) g2.cashouts[pid].amount = Math.round(((g2.cashouts[pid].amount||0) + perPlayer2) * 100) / 100;

  app.querySelectorAll("[data-open-poker-odds]").forEach(el => el.onclick = () => openModal({type:"pokerOdds", gameType: "holdem", imageSrc: null, reading: false, error: null, results: null, hands: null, board: null}));

  // Plain app-open, no phone/amount prefill (see git history 117ef81's own data-open-bit-

  app.querySelectorAll("[data-seat]").forEach(el => {
    const dragHandle = el.querySelector(".seat-circle") || el;
    // Once everyone's cashed out and settlement arrows are showing, dragging seats around

    // toggle which player's transfers the arrows are filtered to instead (restored from
    // git history 117ef81, same reasoning as its own comment here: a plain click listener
    // has no movement threshold, so incidental jitter during a real tap can't get
    // misread as a drag and swallow the tap).
    if (currentSettlementTransfers) {
      const filterClick = (e) => {
        if (e) e.stopPropagation();
        const g = getGame(nav.gameId);
        const idx = parseInt(el.dataset.seat);
        const seats = g.seats || new Array(9).fill(null);
        const pid = seats[idx];
        if (!pid) return;
        settlementFilterPlayerId = settlementFilterPlayerId === pid ? null : pid;
        render();
      };
      dragHandle.addEventListener("click", filterClick);
      const infoEl = el.querySelector("[data-seat-info]");
      if (infoEl) infoEl.addEventListener("click", filterClick);
      return;
    }
    // Your own seat opens the existing player-settings screen (identityName - the same
    // one reachable from the name on the home screen, see data-edit-identity-name) on a
    // tap instead of the drag/swap flow below - and never gets the drag listeners at all,
    // so it can't be dragged either (only other players' seats can be rearranged around
    // the table, not your own).
    {
      const g0 = getGame(nav.gameId);
      const seats0 = g0.seats || new Array(9).fill(null);
      const idx0 = parseInt(el.dataset.seat);
      const myPlayerId0 = myIdentity.myPlayers && myIdentity.myPlayers[g0.communityId];
      if (seats0[idx0] && myPlayerId0 && seats0[idx0] === myPlayerId0) {
        el.onclick = () => openModal({type:"identityName", forced:false});
        return;
      }
    }
    let drag = null;
    dragHandle.addEventListener("pointerdown", (e) => {
      const g = getGame(nav.gameId);
      const seats = g.seats || new Array(9).fill(null);
      const idx = parseInt(el.dataset.seat);
      if (!seats[idx]) return; // only occupied seats can be dragged
      drag = { fromIdx: idx, startX: e.clientX, startY: e.clientY, moved: false };
      // The periodic/SSE refresh (doRefreshNow) replaces the whole DOM via render() every
      // few seconds regardless of what the user is mid-doing - landing during an active
      // drag swaps out the very element being dragged for a fresh one with no transform
      // applied, which is what made the dragged player visibly snap back to their old
      // seat even on an otherwise precise drop. Same skip-while-mid-interaction pattern
      // already used for an open modal/playerScreenCustomOpen/adminBuyinUi below. Set
      // before setPointerCapture (which can throw on some browsers/synthetic events) so
      // the guard is in place regardless of whether capture itself succeeds.
      seatDragInProgress = true;
      dragHandle.setPointerCapture(e.pointerId);
    });
    dragHandle.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.abs(dx) > 14 || Math.abs(dy) > 14) drag.moved = true;
      if (drag.moved) {
        el.style.transform = `translate(-50%,-50%) translate(${dx}px, ${dy}px)`;
        el.style.zIndex = "50";
        el.style.opacity = "0.85";
      }
    });
    dragHandle.addEventListener("pointerup", (e) => {
      if (!drag) return;
      const wasMoved = drag.moved;
      const fromIdx = drag.fromIdx;
      el.style.transform = "";
      el.style.zIndex = "";
      el.style.opacity = "";
      drag = null;
      seatDragInProgress = false;
      if (!wasMoved) return; // a plain tap on an already-seated player is a no-op
      // Nearest seat center to the drop point, not document.elementFromPoint - that was
      // exact-hit-test-only (gaps between circles, or landing a few px off a small target
      // on a touch screen, silently found nothing), which is why this worked some drags
      // and not others. Comparing against every OTHER seat's own (unmoved) center is
      // forgiving the same way a real drag-and-drop should be.
      const allSeatEls = Array.from(document.querySelectorAll("[data-seat]")).filter(se => se !== el);
      let targetEl = null, nearestDist = Infinity, nearestSize = 0;
      allSeatEls.forEach(se => {
        const r = se.getBoundingClientRect();
        if (!r.width || !r.height) return;
        const dist = Math.hypot((r.left+r.width/2) - e.clientX, (r.top+r.height/2) - e.clientY);
        if (dist < nearestDist) { nearestDist = dist; targetEl = se; nearestSize = Math.max(r.width, r.height); }
      });
      // Still requires landing reasonably close to SOME seat - a drop way off into empty
      // space (e.g. dragged up into the header) shouldn't swap with whatever happens to be
      // nearest regardless of distance.
      if (targetEl && nearestDist > nearestSize * 1.5) targetEl = null;
      if (targetEl) {
        const toIdx = parseInt(targetEl.dataset.seat);
        if (toIdx !== fromIdx) {
          const g = getGame(nav.gameId);
          if (!g.seats) g.seats = new Array(9).fill(null);
          // Swap locally and render immediately instead of waiting for the server
          // round-trip first - that's what made the dragged player visibly snap back to
          // their old seat for a moment before jumping to the new one.
          const prevSeats = g.seats.slice();
          const tmp = g.seats[toIdx];
          g.seats[toIdx] = g.seats[fromIdx];
          g.seats[fromIdx] = tmp;
          render();
          if (USE_RELATIONAL_API) {
            v2SwapSeats(nav.gameId, fromIdx, toIdx)
              .then(render)
              .catch(() => {
                const freshG = getGame(nav.gameId);
                if (freshG) freshG.seats = prevSeats;
                showAlert("שמירה נכשלה - בדוק את החיבור לאינטרנט ונסה שוב.");
                render();
              });
          } else {
            saveState();
          }
        }
      }
    });
    dragHandle.addEventListener("pointercancel", () => {
      el.style.transform = "";
      el.style.zIndex = "";
      el.style.opacity = "";
      drag = null;
      seatDragInProgress = false;
    });
    el.onclick = () => {
      const g = getGame(nav.gameId);

      const idx = parseInt(el.dataset.seat);
      const seats = g.seats || new Array(9).fill(null);
      // Only the table/community creator can seat a new guest into an empty seat -

      if (!seats[idx] && isTableAdmin(g, c)) openModal({type:"pickSeat", gameId: nav.gameId, seatIndex: idx});
    };
  });

      try {

      await syncLegacyOnlyFields();
      const groups = getAvatarGroups();
      const i = groups.findIndex(g => g.key === el.dataset.moveAvatarCatUp);

        const order = groups.map(g => g.key);

      const c = getCommunity(modal.communityId);
      const nameInput = document.getElementById("new-game-name");
      const name = nameInput.value.trim();
      if (USE_RELATIONAL_API) {
        // A roster/link/create sequence of real network round trips - with no feedback
        // beforehand this read as the app just sitting there doing nothing, reported live
        // as "opening a new night is slow and confusing".
        createBtn.disabled = true;
        nameInput.disabled = true;
        showButtonLoading(createBtn);
        const gid = uid();
        let creatorPlayer = null;
        if (myIdentity.name) {
          creatorPlayer = c.roster.find(pl => pl.name === myIdentity.name);
          try {
            if (!creatorPlayer) {
              creatorPlayer = {id: uid(), name: myIdentity.name};
              await v2AddRosterPlayer(c.id, creatorPlayer.id, creatorPlayer.name);
            }
            await v2LinkRosterPlayer(c.id, creatorPlayer.id, myIdentity.id);
            await v2CreateGame(gid, c.id, name || null, modal.date, myIdentity.name, creatorPlayer.id, creatorPlayer.name);
            // The server seats the creator directly as part of creating the game (so the
            // table never exists with an empty seat 0 even for an instant) - that bypasses
            // v2ClaimSeat entirely, which is the only place the "first time seated here ->
            // auto buy-in the community's first amount" trigger otherwise lives. Without
            // this, the creator's own table opened with ₪0 bought in instead of the usual
            // default. Fire-and-forget, same reasoning as v2ClaimSeat's own call.
            performBuyin(gid, creatorPlayer.id, getBuyinAmounts(c)[0], {isEntry: true, actorName: myIdentity.name});
          } catch(e) {
            showAlert("שמירה נכשלה - בדוק את החיבור לאינטרנט ונסה שוב.");
            createBtn.disabled = false; nameInput.disabled = false; createBtn.textContent = "פתח שולחן";
            return;
          }
        } else {
          try { await v2CreateGame(gid, c.id, name || null, modal.date, myIdentity.name, null, null); }
          catch(e) {
            showAlert("שמירה נכשלה - בדוק את החיבור לאינטרנט ונסה שוב.");
            createBtn.disabled = false; nameInput.disabled = false; createBtn.textContent = "פתח שולחן";
            return;
          }
        }
        go("community", {communityId:c.id});
        return;
      }
      // The date is kept only for sort order, defaulting to today - there's no picker
      // for it, the table's identity is its name (or falls back to the community name).
      const g = {id:uid(), communityId:c.id, date:modal.date, players: [], buyins:[], cashouts:{}, payboxPayments:[], playerPayments:[], seats:new Array(9).fill(null), liveChips:{}, closed:false, createdByName: myIdentity.name};
      if (name) g.name = name;
      // Explicitly seat whoever's creating the table, by name - independent of whatever
      // this device's remembered-player link happens to be, so opening a new table
      // reliably seats its actual creator rather than depending on that link being right.
      let creatorPlayer = null;
      if (myIdentity.name) {
        creatorPlayer = c.roster.find(pl => pl.name === myIdentity.name);
        if (!creatorPlayer) { creatorPlayer = {id: uid(), name: myIdentity.name}; c.roster.push(creatorPlayer); }

      if (creatorPlayer) performBuyin(g.id, creatorPlayer.id, getBuyinAmounts(c)[0], {isEntry: true, actorName: myIdentity.name});
      // Land back on the games list, not straight into the table - the new game's card
      // is right there with an "invite players" button, so that's reachable in one tap

        const prompt = `התמונה מציגה כמה זוטוני פוקר שונים, כל אחד מונח בנפרד על משטח, צולמו ממבט על. זהו את כל הז'יטונים השונים הנראים בתמונה (כל צבע/סוג פעם אחת בלבד), ועבור כל אחד תנו תיבה תוחמת (bounding box) בפיקסלים מוחלטים יחסית לתמונה (רוחב ${width}, גובה ${height}) שתוחמת בדיוק את הזוטון עצמו ולא את הרקע. בפורמט [x1,y1,x2,y2] - פינה שמאלית-עליונה ופינה ימנית-תחתונה. החזירו תשובה בפורמט JSON בלבד, בלי טקסט נוסף ובלי markdown, במבנה הזה בדיוק: [{"box":[x1,y1,x2,y2]}]`;
        const result = await callClaudeVisionMulti([dataUrl], prompt);
        const boxes = (Array.isArray(result) ? result : []).filter(r => r && Array.isArray(r.box) && r.box.length === 4);

        canvas.width = width; canvas.height = height;

          const half = Math.max(1, Math.round(size/2));
          const sx = Math.max(0, px - half), sy = Math.max(0, py - half);
          const sw = Math.min(width, px + half) - sx, sh = Math.min(height, py + half) - sy;
          const out = document.createElement("canvas");
          out.width = 160; out.height = 160;
          out.getContext("2d").drawImage(canvas, sx, sy, sw, sh, 0, 0, 160, 160);
          return out.toDataURL("image/jpeg", 0.85);
        };
        const newPoints = boxes.map(({box}) => {
          const [x1,y1,x2,y2] = box;
          const x = Math.round((x1+x2)/2), y = Math.round((y1+y2)/2);
          const size = Math.max(8, Math.round(Math.max(x2-x1, y2-y1)));

          const result = await callClaudeVisionMulti(images, prompt);

        <div class="row-between" style="flex-wrap:wrap;gap:10px 16px;">
          <div><div class="pot-label">סה"כ הכנסות</div><div class="pot-val">₪${totalBuyins}</div></div>
          <div style="text-align:center;"><div class="pot-label">סה"כ ז'יטונים בשולחן</div><div class="pot-val">₪${Math.round(totalOut*100)/100}</div></div>
          <div style="text-align:left;"><div class="pot-label">נשאר לשלם</div><div class="pot-val">₪${diff}</div></div>
          ${allFilled ? `<div class="badge ${balancedNow?'badge-ok':'badge-bad'}" style="width:100%;text-align:center;">${balancedNow?'מאוזן ✓':'לא מאוזן'}</div>` : ""}
        </div>
      `;
    }
    const multiplierInput = document.getElementById("chip-multiplier");
    if (multiplierInput) multiplierInput.oninput = () => { modal.multiplier = getMultiplier(); updateLiveBalance(); };
    app.querySelectorAll("[data-end-amount]").forEach(el => el.oninput = (e) => {
      modal.amounts = modal.amounts || {};
      modal.amounts[el.dataset.endAmount] = e.target.value;
      updateLiveBalance();
    });
    updateLiveBalance();
    const confirmBulkBtn = app.querySelector("[data-confirm-end-bulk]");
    if (confirmBulkBtn) confirmBulkBtn.onclick = async () => {
      const multiplier = getMultiplier();
      const inputs = app.querySelectorAll("[data-end-amount]");
      let allFilled = true;
      const values = {};
      inputs.forEach(inp => {
        const v = parseFloat(inp.value);
        if (isNaN(v) || v < 0) allFilled = false;
        values[inp.dataset.endAmount] = v / multiplier;
      });
      if (!allFilled) { showAlert("צריך למלא סכום תקין לכל שחקן פעיל."); return; }
      const gameId = modal.gameId;
      confirmBulkBtn.disabled = true;
      showButtonLoading(confirmBulkBtn);
      if (USE_RELATIONAL_API) {
        const g = getGame(gameId);
        try {
          // Re-check against the FRESH state, not the (possibly stale) snapshot the form
          // was built from - same reasoning as the non-relational path below.
          const fresh = await v2LoadGameFull(gameId);
          for (const p of fresh.players) {
            if (p.id in fresh.cashouts) continue;
            if (!(p.id in values)) continue;
            const amt = Math.round(values[p.id]*100)/100;
            await v2SetCashout(gameId, p.id, amt, [], amt);
          }
          await v2UpdateGame(gameId, {closed: true});
          await v2UpdateCommunity(g.communityId, {lastParticipants: fresh.players.map(p=>p.id)});
          v2AddGameEvent(gameId, "night_declared_over", null, myIdentity.name, undefined);
        } catch(e) { showAlert("שמירה נכשלה - בדוק את החיבור לאינטרנט ונסה שוב."); confirmBulkBtn.disabled = false; return; }
        openModal({type:"summary", gameId});
        return;
      }
      await mutateAndSave(() => {
        const g = getGame(gameId);
        if (!g.liveChips) g.liveChips = {};
        // Re-check against the FRESH state, not the (possibly stale) snapshot the form was
        // built from: someone may have cashed themselves out via their own seat while this
        // bulk screen was open - never clobber an already-saved entry with a guessed one.
        g.players.forEach(p => {
          if (p.id in g.cashouts) return;
          if (!(p.id in values)) return;
          const amt = Math.round(values[p.id]*100)/100;
          g.cashouts[p.id] = {amount: amt, ts: Date.now(), arrangedWith: []};
          g.liveChips[p.id] = amt;
        });
        g.closed = true;
        const c = getCommunity(g.communityId);
        c.lastParticipants = g.players.map(p=>p.id);
        logGameEvent(g, "night_declared_over", null, myIdentity.name, undefined);
      });
      openModal({type:"summary", gameId});
    };
    const confirmBtn = app.querySelector("[data-confirm-end]");
    if (confirmBtn) confirmBtn.onclick = async () => {
      const gameId = modal.gameId;
      confirmBtn.disabled = true;
      showButtonLoading(confirmBtn);
      if (USE_RELATIONAL_API) {
        const g = getGame(gameId);
        try {
          await v2UpdateGame(gameId, {closed: true});
          await v2UpdateCommunity(g.communityId, {lastParticipants: g.players.map(p=>p.id)});
          v2AddGameEvent(gameId, "night_declared_over", null, myIdentity.name, undefined);
        } catch(e) { showAlert("שמירה נכשלה - בדוק את החיבור לאינטרנט ונסה שוב."); confirmBtn.disabled = false; return; }
        openModal({type:"summary", gameId});
        return;
      }
      await mutateAndSave(() => {
        const g = getGame(gameId);
        g.closed = true;
        const c = getCommunity(g.communityId);
        c.lastParticipants = g.players.map(p=>p.id);
        logGameEvent(g, "night_declared_over", null, myIdentity.name, undefined);
        return true;
      });
      openModal({type:"summary", gameId});
    };
  }
}

// ---------- Guard against accidentally leaving the app via the browser/device back button ----------
// Chrome's "History Manipulation Intervention" silently skips a pushState() call - and the
// popstate it would otherwise fire on back - when it wasn't triggered by a real user gesture,
// exactly what a plain pushState() at script load is. That's the reported regression: this
// used to reliably ask "leave the app?" and, on a modern Chrome/Android build enforcing that
// intervention, started letting the very first back press (as an installed standalone PWA -
// manifest.json sets exactly that display mode, confirmed live) exit straight out with no
// prompt. Re-arming the push on the user's own next tap ties it to a genuine gesture, which
// the intervention doesn't skip; done both immediately (harmless, and still enough on a
// browser that doesn't enforce this) and again on the next real tap after every cancel, since
// the cancel branch's own re-push runs after an await (showConfirm) and so may itself land
// outside the gesture the back press provided.
function pushBackGuard(){ history.pushState({pokerManagerGuard: true}, ""); }
function armBackGuardOnNextGesture(){ document.addEventListener("pointerdown", pushBackGuard, {once: true}); }
pushBackGuard();
armBackGuardOnNextGesture();
window.addEventListener("popstate", async () => {
  if (await showConfirm("לצאת מהאפליקציה?")) {
    history.back();
  } else {
    pushBackGuard();
    armBackGuardOnNextGesture();
  }
});

(async function init(){
  document.getElementById("app").innerHTML =
    '<div style="padding:60px 20px;text-align:center;color:#a8a29e;font-size:14px;">טוען נתונים משותפים...</div>';
  let hasVerifiedSession = false;
  {
    const [stateResult, identityResult, versionResult, sessionResult, authSettingsResult] = await Promise.allSettled([loadState(), loadIdentity(), loadVersion(), checkLoginSession(), loadAuthSettings()]);
    // A failed initial load must never be treated as "no data yet" - only fall back to
    // defaultState() here (the one legitimate use of it), never after a save is possible.
    state = stateResult.status === "fulfilled" ? stateResult.value : defaultState();
    myIdentity = identityResult.status === "fulfilled" ? identityResult.value : { id: getClientId(), name: null };
    const versionInfo = versionResult.status === "fulfilled" ? versionResult.value : null;
    appVersion = versionInfo ? versionInfo.version : null;
    // Server-controlled, per-deployment (see RELATIONAL_API_DEFAULT in server.py) - a
    // fetch failure here leaves the safe default (false) in place rather than guessing.
    if (versionInfo && versionInfo.relationalApiEnabled) USE_RELATIONAL_API = true;
    // Overlays v2-sourced communities AND full per-game detail (with their updatedAt
    // concurrency tokens) onto whatever the old blob load produced, so the write helpers
    // have real data to work against. Fetching every game's full detail eagerly here is
    // deliberately a shortcut for a staging-sized dataset (the real production design is
    // meant to lazily fetch a game's full detail only when its screen is opened, per the
    // migration plan) - fine for testing, not how the final cutover should load games at
    // scale. Never runs with the flag off (the default, real production).
    if (USE_RELATIONAL_API) {
      try {
        state.communities = await v2Fetch("GET", "/communities");
        const gameSummaries = (await Promise.all(
          state.communities.map(c => v2Fetch("GET", `/communities/${c.id}/games`))
        )).flat();
        state.games = await Promise.all(gameSummaries.map(g => v2Fetch("GET", `/games/${g.id}`)));
        // Every buy-in that already existed the moment the app opened counts as "already
        // seen" from the start - an independent backstop alongside hasAppliedFreshStateOnce
        // (see announcedBuyinIds's own comment) for the exact same failure mode, in case
        // that guard alone ever gets bypassed (e.g. the invite-link retry fetch a little
        // further below, which legitimately calls applyFreshState before this device's
        // startup sequence finishes).
        rememberAnnouncedBuyinsBulk(state.games.flatMap(g => (g.buyins||[]).map(b => b.id)));
      } catch(e) { logSync("v2 community/game load failed: " + e); }
    }
    if (authSettingsResult.status === "fulfilled" && authSettingsResult.value) authSettings = authSettingsResult.value;
    // This device already verified a login code before (see checkLoginSession) - recover
    // the name/photo/phone from the account instead of starting over as a stranger. Only
    // actually saves anything if that recovers data this device didn't already have
    // locally, so a normal reload with nothing new to apply doesn't write on every load.
    const account = sessionResult.status === "fulfilled" ? sessionResult.value : null;
    hasVerifiedSession = !!account;
    if (account) {
      const hadName = !!myIdentity.name, hadPhoto = !!getGlobalPlayer(myIdentity.id).photo;
      const localIdBeforeSync = myIdentity.id;
      applyAccountToIdentity(account);
      if (!account.playerId) {
        // Doesn't block first paint - claims this device's own id as the account's
        // shared one if nobody has yet; a harmless no-op if another device just won
        // this same race first.
        claimPlayerId(localIdBeforeSync).then(claimed => {
          if (claimed && claimed !== myIdentity.id) { myIdentity.id = claimed; render(); }
          if (claimed) saveIdentity();
        });
      }
      if (myIdentity.id !== localIdBeforeSync || (!hadName && myIdentity.name)) saveIdentity();
      if (!hadPhoto && getGlobalPlayer(myIdentity.id).photo) saveState();
    }
  }
  // One-time cleanup: remove legacy communities that weren't created via the "new community"
  // button (they have no createdBy - e.g. the two starter communities from an earlier version
  // of this app), along with any of their games.
  const keepIds = new Set(state.communities.filter(c => c.createdBy).map(c => c.id));
  const hadLegacy = keepIds.size !== state.communities.length;
  state.communities = state.communities.filter(c => c.createdBy);
  state.games = state.games.filter(g => keepIds.has(g.communityId));
  if (hadLegacy) saveState();
  const inviteGameId = new URLSearchParams(location.search).get("game");
  if (inviteGameId) {
    let invitedGame = getGame(inviteGameId);
    if (!invitedGame) {
      // Our initial load may have caught a stale shared-state snapshot (a race with
      // someone else's concurrent save) and missed a game that genuinely exists -
      // try once more with a fresh fetch before giving up and falling back to home.
      try { const fresh = USE_RELATIONAL_API ? await loadStateV2() : await loadState(); applyFreshState(fresh); } catch(e) { /* keep the state we already have */ }
      invitedGame = getGame(inviteGameId);
    }
    if (invitedGame) {
      nav = { screen: "table", gameId: invitedGame.id, communityId: invitedGame.communityId };
      await autoJoinViaInvite(invitedGame.id);
    } else {
      // The linked game genuinely doesn't exist (most likely its host deleted that
      // evening) - say so instead of silently landing on the home screen with no
      // explanation for why the link didn't work.
      modal = {type:"inviteGone"};
    }
  }
  const inviteCommunityId = new URLSearchParams(location.search).get("community");
  if (inviteCommunityId && !inviteGameId) {
    let invitedCommunity = getCommunity(inviteCommunityId);
    if (!invitedCommunity) {
      try { const fresh = USE_RELATIONAL_API ? await loadStateV2() : await loadState(); applyFreshState(fresh); } catch(e) { /* keep the state we already have */ }
      invitedCommunity = getCommunity(inviteCommunityId);
    }
    if (invitedCommunity) {
      nav = { screen: "community", communityId: invitedCommunity.id };
      await autoJoinViaCommunityInvite(invitedCommunity.id);
    } else {
      modal = {type:"inviteGone"};
    }
  }
  // No invite link at all (plain app open, e.g. from the home-screen icon) - if this
  // player is seated in a still-open game somewhere, land there directly instead of the
  // communities list, same as if they'd followed that game's own invite link.
  if (!inviteGameId && !inviteCommunityId) {
    const myActiveGames = state.games
      .filter(g => !g.closed && myIdentity.myPlayers && (g.seats || []).includes(myIdentity.myPlayers[g.communityId]))
      .sort((a, b) => new Date(b.updatedAt || b.date || 0) - new Date(a.updatedAt || a.date || 0));
    if (myActiveGames.length) {
      const g = myActiveGames[0];
      nav = { screen: "table", gameId: g.id, communityId: g.communityId };
    }
  }
  // Login is mandatory - takes priority over any invite-flow modal set above, since
  // nothing else in the app should be usable (or even visible) before it. Gated on
  // hasVerifiedSession (this session's actual checkLoginSession result), never on a bare
  // myIdentity.email check - that field lives in the old per-device identities record and
  // can be stale (e.g. set by a pre-login version of this app that let people type an
  // email locally with no server verification at all) or just unrecoverable after a
  // trusted_devices/account deletion, letting an unverified device silently skip the gate.
  if (!hasVerifiedSession) {
    if (myIdentity.email || myIdentity.role) { myIdentity.email = null; myIdentity.role = null; saveIdentity(); }
    modal = {type:"loginRequired"};
  }
  else if (!myIdentity.name) modal = {type:"identityName", forced:true};
  render();
  scheduleAutoRefresh();
  connectLiveSync();
  prefetchAvatars();
  // Keep the server from spinning down (Render's free tier sleeps after 15 minutes with
  // no requests, and the next request then pays a real cold-start delay - tens of
  // seconds). Pings from any open tab regardless of screen, not just the table screen -
  // someone just browsing communities/games still counts as "the app is in use." A plain,
  // cheap GET, not tied to whether anything actually changed. This only helps while at
  // least one tab is open somewhere - it can't prevent the very first cold open after
  // everyone's been away for a while.
  setInterval(() => { fetch("/api/version").catch(()=>{}); }, 5*60*1000);
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>
