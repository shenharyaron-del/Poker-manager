// ---------- Keep the shared data fresh without the user having to do anything ----------
// Primary path is instant: the server pushes a "changed" event over SSE the moment anyone
// saves (see connectLiveSync below), so other open tabs refetch within about a second.
// Periodic polling stays underneath as a fallback for when SSE is unsupported/blocked or
// the connection drops - same safety net as before, just now a backup instead of the
// primary mechanism. Skip a refresh whenever a modal is open, or the player screen's own
// inline "אחר" amount input is (playerScreenCustomOpen - not a modal, but just as much a
// freshly-focused input mid-typing), so we never yank away something someone's mid-typing;
// render() re-draws whatever nav/modal already are, so this never navigates anyone away
// from the screen (e.g. table) they're currently looking at.
// Waits for `promise` to settle, but never longer than `ms` - used where giving up on a
// stuck promise and moving on beats blocking forever (a promise itself can't be
// cancelled/timed out in JS, so this just stops the CALLER from waiting on it any longer,
// it doesn't touch the underlying operation, which may still finish or fail on its own).
function waitAtMost(promise, ms){
  if (!promise) return Promise.resolve();
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    setTimeout(finish, ms);
    promise.then(finish, finish);
  });
}
let refreshInProgress = false;
let refreshQueued = false;
async function doRefreshNow(source){
  const callId = DEBUG_SYNC ? Math.random().toString(36).slice(2,6) : "";
  logSync(`refresh[${callId}] triggered by ${source}, modal=${!!modal}`);
  if (modal || playerScreenCustomOpen || Object.keys(adminBuyinUi).length || seatDragInProgress) { logSync(`refresh[${callId}] SKIPPED - modal or custom-amount input open`); return; }
  if (refreshInProgress) {
    // Another refresh is already running its own GET - don't start a second one
    // concurrently (two in-flight GETs can resolve out of order, and the one that
    // happens to land last wins even if it was issued first and is now stale, which
    // could put a seat/buy-in back the way it was before someone's most recent action
    // and - if another save happens before anything corrects it - persist it that way).
    // Just mark that another pass is needed once the current one finishes.
    refreshQueued = true;
    logSync(`refresh[${callId}] COALESCED - one already running`);
    return;
  }
  refreshInProgress = true;
  try {
    do {
      refreshQueued = false;
      // If a save from something the user just did is still in flight, fetching now would
      // race it - the GET can land before that POST commits and return stale data that then
      // overwrites the local (correct, newer) state, making the change flicker away for a
      // few seconds until the next refresh catches up. Wait for it to finish first so the
      // fetch is always at least as fresh as anything already saved. A single snapshot-and-
      // await isn't enough: rapid actions (several buy-ins in a row) queue additional saves
      // onto saveInFlight while we're waiting on an earlier one, and each save's own
      // completion now triggers this same refresh via SSE (including on the tab that made
      // it) - so keep re-checking until it's stayed the same across our own wait, meaning
      // no newer save snuck in while we were watching. Also wait out actionInFlight, not
      // just saveInFlight: a mutateAndSave stuck in a conflict-retry loop (a real
      // possibility on a slow connection) has a gap between attempts where saveInFlight
      // alone looks settled even though the action as a whole isn't done - fetching and
      // rendering in that gap would redraw the action's controls as fresh/enabled before
      // it's actually finished, letting a second tap fire a genuine duplicate action. And
      // v2ActionInFlight, the same idea for the v2Fetch-based path (see its own comment) -
      // production runs on that path, so skipping this would leave the whole guard below
      // protecting nothing there.
      //
      // Bounded, not an unconditional await: a fetch() with no response yet (network
      // truly stuck, a hung request) would otherwise leave v2ActionInFlight/actionInFlight
      // non-null forever, and since this loop only exits once its snapshot stops matching
      // the live variable, a permanently-stuck one would wedge every future refresh, not
      // just this one - worse than the flicker this whole wait exists to avoid. Give up
      // waiting after a few rounds and refresh anyway.
      let pending, pendingAction, pendingV2Action;
      let waitRounds = 0;
      const MAX_WAIT_ROUNDS = 5;
      do {
        pending = saveInFlight;
        pendingAction = actionInFlight;
        pendingV2Action = v2ActionInFlight;
        if (pending) await waitAtMost(pending, 5000);
        if (pendingAction) await waitAtMost(pendingAction, 5000);
        if (pendingV2Action) await waitAtMost(pendingV2Action, 5000);
        waitRounds++;
      } while ((pending !== saveInFlight || pendingAction !== actionInFlight || pendingV2Action !== v2ActionInFlight) && waitRounds < MAX_WAIT_ROUNDS);
      const gaveUpWaiting = waitRounds >= MAX_WAIT_ROUNDS;
      const stableFlight = saveInFlight;
      logSync(`refresh[${callId}] past save-wait, GET start${gaveUpWaiting ? ' (gave up waiting on a stuck action)' : ''}`);
      const fresh = USE_RELATIONAL_API ? await loadStateV2() : await loadState();
      // While that GET was in flight, a new local action could have mutated state and
      // queued its own save (saveInFlight would now differ from what we confirmed was
      // settled right before fetching) - this response was issued before that save
      // existed, so it can't reflect it. Applying it would revert the just-made change
      // (e.g. a removed seat reappearing) until a later refresh catches up - and if
      // another save happens before that, the reverted state becomes real. Discard it
      // and loop again instead, which will wait for the new save and re-fetch. Skipped once
      // we've already given up waiting once above - otherwise a genuinely stuck action (not
      // just a slow one) would make this the SAME stale check that keeps saying "retry"
      // forever, turning one hung request into a permanently broken refresh loop.
      if (!gaveUpWaiting && (saveInFlight !== stableFlight || actionInFlight || v2ActionInFlight)) {
        logSync(`refresh[${callId}] STALE - a save started mid-fetch, discarding and retrying`);
        refreshQueued = true;
        continue;
      }
      if (fresh === null) {
        logSync(`refresh[${callId}] 304 not-modified, nothing to apply`);
      } else {
        logSync(`refresh[${callId}] GET done, buyins=${(fresh.games||[]).map(g=>g.buyins.length).join(',')}, applying (modal now=${!!modal})`);
        applyFreshState(fresh);
        // The entry guard above only caught a modal/custom-input that was ALREADY open
        // when this refresh started - one opened while the GET was in flight (its own
        // await above can take a real moment) slips past that check entirely. Re-checking
        // here, right before the render() that would otherwise blow away its DOM, is what
        // this was missing - reported live as typing a table/player name's first letter
        // sometimes closing the keyboard with nothing typed (a fresh input node replaces
        // the focused one mid-keystroke), same symptom later reported for the player
        // screen's "אחר" amount field once that existed too - working fine on the very
        // next attempt once the refresh had already finished. The fetched state is still
        // applied either way - only the render is skipped - so the next render (the modal
        // closing, or the next refresh with neither open) already reflects it.
        if (modal || playerScreenCustomOpen || Object.keys(adminBuyinUi).length || seatDragInProgress || shouldShowGameWelcome()) {
          logSync(`refresh[${callId}] applied but SKIPPED render - modal, custom-amount input, or game-welcome screen open`);
        } else {
          const scrollY = window.scrollY;
          render();
          window.scrollTo(0, scrollY);
          logSync(`refresh[${callId}] applied+rendered`);
        }
      }
    } while (refreshQueued);
    refreshLegacyOnlyFields();
  } catch(e) { logSync(`refresh[${callId}] ERROR ${e}`); /* offline or a hiccup - next refresh will retry */ }
  finally { refreshInProgress = false; }
}
// Interval itself lives in shared state (refreshIntervalSec) so Super Admin can change it
// from any device and every other device picks up the new cadence on its next tick.
function scheduleAutoRefresh(){
  const sec = (state.refreshIntervalSec > 0) ? state.refreshIntervalSec : 6;
  setTimeout(tickAutoRefresh, sec * 1000);
}
async function tickAutoRefresh(){
  await doRefreshNow("periodic-tick");
  scheduleAutoRefresh();
}
// EventSource reconnects on its own after a drop (network hiccup, server restart, phone
// backgrounded) - nothing extra needed here for that. visibilitychange below covers the
// case where the tab was backgrounded long enough to miss events entirely.
function connectLiveSync(){
  try {
    const es = new EventSource("/api/events");
    es.onmessage = () => { doRefreshNow("sse"); };
  } catch(e) { /* SSE unsupported/blocked - periodic polling still covers us */ }
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) doRefreshNow("visibilitychange");
});

// ---------- Shrinking the multi-device lost-update window ----------
// The whole shared state is one JSON blob with no per-field merge - every save overwrites
// the entire thing with whatever this device currently has locally. If phone A saves a
// buy-in, and phone B (which hasn't refreshed since before that) then adds its own buy-in,
// B's save serializes its own (stale, missing A's) copy of state and wipes A's change out,
// not just B's own edit. Waiting for a periodic/SSE refresh isn't enough - the race is
// between "did I refresh recently enough" and "did the other device save first," which
// depends on both people's timing, not just one. Calling this right before reading state
// to apply a mutation (not just before saving, since the mutation itself needs to land on
// a value that will actually be saved) pulls the freshest known copy first, so the mutation
// lands on top of whatever's newest - it shrinks the race window to "the round-trip of one
// extra fetch" instead of "however long since this device's last background refresh," but
// doesn't eliminate it outright (two people tapping at the exact same instant can still
// race) - a full fix would need real per-field merging, which is a much bigger change.
async function syncBeforeMutate(){
  try {
    let pending;
    do {
      pending = saveInFlight;
      if (pending) await pending;
    } while (pending !== saveInFlight);
    // Deliberately NOT loadState() - its "hash still matches lastStateHash, skip and
    // return null" shortcut is wrong here. This runs specifically to recover from a
    // rejected (conflicted) mutateAndSave attempt, whose own mutatorFn() call already
    // dirtied local `state` even though nothing was actually saved. If the server's real
    // hash still equals lastStateHash (true whenever every attempt so far has failed -
    // a rejected save never changes the server's hash), that shortcut would leave the
    // dirty local mutation in place, and the next retry's mutatorFn() would then push
    // ANOTHER copy on top of it instead of starting clean - each failed attempt
    // compounding on the last (e.g. four failed retries of a 100 buy-in locally
    // ballooning to 400, all client-side only, before the final alert and a real
    // refresh reveals the true, unaffected server value). Always re-fetch the full
    // state here, unconditionally, so a dirty local mutation is always discarded.
    const [hashRes, stateRes] = await Promise.all([fetch("/api/state/hash"), fetch("/api/state")]);
    if (hashRes.ok) { const {hash} = await hashRes.json(); lastStateHash = hash; }
    if (stateRes.ok) { state = await stateRes.json(); }
  } catch(e) { /* offline or a hiccup - proceed with what we have rather than block the action */ }
}

// ---------- "Who am I" - private per-browser identity, used only to tag who created a community ----------
// Not a real login: it's a name each user types once, remembered for their own browser via
// a per-device id. It lets us show/allow "delete" only to the creator, but someone could
// still type someone else's name - it's a courtesy, not security.
async function loadIdentity(){
  // Same reasoning as checkLoginSession's own retry loop right below - a 503/timeout while
  // this free-tier host is still waking up from idle is not the same thing as "no record
  // for this device yet", and treating it that way used to silently forget an existing
  // user's saved name (forcing the "הגדרת שחקן" prompt again) any time the very first
  // load after an idle stretch happened to land on a cold server.
  const RETRY_DELAYS_MS = [1000, 2000, 4000, 8000, 8000];
  for (let attempt = 0; ; attempt++) {
    try {
      const res = await fetch("/api/identity?clientId=" + encodeURIComponent(getClientId()));
      if (res.ok) {
        const data = await res.json();
        // A genuinely empty response (no record for this device at all) is authoritative
        // too, same as a real one - only a non-ok status or a thrown error below is
        // ambiguous enough to be worth retrying instead of trusting right away.
        return data || { id: getClientId(), name: null };
      }
    } catch(e) { /* network error - fall through to retry below */ }
    if (attempt >= RETRY_DELAYS_MS.length) break;
    await new Promise(r => setTimeout(r, RETRY_DELAYS_MS[attempt]));
  }
  // id must always be this device's stable clientId, never a fresh random one - a random
  // fallback here (whether from an exhausted retry loop or genuinely no record yet) used to
  // silently split one real person into two: it got linked into rosters/globalPlayers
  // under a throwaway id, so the same phone showed up twice under the same typed-in name.
  return { id: getClientId(), name: null };
}

// ---------- Email + code login (optional, additive - see server.py's /api/auth/*) ----------
// A real account, keyed by email, that can be recovered on a brand new device instead of
// starting over as a stranger the way the plain per-device clientId always has. Logging in
// doesn't replace the existing identity system - it just fills myIdentity.name and this
// device's globalPlayers photo/phone from the account, the same fields either path already
// sets, so everything downstream (rosters, isTableAdmin, stats) keeps working unchanged
// whether someone ever logs in at all.
// Retries on anything that ISN'T an authoritative answer from the server (a network
// error, a timeout, a 503 while a sleeping backend is still waking up) instead of treating
// those the same as a confirmed "not logged in" - this free-tier host sleeps after ~15min
// idle and can take 20-50+s to wake back up, observed live; without this, the very first
// open after any idle stretch (not just after days away) could misread "couldn't reach the
// server yet" as "this device was never verified" and wrongly show the login screen again
// to someone who genuinely already had a trusted device. Only a real HTTP response (loading
// with loggedIn true or false) is treated as final; anything else is retried with backoff

function flyAmountBadge(fromEl, toEl, amount){
  try {
    if (!fromEl || !toEl) return;
    const fromRect = fromEl.getBoundingClientRect();
    const toRect = toEl.getBoundingClientRect();
    const badge = document.createElement("div");
    badge.className = "buyin-fly";
    badge.textContent = `${amount>=0?'+':'-'}₪${Math.abs(Math.round(amount*100)/100)}`;
    // left/top target the circles' exact center points - the badge centers itself on
    // whatever point that is via its own translate(-50%,-50%), so no half-width math here.
    // Document-relative coordinates (rect + scroll offset) via position:absolute, not
    // position:fixed's viewport-relative ones - a mobile browser's address-bar chrome can
    // shift the visual vs layout viewport, throwing off a fixed element's real position
    // relative to getBoundingClientRect() measurements taken against page content.
    badge.style.left = (fromRect.left + fromRect.width/2 + window.scrollX) + "px";
    badge.style.top = (fromRect.top + fromRect.height/2 + window.scrollY) + "px";
    document.body.appendChild(badge);

    // destination below - without this, the browser can coalesce both style writes into
    // one frame and skip animating the transition entirely.

    badge.style.top = (toRect.top + toRect.height/2 + window.scrollY) + "px";
    setTimeout(() => { badge.classList.add("landed"); }, 650);
    setTimeout(() => { badge.classList.add("fading"); }, 950);
    setTimeout(() => { badge.remove(); }, 1300);
  } catch(e) { /* cosmetic only */ }
}

  if (isEntry) return;
  buyinConfirmQueue.push({playerName, amount, isEntry});

function runBuyinConfirmQueue(){

  playBuyinSound();
  if (navigator.vibrate) navigator.vibrate(80);
  const verb = item.isEntry ? "כניסה לשולחן" : "ריביי";
  const fem = item.isEntry ? "ה" : ""; // "התקבלה/נשמרה" (כניסה, נקבה) vs "התקבל/נשמר" (ריביי, זכר)
  const overlay = document.createElement("div");
  overlay.className = "buyin-confirm-overlay";
  overlay.innerHTML = `<div class="buyin-confirm-card">
    <div style="font-size:48px;line-height:1;margin-bottom:10px;">✓</div>
    <div style="font-size:17px;font-weight:700;">${esc(verb)} ₪${item.amount} התקבל${fem} ונשמר${fem} ל-${esc(item.playerName)}</div>
  </div>`;
  document.body.appendChild(overlay);
  let dismissed = false;
  const dismiss = () => {
    if (dismissed) return;
    dismissed = true;
    overlay.querySelector(".buyin-confirm-card").classList.add("fade-out");
    setTimeout(() => { overlay.remove(); runBuyinConfirmQueue(); }, 300);

  overlay.onclick = dismiss; // tap closes early, per spec

// The single entry point for every "add a buy-in" action in the app (a player's own tap,
// an admin buying in for someone else, item 6's auto-entry) - owns the whole pending-
// banner → DB save → confirm-card (or cancel-rollback) lifecycle so all three stay in sync
// regardless of which screen/flow triggered it. actorName is who's actually performing it
// (defaults to the viewer), only persisted/shown when it differs from the player it's for
// (see the server's buyins.actor_name and the feed's actorSuffix).
async function performBuyin(gameId, playerId, amount, opts){
  opts = opts || {};
  const isEntry = !!opts.isEntry;
  const actorName = opts.actorName || myIdentity.name;
  const fromEl = opts.fromEl || null;
  const g = getGame(gameId);
  const playerName = (g.players.find(p=>p.id===playerId)||{}).name || "שחקן";
  const id = uid();
  const verb = isEntry ? "כניסה לשולחן" : "ריביי";
  // Claims this id against a duplicate announcement (see announcedBuyinIds's own comment)
  // BEFORE any network round-trip starts, not when the save later succeeds - there's a
  // real gap between v2Fetch's own in-flight tracker clearing (as part of resolving) and
  // v2AddBuyin's local buyins.push() actually running one tick later, during which a
  // refresh/SSE event elsewhere isn't blocked by either pendingBuyinRequest or "already in
  // g.buyins" and can detect this same id as "new" and announce it a second time (reported
  // live as a 3rd confirm card still showing up after the first fix for this). Claiming
  // the id this early closes that gap outright instead of narrowing it.
  rememberAnnouncedBuyin(id);

  pendingBuyinRequest = {gameId, id, playerId, cancelled: false};
  showPendingBuyinBanner(`נרשמה בקשה ל${verb} ₪${amount} ל-${playerName}...`);
  render();
  if (fromEl) { const totalEl = document.querySelector("[data-player-total]"); if (totalEl) flyAmountBadge(fromEl, totalEl, amount); }

  let ok = false;
  const sentActorName = actorName === playerName ? undefined : actorName;
  try {
    if (USE_RELATIONAL_API) {
      await v2AddBuyin(gameId, id, playerId, amount, sentActorName);
    } else {
      await mutateAndSave(() => {
        const freshG = getGame(gameId);
        freshG.buyins.push({id, playerId, amount, ts: Date.now(), actorName: sentActorName});
      });
    }
    ok = true;
  } catch(e) {
    showAlert("שמירה נכשלה - בדוק את החיבור לאינטרנט ונסה שוב.");
  }

  clearPendingBuyinBanner();
  const wasCancelled = !!(pendingBuyinRequest && pendingBuyinRequest.cancelled);
  pendingBuyinRequest = null;

  if (ok && wasCancelled) {
    try {
      if (USE_RELATIONAL_API) await v2DeleteBuyin(gameId, id);
      else await mutateAndSave(() => { const freshG = getGame(gameId); freshG.buyins = freshG.buyins.filter(b=>b.id!==id); });
    } catch(e) { /* best-effort - a failed rollback just leaves one real row behind */ }
  } else if (ok) {
    showBuyinConfirmCard(id, playerName, amount, isEntry);
  }
  render();
}

// Best-effort only - manifest.json's own "orientation":"portrait-primary" is what actually
// works reliably (for an installed PWA); the Screen Orientation API's lock() is unsupported
// or refused in most other contexts (a plain browser tab, iOS Safari at all), so this
// silently no-ops there instead of erroring - the table screen just won't visually rotate
// with the phone whenever the platform does support it.
function lockPortraitForScreen(screenName){
  try {
    const so = window.screen && window.screen.orientation;
    if (!so) return;

    else if (screenName !== "table" && so.unlock) so.unlock();

}
// Tags a roster entry as belonging to this device's own identity, once we know that for

// every community they're in (state.globalPlayers, keyed by this clientId) - a roster
// entry someone else typed in by hand (no phone of their own involved) has no way to
// know it's the same real person as an entry in a different community, so it stays a
// standalone per-community entry like today.

function renamePlayerEverywhere(clientId, newName){

// every single save (a buy-in that changes a few bytes still carried everyone's avatar
// along with it, ~98% of a real save's payload in practice). Every existing .photo/
// .image field already just gets interpolated straight into an <img src> or
// background-image:url(...), so this URL is a drop-in replacement for the old inline

function photoUrl(id){ return "/api/photos/" + id; }

  if (!res.ok) throw new Error("photo upload failed: " + res.status);

// The custom-avatar gallery is shared across everyone (not per-community), so opening it
// the first time on a device fires one request per avatar (dozens) that a browser hasn't
// cached yet - noticeably slow just for that first open, fast every time after since
// /api/photos responses are cached for a year. Quietly warming the browser's own HTTP
// cache with these in the background right after the app loads (not blocking anything,
// not awaited) means that cost is usually already paid by the time someone actually opens
// the avatar picker, instead of being felt as a delay right when they tap it.
// Called right after init(), even while the login gate is up - a first-time visitor
// is about to go check their email for the code, which takes at least a few seconds,
// so warming every avatar image into the browser's cache now means the picker feels
// instant by the time they actually reach it instead of visibly loading tile by tile.
function prefetchAvatars(){
  try {
    AVATAR_CATEGORIES.forEach(cat => {
      cat.items.forEach((name, i) => {
        const img = new Image();
        img.src = `/static/avatars/${cat.folder}/${i+1}.jpg`;
      });
    });
    (state.customAvatars || []).forEach(av => {
      if (av.image && av.image.startsWith("/api/photos/")) {
        const img = new Image();
        img.src = av.image;
      }
    });
  } catch(e) { /* best-effort only */ }
}
// The vision API (callClaudeVisionMulti) needs actual base64 image bytes, not a URL - used
// only for chip reference photos sent along with an AI chip-count analysis, a rare enough
// action that paying for this fetch at use-time is no loss compared to keeping them inline
// in state (and resending them on every unrelated save) just for this one occasional path.
async function urlToDataUrl(url){
  const res = await fetch(url);
  const blob = await res.blob();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
// Seat a player into the first open slot (main 9, then the 10th overflow slot),
// growing g.seats to hold it if needed. Shared by autoSeatSelf and autoJoinViaInvite.
function seatPlayerIfRoom(g, playerId, p){
  if (!g.seats) g.seats = new Array(9).fill(null);
  if (g.seats.includes(playerId)) return true;
  let emptyIdx = g.seats.findIndex((s,i) => i < 9 && !s);
  if (emptyIdx === -1) {
    while (g.seats.length < 10) g.seats.push(null);
    if (g.seats[9] == null) emptyIdx = 9;
  }
  if (emptyIdx === -1) return false; // table full (10/10)
  g.seats[emptyIdx] = playerId;
  if (!g.players.some(gp => gp.id === playerId)) g.players.push({id:p.id, name:p.name});
  if (!g.liveChips) g.liveChips = {};
  if (g.liveChips[playerId] === undefined) g.liveChips[playerId] = 0;
  return true;
}
// If this device is remembered as a specific roster player in this game's community,
// and that player isn't seated yet in this game, seat them automatically - so returning
// players don't have to pick their name every night.
function autoSeatSelf(gameId){
  const g = getGame(gameId);
  if (!g || g.closed) return;
  const c = getCommunity(g.communityId);
  if (!c) return;
  const playerId = myIdentity.myPlayers && myIdentity.myPlayers[g.communityId];
  const p = playerId ? c.roster.find(pl => pl.id === playerId) : null;
  // Cheap pre-check against whatever state is already in memory, purely to skip the
  // network round trip in the overwhelmingly common case (already seated correctly) -
  // the real, authoritative check runs inside mutateAndSave below either way.
  if (p && p.name === myIdentity.name && p.clientId && g.seats && g.seats.includes(p.id)) return;
  if (USE_RELATIONAL_API) {
    (async () => {
      let p2 = p;
      if (myIdentity.name && (!p2 || p2.name !== myIdentity.name)) {
        const byName = c.roster.find(pl => pl.name === myIdentity.name);
        if (byName) {
          p2 = byName;
          if (!myIdentity.myPlayers) myIdentity.myPlayers = {};
          myIdentity.myPlayers[g.communityId] = byName.id;
          saveIdentity();
        } else {
          p2 = null;
        }
      }
      if (!p2) return;
      if (!p2.clientId) await v2LinkRosterPlayer(g.communityId, p2.id, myIdentity.id);
      await v2SeatPlayerIfRoom(gameId, p2.id, p2.name);
      render();
    })();
    return;
  }
  // Retry-safe: re-syncs and re-applies this same logic against the freshest state if
  // another device's save landed in between, instead of this device's stale in-memory
  // copy silently overwriting (and losing) whatever that other save just added - see
  // mutateAndSave's own comment for the full explanation of that race.
  mutateAndSave(() => {
    const g = getGame(gameId);
    if (!g || g.closed) return;
    const c = getCommunity(g.communityId);
    if (!c) return;
    let p = playerId ? c.roster.find(pl => pl.id === playerId) : null;
    // Self-healing for devices that got mis-linked by an earlier bug (assigning someone
    // else to a seat used to overwrite this device's own remembered player): if the
    // remembered player's name doesn't match this device's own identity name, it's
    // wrong - look up the right one by name instead of trusting a stale link, and fix
    // it going forward.
    if (myIdentity.name && (!p || p.name !== myIdentity.name)) {
      const byName = c.roster.find(pl => pl.name === myIdentity.name);
      if (byName) {
        p = byName;
        if (!myIdentity.myPlayers) myIdentity.myPlayers = {};
        myIdentity.myPlayers[g.communityId] = byName.id;
        saveIdentity();
      } else {
        p = null;
      }
    }
    if (!p) return;
    // Backfill for players who self-identified before global-player linking existed:
    // their myPlayers link is already correct, they just never got a clientId.
    if (!p.clientId) linkToGlobalPlayer(p);
    seatPlayerIfRoom(g, p.id, p);
  });

    let playerId = myIdentity.myPlayers && myIdentity.myPlayers[g.communityId];
    let p = playerId ? c.roster.find(pl => pl.id === playerId) : null;

  // First time opening settings for a community still on the old single-link field -
  // fold it into the new list so it isn't silently lost.
  if ((!c.payboxLinks || !c.payboxLinks.length) && c.payboxLink) {
    const entry = {id: uid(), name: "פייבוקס", link: c.payboxLink};
    c.payboxLinks = [entry];
    c.activePayboxLinkId = entry.id;
    delete c.payboxLink;
    saveState();
  }
  setupDirty = false;
  openModal({type:"payboxSettings", communityId});
}
// Drop-in replacement for the browser's native alert() - every existing call site
// already just shows a message and returns right after (nothing waits on the native
// dialog's blocking behavior), so a non-blocking custom toast is a safe swap. Skips the
// native dialog's own "<hostname> says" chrome, which read as a raw/unpolished
// Render URL rather than part of the app. Stacks above any open modal (higher
// z-index), auto-dismisses, and can also be tapped away early.
function showAlert(message){
  const el = document.createElement("div");
  el.className = "custom-alert";
  el.innerHTML = `<div class="custom-alert-box">
    <span>${esc(String(message))}</span>
    <button class="custom-alert-close" aria-label="סגור">${icon('x')}</button>
  </div>`;
  document.body.appendChild(el);
  const remove = () => el.remove();
  el.onclick = (e) => { if (e.target === el) remove(); };
  el.querySelector(".custom-alert-close").onclick = remove;
  setTimeout(remove, 6000);
}
// showConfirm() - custom stand-in for the browser's native confirm(), same reasoning as
// showAlert() above. Async since it has to wait for a click instead of blocking the thread.
function showConfirm(message){
  return new Promise((resolve) => {
    const el = document.createElement("div");
    el.className = "custom-confirm";
    el.innerHTML = `<div class="custom-confirm-box">
      <div>${esc(String(message))}</div>
      <div class="custom-confirm-actions">
        <button class="btn btn-ghost btn-block" data-confirm-cancel>ביטול</button>
        <button class="btn btn-primary btn-block" data-confirm-ok>אישור</button>
      </div>
    </div>`;
    document.body.appendChild(el);
    const finish = (result) => { el.remove(); resolve(result); };
    el.querySelector("[data-confirm-ok]").onclick = () => finish(true);
    el.querySelector("[data-confirm-cancel]").onclick = () => finish(false);
    el.onclick = (e) => { if (e.target === el) finish(false); };
  });
}
function updateModal(partial){
  // Toggling a checkbox shouldn't jump the scroll back to the top - capture and
  // restore scroll positions of the modal and any inner scrollable list around the re-render.
  const modalEl = document.querySelector(".modal");
  const listEl = document.querySelector(".scroll-list");
  const modalScroll = modalEl ? modalEl.scrollTop : null;
  const listScroll = listEl ? listEl.scrollTop : null;
  if (modal && (modal.type === "chipSetup" || modal.type === "payboxSettings" || modal.type === "buyinSetup")) setupDirty = true;
  modal = Object.assign({}, modal, partial);
  render();
  const modalEl2 = document.querySelector(".modal");
  const listEl2 = document.querySelector(".scroll-list");
  if (modalEl2 && modalScroll != null) modalEl2.scrollTop = modalScroll;
  if (listEl2 && listScroll != null) listEl2.scrollTop = listScroll;
}

// cashout-related actions, including ones on an already-closed game (a no-op then).
function maybeAutoCloseNight(g){
  const seated = (g.seats || []).filter(Boolean);
  const shouldClose = g.players.length > 0 && seated.every(pid => pid in g.cashouts);
  if (shouldClose && !g.closed) g.closed = true;
}

// ---------- Player selfie photos (double-tap a seated player's circle) ----------
let selfieInput = null;
function processSelfieFile(file, callback){
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 240;
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - side) / 2;
      const sy = (img.naturalHeight - side) / 2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      callback(canvas.toDataURL("image/jpeg", 0.75));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function openFilePicker(communityId, playerId, useCamera){
  if (!selfieInput) {
    selfieInput = document.createElement("input");
    selfieInput.type = "file";
    selfieInput.accept = "image/*";
    selfieInput.style.display = "none";
    document.body.appendChild(selfieInput);
  }
  if (useCamera) selfieInput.capture = "user"; else selfieInput.removeAttribute("capture");
  selfieInput.value = "";
  selfieInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    processSelfieFile(file, async (dataUrl) => {
      let photo;
      try { photo = await uploadPhoto(dataUrl); }
      catch(e) { showAlert("העלאת התמונה נכשלה - בדוק את החיבור לאינטרנט ונסה שוב."); return; }
      // Re-syncs this handful of fields immediately before writing one of them - see
      // syncLegacyOnlyFields's own comment on the lost-update race this closes.
      await syncLegacyOnlyFields();
      // No communityId means this was opened from the identity/name screen - set the
      // viewer's own global avatar directly rather than a specific roster entry.
      if (!communityId) { setGlobalPlayer(myIdentity.id, {photo}); saveState(); updateAccount({photo}); render(); return; }
      const c = getCommunity(communityId);
      const rp = c && c.roster.find(pl => pl.id === playerId);
      if (rp && !rp.clientId) { showAlert("אפשר לקבוע אווטר רק לשחקן שנכנס בעצמו דרך קישור הזמנה."); return; }
      if (rp) { setPlayerPhoto(rp, photo); saveState(); render(); }
    });
  };
  selfieInput.click();
  closeModal();
}

// The three built-in categories (legends/celebs/cartoons) and their static/avatars/...
// image files were removed - the images were invalid/broken. Left as an empty array
// rather than deleted outright, since getAvatarGroups()/prefetchAvatars() below (and the
// avatarManage screen) iterate over it generically and work fine with none - only
// admin-added custom avatars (state.customAvatars) show up in the picker now.
const AVATAR_CATEGORIES = [];
// Admin-created avatars (state.customAvatars: {id, name, category, image}) merge into these
// built-in groups by matching category label, or form new groups of their own.
function getAvatarGroups(){
  const hidden = new Set(state.hiddenAvatarKeys||[]);
  const labelOverrides = state.avatarCategoryLabelOverrides || {};
  const nameOverrides = state.avatarNameOverrides || {};
  const groups = AVATAR_CATEGORIES.map(cat => ({
    key: "builtin-cat:" + cat.folder,
    label: labelOverrides[cat.folder] || cat.label,
    items: cat.items.map((name,i) => {
      const pickKey = "builtin:" + cat.folder + "/" + (i+1);
      return {name: nameOverrides[pickKey] || name, pickKey, src: `/static/avatars/${cat.folder}/${i+1}.jpg`};
    }).filter(it => !hidden.has(it.pickKey))
  }));
  (state.customAvatars||[]).forEach(av => {
    const key = "custom-cat:" + av.category;
    let grp = groups.find(g => g.key === key);
    if (!grp) { grp = {key, label: av.category, items: []}; groups.push(grp); }
    grp.items.push({name: av.name, pickKey: "custom:" + av.id, src: av.image});
  });
  const visible = groups.filter(g => g.items.length);
  const order = state.avatarCategoryOrder;
  if (order && order.length) {
    visible.sort((a,b) => {
      const ia = order.indexOf(a.key); const ib = order.indexOf(b.key);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
  }
  return visible;
}

function playerNetProfit(communityId, playerId){
  let net = 0, count = 0;
  gamesForCommunity(communityId).forEach(g => {
    const co = g.cashouts[playerId];
    if (!co) return;
    const buyins = g.buyins.filter(b=>b.playerId===playerId).reduce((s,b)=>s+b.amount,0);

  return `<span class="balance-line ${cls}" style="margin-top:0;">${net>=0?"+":""}₪${Math.round(net)} ${gamesText}</span>`;
}

// ---------- Settlement algorithm ----------
function computeBalances(game){
  const balances = {};
  game.players.forEach(p => {
    const buyins = game.buyins.filter(b => b.playerId === p.id).reduce((s,b)=>s+b.amount,0);
    const cashout = (game.cashouts[p.id] || {}).amount ?? 0;
    balances[p.id] = { buyins, cashedOut: p.id in game.cashouts, profit: cashout - buyins };
  });
  return balances;
}
function settleTransactions(balances, players){
  const creditors = [], debtors = [];
  Object.entries(balances).forEach(([id,b])=>{
    if (b.profit > 0.005) creditors.push({id, amt:b.profit});
    else if (b.profit < -0.005) debtors.push({id, amt:-b.profit});
  });
  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);
  const nameOf = id => (players.find(p=>p.id===id)||{}).name || "?";
  const txns = [];
  let ci=0, di=0;
  while(ci<creditors.length && di<debtors.length){
    const c=creditors[ci], d=debtors[di];
    const amt = Math.min(c.amt, d.amt);
    if (amt > 0.005) txns.push({from:d.id, fromName:nameOf(d.id), to:c.id, toName:nameOf(c.id), amount:Math.round(amt*100)/100});
    c.amt -= amt; d.amt -= amt;
    if (c.amt <= 0.005) ci++;
    if (d.amt <= 0.005) di++;
  }
  return txns;
}

// Every cashed-out game this player has in this community, oldest first, each with their
// own profit for that game - the shared data source for every exit-highlight stat below.
// Sourced from state.games directly (not just the current game) since several of these
// stats are explicitly about history ("ב-5 המשחקים האחרונים"), not just tonight.
function getPlayerGameProfits(communityId, playerId){
  return (state.games||[])
    .filter(gm => gm.communityId === communityId && gm.cashouts && (playerId in gm.cashouts))
    .map(gm => {
      const buyinTotal = (gm.buyins||[]).filter(b=>b.playerId===playerId).reduce((s,b)=>s+b.amount,0);
      return {
        gameId: gm.id, date: gm.date || "",
        ts: (gm.cashouts[playerId]||{}).ts || 0,
        profit: (gm.cashouts[playerId]||{}).amount - buyinTotal,
        buyinCount: (gm.buyins||[]).filter(b=>b.playerId===playerId).length,
      };
    })
    .sort((a,b) => (a.date||"").localeCompare(b.date||"") || (a.ts - b.ts));
}
// Up to 3 flattering facts to show a player right when they cash out (item 7) - every
// candidate below is self-gating (only added when it's actually true/positive for THIS
// player right now), then the first 3 by priority win. Priority is a judgment call, not
// specified: a personal milestone (new record, a streak) ranks above a plain relative
// comparison (rank/average), which ranks above a same-night-only fact (tonight's best,
// fewest buy-ins) - the first two still hold once the night is forgotten, the others don't.
function computeExitHighlights(c, g, playerId){
  const history = getPlayerGameProfits(c.id, playerId); // includes the game just cashed out of
  if (!history.length) return [];
  const candidates = [];
  const last = n => history.slice(-n);
  const sum = arr => arr.reduce((s,x)=>s+x.profit, 0);
  const currentProfit = history[history.length-1].profit;

  if (history.length > 1) {
    const bestEver = Math.max(...history.map(h=>h.profit));
    if (currentProfit > 0.005 && currentProfit >= bestEver - 0.005) {
      candidates.push({pri:1, text:`שיא רווח אישי חדש: ₪${Math.round(currentProfit)}!`});
    }
  }

  let streak = 0;
  for (let i=history.length-1; i>=0; i--) { if (history[i].profit > 0.005) streak++; else break; }
  if (streak >= 2) candidates.push({pri:2, text:`רצף של ${streak} משחקים ברווח!`});

  if (history.length >= 2) {
    const N = Math.min(5, history.length);
    const communityPlayerIds = new Set();
    (state.games||[]).filter(gm=>gm.communityId===c.id).forEach(gm => Object.keys(gm.cashouts||{}).forEach(pid2=>communityPlayerIds.add(pid2)));
    const sums = Array.from(communityPlayerIds).map(pid2 => ({pid2, s: sum(getPlayerGameProfits(c.id, pid2).slice(-N))}));
    sums.sort((a,b)=>b.s-a.s);
    const rank = sums.findIndex(x=>x.pid2===playerId) + 1;
    if (sums.length >= 3 && rank >= 1 && rank <= 3) {
      const place = rank===1 ? "ראשון" : rank===2 ? "שני" : "שלישי";
      candidates.push({pri:3, text:`ב-${N} המשחקים האחרונים אתה במקום ה${place} בקבוצה`});
    }
    const myRecentSum = Math.round(sum(last(N)) * 100) / 100;
    if (myRecentSum > 0.005) candidates.push({pri:4, text:`ב-${N} המשחקים האחרונים הרווחת ₪${Math.round(myRecentSum)}`});
  }

  if (history.length >= 6) {
    const N = 5;
    const recentAvg = sum(last(N)) / N;
    const overallAvg = sum(history) / history.length;
    if (recentAvg > overallAvg + 0.5) {
      candidates.push({pri:5, text:`הממוצע שלך לאחרונה (₪${Math.round(recentAvg)}) טוב מהממוצע הכללי שלך (₪${Math.round(overallAvg)})`});
    }
  }

  const tonight = Object.keys(g.cashouts||{}).map(pid2 => {
    const buyinTotal = (g.buyins||[]).filter(b=>b.playerId===pid2).reduce((s,b)=>s+b.amount,0);
    return {pid2, profit: g.cashouts[pid2].amount - buyinTotal, buyinCount: (g.buyins||[]).filter(b=>b.playerId===pid2).length};
  });
  if (tonight.length >= 2) {
    const maxTonight = Math.max(...tonight.map(x=>x.profit));
    if (currentProfit > 0.005 && currentProfit >= maxTonight - 0.005) candidates.push({pri:6, text:"הרווח הגבוה ביותר הערב!"});
    const minCount = Math.min(...tonight.map(x=>x.buyinCount));
    const myCount = (g.buyins||[]).filter(b=>b.playerId===playerId).length;
    if (myCount > 0 && myCount <= minCount && myCount <= 1) candidates.push({pri:7, text:`הכי מעט ריביים הערב (${myCount})`});
  }

  candidates.sort((a,b)=>a.pri-b.pri);
  return candidates.slice(0,3).map(x=>x.text);
}

// A player who left mid-game and arranged payment directly with active counterpart(s)
// already moved real cash with those specific people. That must count toward the
// final settlement - otherwise the app would ask for transfers that ignore money
// that already changed hands, or ask people to pay twice.
function computeArrangementAdjustments(game){
  const raw = computeBalances(game);
  const adjusted = {};
  Object.keys(raw).forEach(id => { adjusted[id] = raw[id].profit; });
  const excluded = new Set();
  const entries = Object.entries(game.cashouts).sort((a,b) => (a[1].ts||0) - (b[1].ts||0));
  entries.forEach(([playerId, co]) => {
    if (co.arrangedWith && co.arrangedWith.length > 0) {
      const share = adjusted[playerId] / co.arrangedWith.length;
      co.arrangedWith.forEach(cid => { if (adjusted[cid] !== undefined) adjusted[cid] += share; });
      excluded.add(playerId);
    }
  });
  return { adjusted, excluded };
}

function computeFinalBalances(game){
  const { adjusted, excluded } = computeArrangementAdjustments(game);
  const finalBalances = {};
  Object.keys(adjusted).forEach(id => { if (!excluded.has(id)) finalBalances[id] = {profit: adjusted[id]}; });
  return finalBalances;
}

// Direct player-to-player settlements outside the app (the cash-out flow's own "arranged
// with" picker) that involve this player, from either side: their OWN cashout might name
// others (they're the one who said "I already settled with X" when leaving), and/or
// someone ELSE'S cashout might name THEM (the other side of the same arrangement - which
// can be true even before this player has cashed out themselves, e.g. the person they
// arranged with already left). Same math/labeling the "history" modal already used inline
// in two separate places; pulled out here so the admin screen and player screen (which
// need this too) don't have to duplicate it a third and fourth time.
function getArrangementNotes(g, playerId){
  const notes = [];
  const myOut = g.cashouts[playerId];
  if (myOut && myOut.arrangedWith && myOut.arrangedWith.length) {
    const myProfit = computeArrangementAdjustments(g).adjusted[playerId];
    const share = Math.round((myProfit / myOut.arrangedWith.length) * 100) / 100;
    myOut.arrangedWith.forEach(id => {
      const name = (g.players.find(pl=>pl.id===id)||{}).name || "?";
      notes.push({ received: share >= 0, name, amount: Math.abs(share) });
    });
  }
  const adj = computeArrangementAdjustments(g).adjusted;
  Object.entries(g.cashouts).forEach(([otherId, co]) => {
    if (otherId === playerId) return;
    if (!co.arrangedWith || !co.arrangedWith.includes(playerId)) return;
    const otherName = (g.players.find(pl=>pl.id===otherId)||{}).name || "?";
    const otherProfit = adj[otherId];
    const share = Math.round((Math.abs(otherProfit) / co.arrangedWith.length) * 100) / 100;
    notes.push({ received: otherProfit < 0, name: otherName, amount: share }); // if the other player owed money, this player received from them
  });
  return notes;
}

// One real mp3 (item 13), played together with the confirm card (showBuyinConfirmCard) -
// on every connected device, same trigger as the card itself, not tied to any one local
// click. A fresh Audio() per play (not one shared/reused element) so two buy-ins landing
// close together both actually play instead of the second cutting the first off. No mute
// control by design - best-effort only, errors (autoplay blocked, asset missing) are
// swallowed so a failed sound never blocks the buy-in itself or the card.
function playBuyinSound(){
  // Prefer the pre-unlocked AudioContext (see tryUnlockAudioForIOS) when it's ready - far
  // more likely to actually play on iOS for a sound triggered by someone else's buy-in
  // arriving in the background, not this device's own tap.
  if (unlockedAudioCtx && buyinSoundBuffer) {
    try {
      unlockedAudioCtx.resume().catch(() => {});
      const src = unlockedAudioCtx.createBufferSource();
      src.buffer = buyinSoundBuffer;
      src.connect(unlockedAudioCtx.destination);
      src.start(0);
      return;
    } catch(e) { /* fall through to the plain Audio() path below */ }
  }
  try {
    const audio = BUYIN_SOUND_TEMPLATE ? BUYIN_SOUND_TEMPLATE.cloneNode(true) : new Audio("/static/buyin-sound.mp3");
    audio.play().catch(() => {});
  } catch(e) { /* audio unsupported/blocked */ }
}

// ---------- Settlement arrows on the table screen (restored from the pre-carousel table
// action panel - git history 82abca2/ed1b9db/9a7c96c/73e9657/748c99f/117ef81 - still
// direct-settlement-mode-only, the same algorithm and rendering approach) ----------
// set by renderTable(), consumed by drawSettlementArrows() after the DOM updates.
let currentSettlementTransfers = null;
// Minimum-transfer settlement: who still needs to pay whom, and how much, to zero
// everyone out - folding in money already moved (paybox-pot payments reduce what the
// payer still owes overall; direct player-to-player payments net out between that
// specific pair) before running the standard greedy largest-debtor/largest-creditor
// match. Direct payments already made are returned separately so the caller can draw
// them as "already settled" rather than have the algorithm recompute them.
function computeSettlementTransfers(game){
  const finalBalances = computeFinalBalances(game);
  const working = {};
  Object.keys(finalBalances).forEach(id => { working[id] = finalBalances[id].profit; });

  (game.payboxPayments||[]).forEach(pp => {
    if (working[pp.playerId] !== undefined) working[pp.playerId] += pp.amount;
  });
  const directPayments = game.playerPayments || [];
  directPayments.forEach(dp => {
    if (working[dp.fromPlayerId] !== undefined) working[dp.fromPlayerId] += dp.amount;
    if (working[dp.toPlayerId] !== undefined) working[dp.toPlayerId] -= dp.amount;
  });

  const debtors = [], creditors = [];
  Object.entries(working).forEach(([id, bal]) => {
    if (bal < -0.5) debtors.push({id, amt: -bal});
    else if (bal > 0.5) creditors.push({id, amt: bal});
  });
  debtors.sort((a,b) => b.amt - a.amt);
  creditors.sort((a,b) => b.amt - a.amt);

  const remaining = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const pay = Math.round(Math.min(debtors[i].amt, creditors[j].amt) * 100) / 100;
    if (pay > 0) remaining.push({ from: debtors[i].id, to: creditors[j].id, amount: pay });
    debtors[i].amt -= pay;
    creditors[j].amt -= pay;
    if (debtors[i].amt < 0.5) i++;
    if (creditors[j].amt < 0.5) j++;
  }

  return { remaining, alreadyPaid: directPayments };
}

// Draws the settlement arrows into #settlement-overlay using each seat-circle's actual
// measured position, not a percentage guess - the seat-wrap block centers itself (circle
// + name/caption stacked below) on its left%/top% point, so the circle's own visual
// center sits above that point, not on it. Using real getBoundingClientRect() avoids
// having to hand-derive that offset, and lets each line get trimmed back by the circle's
// radius so it starts/ends at the nearest edge between the two circles instead of
// disappearing under them. Called after every render() (table screen only, no-op if
// settlement isn't showing) since it needs the seats already laid out in the DOM.
function drawSettlementArrows(){
  const overlay = document.getElementById("settlement-overlay");
  if (!overlay) return;
  const data = currentSettlementTransfers;
  if (!data) { overlay.innerHTML = ""; return; }

  // #settlement-overlay is inset:0 inside .poker-table-inner (its actual CSS positioning
  // parent), NOT .poker-table-wrap - inner is a separately JS-sized (layoutTableSize) and
  // centered/anchored box that rarely matches wrap's own edges exactly.
  const inner = overlay.closest(".poker-table-inner");
  if (!inner) return;
  const innerRect = inner.getBoundingClientRect();

  const centerOf = (playerId) => {
    const idx = data.seats.indexOf(playerId);
    if (idx === -1) return null;
    const circle = inner.querySelector(`[data-seat="${idx}"] .seat-circle`);
    if (!circle) return null;
    const r = circle.getBoundingClientRect();
    return { x: r.left + r.width/2 - innerRect.left, y: r.top + r.height/2 - innerRect.top, radius: r.width/2 };
  };

  const items = [];
  data.transfers.forEach(t => {
    if (data.filterId && t.fromId !== data.filterId && t.toId !== data.filterId) return;
    const from = centerOf(t.fromId), to = centerOf(t.toId);
    if (!from || !to) return;
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.hypot(dx, dy) || 1;
    const ux = dx / dist, uy = dy / dist;
    items.push({
      x1: from.x + ux*from.radius, y1: from.y + uy*from.radius,
      x2: to.x - ux*to.radius, y2: to.y - uy*to.radius,
      amount: t.amount, paid: t.paid,
    });
  });

  if (!items.length) { overlay.innerHTML = ""; return; }

  const lines = items.map(it => {
    const color = it.paid ? "#e7e5e4" : "#fbbf24";
    const marker = it.paid ? "arrowhead-paid" : "arrowhead-gold";
    const dash = it.paid ? ` stroke-dasharray="5,4"` : "";
    return `<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="${color}" stroke-width="${it.paid?2:2.5}" opacity="${it.paid?0.85:0.9}"${dash} marker-end="url(#${marker})"/>`;
  }).join("");
  const svg = `<svg width="${innerRect.width}" height="${innerRect.height}" viewBox="0 0 ${innerRect.width} ${innerRect.height}" style="position:absolute;inset:0;z-index:2;pointer-events:none;">
    <defs>
      <marker id="arrowhead-gold" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/></marker>
      <marker id="arrowhead-paid" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e7e5e4"/></marker>
    </defs>
    ${lines}
  </svg>`;

  const labels = items.map(it => {
    const mx = (it.x1+it.x2)/2, my = (it.y1+it.y2)/2;
    return `<div style="position:absolute;left:${mx}px;top:${my}px;transform:translate(-50%,-50%);z-index:5;background:${it.paid?'#3f3c39':'#78350f'};color:${it.paid?'#a8a29e':'#fde68a'};font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;white-space:nowrap;">₪${it.amount}${it.paid?' ✓':''}</div>`;
  }).join("");

  overlay.innerHTML = svg + labels;
}

function profitColor(v){ return v>0.005 ? '#6ee7b7' : (v<-0.005 ? '#fda4af' : 'inherit'); }

// ---------- Screen names (for talking about the app together, and shown in the header) ----------
const SCREEN_NAMES = {
  home: "מסך הבית",
  community: "מסך הקבוצה",
  table: "מסך השולחן"
};

// True when this device actually has a seat in the given game - the player screen (the
// table nav's default face) only makes sense for someone actually playing; anyone else
// (an admin just checking in, a spectator) always gets the classic circles view instead,
// regardless of tableSubView.
function isSeatedInGame(g){
  if (!g) return false;
  const myPlayerId = myIdentity.myPlayers && myIdentity.myPlayers[g.communityId];
  return !!(myPlayerId && (g.seats||[]).includes(myPlayerId));
}
function render(){
  const app = document.getElementById("app");
  document.body.classList.toggle("table-screen", nav.screen === "table");
  let html = "";
  let seated = false;
  let resultsScreen = false;
  let welcomeGameId = null, welcomePlayerId = null;
  if (nav.screen === "home") html = renderHome();
  else if (nav.screen === "community") html = renderCommunity(nav.communityId);
  else if (nav.screen === "table") {
    const g = getGame(nav.gameId);
    const c = g && getCommunity(g.communityId);
    // A closed-and-balanced game is final - nothing left to edit, only transfers left to
    // mark as paid - so it gets its own read-only screen instead of the player/table/admin
    // carousel (see isGameSettled's own comment for why g.closed alone isn't enough here).
    if (g && isGameSettled(g)) {
      resultsScreen = true;
      html = `<div class="table-swipe-root">${renderGameResultsScreen(nav.gameId)}</div>`;
    } else {
    seated = isSeatedInGame(g);
    if (seated) {
      const myPlayerId = myIdentity.myPlayers && myIdentity.myPlayers[g.communityId];
      if (myPlayerId && !hasWelcomedGame(g.id)) { welcomeGameId = g.id; welcomePlayerId = myPlayerId; }
      const pageOrder = swipePageOrder(g, c);
      // Losing admin rights (or just never having had them) between renders shouldn't
      // strand tableSubView on a page that no longer exists in the carousel - falls back
      // to the default face instead of rendering nothing/crashing on a page lookup miss.
      if (!pageOrder.includes(tableSubView)) tableSubView = "player";
      const N = pageOrder.length;
      const RENDERERS = { player: () => renderPlayerScreen(nav.gameId), table: () => renderTable(nav.gameId), admin: () => renderAdminScreen(nav.gameId) };
      // Every page in the carousel is mounted at once (not just the active one) - lets the
      // swipe drag actually slide real content under the finger like a phone home screen,
      // instead of an invisible gesture that only silently swaps views on release (that
      // version was reported repeatedly as "swiping doesn't work" even once the touch
      // handling itself was fixed - it technically worked, it just never looked or felt
      // like it was doing anything while dragging). Exactly 2 pages (no admin screen) keep
      // the DOM in the fixed authored order [player, table] always, with attachHandlers'
      // own swipe logic reordering those two real nodes on the fly as a gesture commits to
      // a direction (see ensureAdjacency there) - the only way to make BOTH swipe
      // directions reveal the same lone "other" page smoothly with just 2 real pages and
      // no duplicates. With 3 pages there's no such wraparound gap to begin with: centering
      // the current page between its two DISTINCT real neighbors (prev, cur, next) already
      // covers both drag directions correctly every render, no reordering ever needed.
      const domOrder = N === 3 ? [cyclicPage(pageOrder, tableSubView, -1), tableSubView, cyclicPage(pageOrder, tableSubView, 1)] : pageOrder;
      const restOffset = N === 3 ? "-100%" : (domOrder[0] === tableSubView ? "0" : "-100%");
      const pagesHtml = domOrder.map(key => `<div class="swipe-page">${RENDERERS[key]()}</div>`).join("");
      const DOT_LABELS = { admin: "ניהול שחקנים", player: "השחקן שלי", table: "שולחן" };
      const dotsRow = `
        <div style="display:flex;justify-content:center;gap:6px;">
          ${pageOrder.map(key => `<span style="width:7px;height:7px;border-radius:50%;background:${tableSubView===key?'var(--gold)':'rgba(255,255,255,.25)'};" title="${DOT_LABELS[key]}"></span>`).join("")}
        </div>
      `;
      // With all 3 faces in the carousel, a plain row of dots doesn't say WHICH screen is
      // in which direction - these two corner labels name the adjacent screen a swipe (or
      // a tap right here) leads to, with a chevron pointing toward it. Only shown with 3
      // pages: with just 2 (player/table) there's only one "other" screen either way, not
      // worth labeling twice.
      const dotsHtml = N === 3 ? `
        <div style="position:relative;padding:8px 0;flex-shrink:0;">
          <button data-swipe-to="${cyclicPage(pageOrder, tableSubView, -1)}" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.55);font-size:11px;display:flex;align-items:center;gap:3px;cursor:pointer;padding:4px;">${esc(DOT_LABELS[cyclicPage(pageOrder, tableSubView, -1)])}${icon('left')}</button>
          ${dotsRow}
          <button data-swipe-to="${cyclicPage(pageOrder, tableSubView, 1)}" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.55);font-size:11px;display:flex;align-items:center;gap:3px;cursor:pointer;padding:4px;">${icon('right')}${esc(DOT_LABELS[cyclicPage(pageOrder, tableSubView, 1)])}</button>
        </div>
      ` : `<div style="padding:8px 0;flex-shrink:0;">${dotsRow}</div>`;
      html = `<div class="table-swipe-root">
        <div class="swipe-track-viewport">
          <div class="swipe-track" data-swipe-track style="transform:translateX(${restOffset});">
            ${pagesHtml}
          </div>
        </div>
        ${dotsHtml}
      </div>`;
    } else {
      // Not seated (spectator/admin) - only the circles view exists, nothing to swipe to,
      // so skip the carousel machinery entirely and keep the plain single-face structure.
      html = `<div class="table-swipe-root">${renderTable(nav.gameId)}</div>`;
    }
    }
  }
  const SUB_VIEW_LABELS = { player: "מסך שחקן", table: "מסך השולחן", admin: "מסך ניהול שחקנים" };
  const screenLabel = resultsScreen ? "תוצאות משחק" : ((seated && SUB_VIEW_LABELS[tableSubView]) || (SCREEN_NAMES[nav.screen] || nav.screen));
  const screenTag = `<div class="screen-tag">${esc(screenLabel)}</div>`;
  html = screenTag + html;
  if (modal) html += renderModal(modal);
  else if (welcomeGameId) html += renderGameWelcomeOverlay(welcomeGameId, welcomePlayerId);
  // Captured BEFORE replacing the DOM below - app.innerHTML wipes and recreates these
  // elements from scratch every render, so a brand new element always starts at
  // scrollTop 0 regardless of where the old one was left. Not explicitly restoring that
  // (previous fix only skipped the force-to-bottom, assuming the browser would otherwise
  // leave the scroll position alone) meant every no-op render silently reset both frames
  // to the top - reported live as "now it jumps to the top every few seconds instead".
  const prevHistoryScrollTop = (() => { const el = app.querySelector("[data-player-history]"); return el ? el.scrollTop : null; })();
  const prevFeedScrollTop = (() => { const el = app.querySelector("[data-player-feed]"); return el ? el.scrollTop : null; })();
  // Same reasoning as the history/feed frames above, for the admin screen's own scrollable
  // body - nothing here has "scroll to the newest item" chat semantics, so it's a plain
  // restore with no latest-key tracking needed (reported live as "scrolling the admin
  // screen jumps back to the top every few seconds").
  const prevAdminScrollTop = (() => { const el = app.querySelector("[data-admin-scroll]"); return el ? el.scrollTop : null; })();
  app.innerHTML = html;
  attachHandlers();
  if (prevAdminScrollTop !== null) {
    const adminEl = app.querySelector("[data-admin-scroll]");
    if (adminEl) adminEl.scrollTop = prevAdminScrollTop;
  }
  // Runs whenever .poker-table-wrap exists at all now, not just when it's the visible
  // face - with both panes always mounted while seated, the circles view's own DOM (and
  // its sizing) exists even while the player screen is the one on screen.
  if (nav.screen === "table") {
    // drawSettlementArrows() reads .poker-table-inner's actual current size/position, so
    // it must run AFTER layoutTableSize() resizes it this frame, not before (see the old
    // "arrows aren't precise" fix in git history 117ef81) - same rAF callback, in order.
    requestAnimationFrame(() => { layoutTableSize(); drawSettlementArrows(); });
  } else {
    drawSettlementArrows(); // no-op if #settlement-overlay doesn't exist on this screen
  }
  if (seated) {
    // Both the personal history and the whole-table feed open scrolled to the newest
    // (bottom) message, same as a real chat would - but ONLY force that scroll when a
    // genuinely new row actually arrived (or on the very first render after navigating
    // in), not on every render. render() re-runs every ~6s (periodic refresh) and on every
    // SSE push regardless of whether anything changed, so scrolling unconditionally here
    // snapped the user back to the bottom mid-read every few seconds - reported live as
    // "scrolling up gets interrupted, it keeps jumping to the end".
    const historyEl = app.querySelector("[data-player-history]");
    if (historyEl) {
      const latestHistoryKeySeen = historyEl.dataset.latestBuyin;
      if (latestHistoryKeySeen !== lastSeenHistoryKey) historyEl.scrollTop = historyEl.scrollHeight;
      else if (prevHistoryScrollTop !== null) historyEl.scrollTop = prevHistoryScrollTop;
      lastSeenHistoryKey = latestHistoryKeySeen;
    }
    const feedEl = app.querySelector("[data-player-feed]");
    if (feedEl) {
      // lastSeenFeedEventKey starting null means the very first render of a freshly-opened
      // game never force-scrolls for data that was already there, only for what actually
      // changes after that.
      const latestKey = feedEl.dataset.latestEvent;
      const isNewEvent = latestKey !== lastSeenFeedEventKey;
      if (isNewEvent) feedEl.scrollTop = feedEl.scrollHeight;
      else if (prevFeedScrollTop !== null) feedEl.scrollTop = prevFeedScrollTop;
      lastSeenFeedEventKey = latestKey;
    }
  }
}

// Pins the table (.poker-table-inner) to a fixed pixel size matching whatever room
// .poker-table-wrap's own flex layout actually gives it, so the aspect-ratio box can be
// cropped (via the CSS crop-from-* anchor rules) to exactly that space instead of
// overflowing it.
//
// Deliberately does NOT recompute "available height" by hand (summing header/padding/
// margin guesses) - that estimate drifted from the real number on an actual phone (safe
// areas, on-screen nav bars, font metrics all vary) and silently produced an oversized
// table that just got cropped unexpectedly. Instead it reads .poker-table-wrap's OWN
// height from the browser's flex layout, which already accounts for all of that
// correctly.
// Kept in sync with the matching CSS offsets on .poker-table-inner.crop-from-* above.
const TOP_CROP_BUFFER = 20, BOTTOM_CROP_BUFFER = 16;
// Using the SAME number for the CSS anchor offset (top:20px/bottom:16px) and this sizing
// buffer worked out algebraically to leave the box's OTHER (floating) edge landing exactly
// flush with the wrap's edge - zero slack there, even though a seat's avatar/caption
// overhangs past THAT edge too (see the CSS comment right above the anchor rules).
// Reported live: the topmost seat's avatar visibly clipped. This is added on top of the
// anchor offset specifically to give the floating edge real room instead of flush.
const OVERHANG_CLEARANCE = 16;
function layoutTableSize(){
  if (nav.screen !== "table") return;
  const wrap = document.querySelector(".poker-table-wrap");
  const inner = document.querySelector(".poker-table-inner");
  if (!wrap || !inner) return;
  const RATIO = 1.45; // height/width, matches the CSS aspect-ratio used outside the table screen
  // The active crop-from-* class offsets the inner box away from whichever edge is
  // flush (see the CSS) - that offset eats into the same wrap height being measured
  // here, so it has to come off the budget too, or the box ends up exactly buffer-px
  // taller than what actually fits and gets clipped anyway.
  const buffer = (inner.classList.contains("crop-from-bottom") ? TOP_CROP_BUFFER : BOTTOM_CROP_BUFFER) + OVERHANG_CLEARANCE;
  const availableW = wrap.getBoundingClientRect().width;
  const availableH = wrap.getBoundingClientRect().height - buffer;
  let w = availableW, h = w * RATIO;
  if (h > availableH && availableH > 0) { h = availableH; w = h / RATIO; }
  inner.style.width = w + "px";
  inner.style.height = h + "px";
  inner.style.left = "50%";
  inner.style.right = "auto";
  inner.style.transform = "translateX(-50%)";
}
window.addEventListener("resize", () => requestAnimationFrame(layoutTableSize));

// Sets --real-vh (see body.table-screen's own CSS comment on why) to the ACTUAL visible
// height, measured via the Visual Viewport API where available - a browser whose own
// on-screen toolbar isn't correctly subtracted from 100dvh (observed live on Samsung
// Internet - the table screen's bottom action buttons were clipped and unreachable) still
// reports the true visible height through window.visualViewport, since that API exists
// specifically to track the viewport the user can actually see past the browser's own UI.
// Falls back to innerHeight (then to the CSS dvh/vh chain, via the var()'s own fallback)
// on a browser with no Visual Viewport API at all.
function updateRealVh(){
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty("--real-vh", h + "px");
}
updateRealVh();
if (window.visualViewport) {
  // "resize" catches the toolbar showing/hiding; "scroll" catches it changing height
  // without a resize event firing on some browsers (observed inconsistently enough across
  // mobile browsers to be worth listening for both rather than picking just one).
  window.visualViewport.addEventListener("resize", () => requestAnimationFrame(updateRealVh));
  window.visualViewport.addEventListener("scroll", () => requestAnimationFrame(updateRealVh));
} else {
  window.addEventListener("resize", () => requestAnimationFrame(updateRealVh));
}

        : `<button class="icon-btn gold" data-invite-game="${g.id}" title="הזמן שחקן לשולחן">${icon('share')}</button>`)}
