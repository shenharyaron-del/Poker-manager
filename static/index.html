<html lang="he" dir="rtl">

html,body{margin:0;padding:0;background:var(--bg2);}
body{

#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:40px;}

<body>
<div id="app"></div>

<script>
// ---------- Real persistence: backed by the app's own server + database ----------
function uid(){ return Math.random().toString(36).slice(2,10); }

// A stable per-browser id so the server knows which "personal identity" bucket belongs
// to this device. Not a login - just lets each browser keep its own typed-in name.
function getClientId(){
  let id = localStorage.getItem("poker-tracker-client-id");
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : (uid()+uid()+uid()));
    localStorage.setItem("poker-tracker-client-id", id);
  }
  return id;
}

// ---------- AI vision helper (calls our server, which calls Claude with the real API key) ----------
const CHIP_COLOR_OPTIONS = ["white","red","blue","green","black","purple","yellow","orange","pink","gray"];
async function callClaudeVision(dataUrl, promptText){
  const response = await fetch("/api/vision", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ dataUrl, promptText })
  });
  if (!response.ok) throw new Error("vision request failed");
  return await response.json();
}

function defaultState(){
  return { communities: [], games: [] };
}

async function loadState(){
  try {
    const res = await fetch("/api/state");
    if (res.ok) return await res.json();
  } catch(e) { /* no data saved yet, or fetch failed - fall back to defaults */ }
  return defaultState();
}

let saveInFlight = null;
async function saveState(){
  // Serialize saves so overlapping calls don't race each other.
  const run = async () => {
    try {
      await fetch("/api/state", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(state)
      });
    }
    catch(e){ console.error("save failed", e); alert("שמירה נכשלה - בדוק את החיבור לאינטרנט ונסה שוב."); }
  };
  saveInFlight = (saveInFlight || Promise.resolve()).then(run);
  return saveInFlight;
}

// ---------- "Who am I" - private per-browser identity, used only to tag who created a community ----------
// Not a real login: it's a name each user types once, remembered for their own browser via
// a per-device id. It lets us show/allow "delete" only to the creator, but someone could
// still type someone else's name - it's a courtesy, not security.
async function loadIdentity(){
  try {
    const res = await fetch("/api/identity?clientId=" + encodeURIComponent(getClientId()));
    if (res.ok) {
      const data = await res.json();
      if (data) return data;
    }
  } catch(e) { /* not set yet */ }
  return { id: uid(), name: null };
}
async function saveIdentity(){
  try {
    await fetch("/api/identity?clientId=" + encodeURIComponent(getClientId()), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(myIdentity)
    });
  }
  catch(e){ console.error("identity save failed", e); }
}

let state = defaultState();
let myIdentity = { id: uid(), name: null };

// ---------- Navigation (not persisted - always starts at home) ----------
let nav = { screen: "home", communityId: null, gameId: null };
let modal = null; // {type, ...}

function go(screen, extra){ nav = Object.assign({screen}, extra||{}); modal = null; render(); }
function openModal(m){ modal = m; render(); }
function closeModal(){ modal = null; render(); }
function updateModal(partial){
  // Toggling a checkbox shouldn't jump the scroll back to the top - capture and
  // restore scroll positions of the modal and any inner scrollable list around the re-render.
  const modalEl = document.querySelector(".modal");
  const listEl = document.querySelector(".scroll-list");
  const modalScroll = modalEl ? modalEl.scrollTop : null;
  const listScroll = listEl ? listEl.scrollTop : null;
  modal = Object.assign({}, modal, partial);
  render();
  const modalEl2 = document.querySelector(".modal");
  const listEl2 = document.querySelector(".scroll-list");
  if (modalEl2 && modalScroll != null) modalEl2.scrollTop = modalScroll;
  if (listEl2 && listScroll != null) listEl2.scrollTop = listScroll;
}

// ---------- Data helpers ----------
function getCommunity(id){ return state.communities.find(c => c.id === id); }
function getGame(id){ return state.games.find(g => g.id === id); }
function maybeAutoCloseNight(g){
  if (g.players.length > 0 && g.players.every(p => p.id in g.cashouts)) g.closed = true;
}
function gamesForCommunity(id){ return state.games.filter(g => g.communityId === id).sort((a,b)=> a.date < b.date ? 1 : -1); }

const PROFIT_BUCKETS = [
  {min:-Infinity, max:-200, label:"-200",     loss:true},
  {min:-200,      max:-150, label:"-200/-150", loss:true},
  {min:-150,      max:-100, label:"-150/-100", loss:true},
  {min:-100,      max:-50,  label:"-100/-50",  loss:true},
  {min:-50,       max:0,    label:"-50/0",     loss:true},
  {min:0,         max:50,   label:"0-50",    loss:false},
  {min:50,        max:100,  label:"50-100",  loss:false},
  {min:100,       max:150,  label:"100-150", loss:false},
  {min:150,       max:200,  label:"150-200", loss:false},
  {min:200,       max:Infinity, label:"200+", loss:false},
];
function computeProfitBuckets(profits){
  return PROFIT_BUCKETS.map(b => ({
    label: b.label, loss: b.loss,
    count: profits.filter(p => p > b.min && p <= b.max).length
  }));
}
function renderBarChart(buckets){
  const max = Math.max(1, ...buckets.map(b=>b.count));
  const bars = buckets.map(b => `
    <div class="bar-col">
      <div class="bar-count">${b.count || ""}</div>
      <div class="bar-fill ${b.loss?'loss':'win'}" style="height:${b.count ? Math.max(6, Math.round(b.count/max*100)) : 2}px"></div>
      <div class="bar-label">${b.label}</div>
    </div>`).join("");
  return `<div class="bar-chart-title">התפלגות רווח/הפסד לפי ערב (הפסדים מימין, רווחים משמאל)</div><div class="bar-chart">${bars}</div>`;
}

function playerNetProfit(communityId, playerId){
  let net = 0, count = 0;
  gamesForCommunity(communityId).forEach(g => {
    const co = g.cashouts[playerId];
    if (!co) return;
    const buyins = g.buyins.filter(b=>b.playerId===playerId).reduce((s,b)=>s+b.amount,0);
    net += (co.amount - buyins);
    count++;
  });
  return { net, count };
}
function netBadge(stat){
  const { net, count } = stat;
  if (count === 0) return `<span class="balance-line balance-neutral" style="margin-top:0;">עדיין לא שיחק</span>`;
  const cls = net>0.5?"balance-pos":(net<-0.5?"balance-neg":"balance-neutral");
  const gamesText = count === 1 ? "ממשחק אחד" : `מ-${count} משחקים`;
  return `<span class="balance-line ${cls}" style="margin-top:0;">${net>=0?"+":""}₪${Math.round(net)} ${gamesText}</span>`;
}

// ---------- Settlement algorithm ----------
function computeBalances(game){
  const balances = {};
  game.players.forEach(p => {
    const buyins = game.buyins.filter(b => b.playerId === p.id).reduce((s,b)=>s+b.amount,0);
    const cashout = (game.cashouts[p.id] || {}).amount ?? 0;
    balances[p.id] = { buyins, cashedOut: p.id in game.cashouts, profit: cashout - buyins };
  });
  return balances;
}
function settleTransactions(balances, players){
  const creditors = [], debtors = [];
  Object.entries(balances).forEach(([id,b])=>{
    if (b.profit > 0.005) creditors.push({id, amt:b.profit});
    else if (b.profit < -0.005) debtors.push({id, amt:-b.profit});
  });
  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);
  const nameOf = id => (players.find(p=>p.id===id)||{}).name || "?";
  const txns = [];
  let ci=0, di=0;
  while(ci<creditors.length && di<debtors.length){
    const c=creditors[ci], d=debtors[di];
    const amt = Math.min(c.amt, d.amt);
    if (amt > 0.005) txns.push({from:d.id, fromName:nameOf(d.id), to:c.id, toName:nameOf(c.id), amount:Math.round(amt*100)/100});
    c.amt -= amt; d.amt -= amt;
    if (c.amt <= 0.005) ci++;
    if (d.amt <= 0.005) di++;
  }
  return txns;
}

// A player who left mid-game and arranged payment directly with active counterpart(s)
// already moved real cash with those specific people. That must count toward the
// final settlement - otherwise the app would ask for transfers that ignore money
// that already changed hands, or ask people to pay twice.
function computeArrangementAdjustments(game){
  const raw = computeBalances(game);
  const adjusted = {};
  Object.keys(raw).forEach(id => { adjusted[id] = raw[id].profit; });
  const excluded = new Set();
  const entries = Object.entries(game.cashouts).sort((a,b) => (a[1].ts||0) - (b[1].ts||0));
  entries.forEach(([playerId, co]) => {
    if (co.arrangedWith && co.arrangedWith.length > 0) {
      const share = adjusted[playerId] / co.arrangedWith.length;
      co.arrangedWith.forEach(cid => { if (adjusted[cid] !== undefined) adjusted[cid] += share; });
      excluded.add(playerId);
    }
  });
  return { adjusted, excluded };
}

function computeFinalBalances(game){
  const { adjusted, excluded } = computeArrangementAdjustments(game);
  const finalBalances = {};
  Object.keys(adjusted).forEach(id => { if (!excluded.has(id)) finalBalances[id] = {profit: adjusted[id]}; });
  return finalBalances;
}

// ---------- Icons (tiny inline SVGs) ----------
const ICONS = {
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

function icon(name){ return ICONS[name] || ""; }

// ---------- Rendering ----------
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toHexColor(c){
  if (!c) return "#888888";
  if (c[0] === "#") return c;
  const m = c.match(/\d+/g);
  if (!m || m.length < 3) return "#888888";
  return "#" + m.slice(0,3).map(n => Math.max(0,Math.min(255,parseInt(n))).toString(16).padStart(2,"0")).join("");
}
function hexDistance(hexA, hexB){
  const toRgb = (h) => { const c = toHexColor(h).slice(1); return [0,2,4].map(i=>parseInt(c.slice(i,i+2),16)); };
  const [r1,g1,b1] = toRgb(hexA), [r2,g2,b2] = toRgb(hexB);
  return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
}
function nearestChipValue(hex, chipValues){
  if (!chipValues || !chipValues.length) return null;
  let best = null, bestDist = Infinity;
  chipValues.forEach(cv => {
    const dist = hexDistance(hex, cv.color);
    if (dist < bestDist) { bestDist = dist; best = cv; }
  });
  return bestDist < 70 ? best : null;
}
function fmtTime(ts){ if(!ts) return ""; const d = new Date(ts); return d.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'}); }

function render(){

}

function renderTable(gameId){
  const SEAT_POS = [
    [50,8],[78,18],[93,43],[88,71],[65,90],[35,90],[12,71],[7,43],[22,18],[2,90]
  ];
  const g = getGame(gameId);
  if (!g) return `<div class="empty">משחק לא נמצא</div>`;
  const c = getCommunity(g.communityId) || {name:"קבוצה", roster:[]};
  const seats = g.seats || new Array(9).fill(null);
  const buyinTotals = {};
  g.buyins.forEach(b => { buyinTotals[b.playerId] = (buyinTotals[b.playerId]||0) + b.amount; });
  const liveChips = g.liveChips || {};

  const seatsHtml = seats.map((pid, i) => {
    const [x,y] = SEAT_POS[i];
    if (!pid) {
      if (i === 9) return ""; // the 10th slot's empty state is handled by the dedicated "add extra player" button instead
      return `<div class="seat-wrap" style="left:${x}%;top:${y}%;" data-seat="${i}"><div class="seat-circle empty">+</div></div>`;
    }
    const p = g.players.find(pl => pl.id === pid);
    const name = p ? p.name : "?";
    const cashedOut = pid in g.cashouts;
    const buyin = buyinTotals[pid] || 0;
    const chips = liveChips[pid] || 0;
    let caption = `קנייה ₪${buyin}<br>ציפים ₪${chips}`;
    if (cashedOut) {
      const profit = chips - buyin;
      const sign = profit > 0 ? "+" : "";
      const profitColor = profit > 0.5 ? "#6ee7b7" : (profit < -0.5 ? "#fda4af" : "inherit");
      caption = `<span style="color:${profitColor};font-weight:700;">${sign}₪${Math.round(profit)}</span>`;
    }
    return `<div class="seat-wrap" style="left:${x}%;top:${y}%;" data-seat="${i}">
      <div class="seat-circle filled ${cashedOut?'cashed-out':''}">${esc((name||"?").slice(0,2))}</div>
      <div class="seat-name">${esc(name)}</div>
      <div class="seat-caption">${caption}</div>
    </div>`;
  }).join("");

  const totalBuyinAll = Object.values(buyinTotals).reduce((s,v)=>s+v,0);
  const totalChipsAll = Object.values(liveChips).reduce((s,v)=>s+v,0);
  const diff = totalChipsAll - totalBuyinAll;
  const diffLabel = diff > 0.5 ? "קופה בחוסר" : (diff < -0.5 ? "קופה בעודף" : "קופה מאוזנת");
  const diffColor = diff > 0.5 ? "#fda4af" : (diff < -0.5 ? "#6ee7b7" : "var(--muted)");

  return `
    <div class="top row" style="padding-bottom:10px;">
      <button class="back-arrow" data-back-community="${g.communityId}">${icon('back')}</button>
      <div class="flex1">
        <h1 class="serif sm" style="color:var(--gold);">${esc(c.name)}</h1>
        <div class="meta" style="color:#6ee7b7;font-size:12px;display:flex;align-items:center;gap:5px;">${icon('cal')}${esc(g.date)}</div>
      </div>
    </div>
    <div class="poker-table-wrap">
      <div class="poker-table-felt"></div>
      ${seatsHtml}
      <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:3;">
        <div style="color:var(--muted);font-size:12px;">סה"כ קנייה ₪${totalBuyinAll}</div>
        <div style="color:var(--muted);font-size:12px;">סה"כ ציפים ₪${totalChipsAll}</div>
        <div style="color:${diffColor};font-weight:700;font-size:13px;margin-top:4px;">${diffLabel}${Math.abs(diff)>=0.5?` ₪${Math.abs(Math.round(diff))}`:""}</div>
      </div>
      ${(seats.slice(0,9).filter(Boolean).length >= 9 && seats[9] == null) ? `
        <div style="position:absolute;left:2%;top:${SEAT_POS[5][1]}%;transform:translateY(-50%);">
          <button class="icon-btn gold" data-add-extra-player title="הוסף שחקן נוסף" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;justify-content:center;">${icon('plus')}</button>
        </div>
      ` : ""}
    </div>
  `;
}

    const paybox = (g.payboxPayments||[]).filter(b=>b.playerId===m.playerId);
    if (paybox.length) {
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">העברות לקבוצת פייבוקס</div>`;
      rows += paybox.map((b,i) => `<div class="roster-row"><span>העברה ${i+1}${b.ts?` · ${fmtTime(b.ts)}`:""}</span><span style="display:flex;align-items:center;gap:10px;">₪${b.amount}<button class="icon-btn" style="color:#fda4af;" data-delete-paybox="${b.id}" title="ביטול העברה">${icon('trash')}</button></span></div>`).join("");
    }
    const myOut = g.cashouts[m.playerId];
    if (myOut) {
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">יציאה מהמשחק</div>`;
      rows += `<div class="roster-row"><span>יצא עם${myOut.ts?` (בשעה ${fmtTime(myOut.ts)})`:""}</span><span style="font-weight:700;">₪${myOut.amount}</span></div>`;
      if (myOut.arrangedWith && myOut.arrangedWith.length) {
        const myProfit = computeArrangementAdjustments(g).adjusted[m.playerId];
        const share = Math.round((myProfit / myOut.arrangedWith.length) * 100) / 100;
        rows += myOut.arrangedWith.map(id => {
          const name = (g.players.find(pl=>pl.id===id)||{}).name || "?";
          return `<div class="roster-row"><span>${share>=0 ? "קיבל מ-" : "העביר ל-"}${esc(name)}</span><span style="font-weight:700;">₪${Math.abs(share)}</span></div>`;
        }).join("");
      }
    }
    // incoming arrangements: other players who left and named this player as their counterpart
    const adj = computeArrangementAdjustments(g).adjusted;
    const incoming = [];
    Object.entries(g.cashouts).forEach(([otherId, co]) => {
      if (otherId === m.playerId) return;
      if (!co.arrangedWith || !co.arrangedWith.includes(m.playerId)) return;
      const otherName = (g.players.find(pl=>pl.id===otherId)||{}).name || "?";
      const otherProfit = adj[otherId];
      const share = Math.round((Math.abs(otherProfit) / co.arrangedWith.length) * 100) / 100;
      incoming.push({ otherName, received: otherProfit < 0, share }); // if the other player owed money, this player received from them
    });
    if (incoming.length) {
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">סידורים עם שחקנים שיצאו</div>`;
      rows += incoming.map(x => `<div class="roster-row"><span>${x.received ? "קיבל מ-" : "העביר ל-"}${esc(x.otherName)}</span><span style="font-weight:700;">₪${x.share}</span></div>`).join("");
    }
    if (g.closed) {
      const finalBalances = computeFinalBalances(g);
      const alreadyPaid = (g.payboxPayments||[]).filter(pp=>pp.playerId===m.playerId).reduce((s,pp)=>s+pp.amount,0);
      const fb = finalBalances[m.playerId];
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">חלק בסיכום הסופי</div>`;
      if (!fb) {
        rows += `<div class="roster-row"><span>לא נכלל בסיכום הסופי (סודר ישירות עם שחקן אחר)</span></div>`;
      } else {
        const remaining = fb.profit + alreadyPaid;
        if (Math.abs(remaining) < 0.005) {
          rows += `<div class="roster-row"><span>מאוזן — אין תשלום נדרש לקבוצת פייבוקס</span></div>`;
        } else {
          rows += `<div class="roster-row"><span>${remaining>0?"מקבל מקבוצת פייבוקס":"מעביר לקבוצת פייבוקס"}</span><span style="font-weight:700;color:${remaining>0?'#6ee7b7':'#fda4af'};">₪${Math.round(Math.abs(remaining)*100)/100}</span></div>`;
        }
      }
    }
    body = rows;
  }

  return `
    <div class="overlay" data-close-overlay>
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head"><h3 class="serif">${title}</h3><button class="close-x" data-close-modal>${icon('x')}</button></div>
        ${body}
      </div>
    </div>
  `;
}

// ---------- Event handling (delegated) ----------
function attachHandlers(){
  const app = document.getElementById("app");

  app.querySelectorAll("[data-open-community]").forEach(el => el.onclick = () => go("community", {communityId: el.dataset.openCommunity}));
  app.querySelectorAll("[data-delete-community]").forEach(el => el.onclick = (e) => { e.stopPropagation(); openModal({type:"deleteCommunity", communityId: el.dataset.deleteCommunity}); });
  app.querySelectorAll("[data-open-chip-setup]").forEach(el => el.onclick = (e) => {
    e.stopPropagation();
    const c = getCommunity(el.dataset.openChipSetup);
    const existing = (c.chipValues||[]).map(cv => ({id: uid(), name: cv.name, color: cv.color, value: String(cv.value)}));
    openModal({type:"chipSetup", communityId: el.dataset.openChipSetup, imageSrc: null, points: existing});
  });
  const newCommunityBtn = app.querySelector("[data-new-community]");
  if (newCommunityBtn) newCommunityBtn.onclick = () => openModal({type:"newCommunity"});
  app.querySelectorAll("[data-open-game]").forEach(el => el.onclick = () => go("table", {gameId: el.dataset.openGame, communityId: getGame(el.dataset.openGame).communityId}));
  app.querySelectorAll("[data-delete-game]").forEach(el => el.onclick = (e) => { e.stopPropagation(); openModal({type:"deleteGame", gameId: el.dataset.deleteGame}); });
  const backHome = app.querySelector("[data-back-home]"); if (backHome) backHome.onclick = () => go("home");
  const backCommunity = app.querySelector("[data-back-community]"); if (backCommunity) backCommunity.onclick = () => go("community", {communityId: backCommunity.dataset.backCommunity});

  const showRoster = app.querySelector("[data-show-roster]");
  if (showRoster) showRoster.onclick = () => openModal({type:"roster", communityId: nav.communityId, editingId:null});

  const newGameBtn = app.querySelector("[data-new-game]");
  if (newGameBtn) newGameBtn.onclick = () => {
    openModal({type:"newGame", communityId: nav.communityId, date: new Date().toISOString().slice(0,10)});
  };

  app.querySelectorAll("[data-buyin]").forEach(el => el.onclick = () => openModal({type:"buyin", gameId: nav.gameId, playerId: el.dataset.buyin, amount:""}));
  app.querySelectorAll("[data-leave]").forEach(el => el.onclick = () => openModal({type:"leave", gameId: nav.gameId, playerId: el.dataset.leave, amount:""}));
  app.querySelectorAll("[data-history]").forEach(el => el.onclick = () => openModal({type:"history", gameId: nav.gameId, playerId: el.dataset.history}));
  app.querySelectorAll("[data-edit-cashout]").forEach(el => el.onclick = () => openModal({type:"editCashout", gameId: nav.gameId, playerId: el.dataset.editCashout}));
  app.querySelectorAll("[data-return-to-game]").forEach(el => el.onclick = () => {
    const g = getGame(nav.gameId);
    delete g.cashouts[el.dataset.returnToGame];
    if (g.closed) g.closed = false; // a night with an active player again can't stay "closed"
    saveState();
    closeModal();
  });
  app.querySelectorAll("[data-remove-from-game]").forEach(el => el.onclick = () => openModal({type:"removeFromGame", gameId: nav.gameId, playerId: el.dataset.removeFromGame}));

  const endNightBtn = app.querySelector("[data-end-night]");
  if (endNightBtn) endNightBtn.onclick = () => openModal({type:"endNight", gameId: nav.gameId, amounts:{}});
  const viewSummaryBtn = app.querySelector("[data-view-summary]");
  if (viewSummaryBtn) viewSummaryBtn.onclick = () => openModal({type:"summary", gameId: nav.gameId});
  const addExistingBtn = app.querySelector("[data-add-existing]");
  if (addExistingBtn) addExistingBtn.onclick = () => openModal({type:"addExisting", gameId: nav.gameId});
  const bulkBuyinBtn = app.querySelector("[data-bulk-buyin]");
  if (bulkBuyinBtn) bulkBuyinBtn.onclick = () => {
    const g = getGame(nav.gameId);
    const active = g.players.filter(p => !(p.id in g.cashouts));
    const selected = {};
    active.forEach(p => { selected[p.id] = true; });
    openModal({type:"bulkBuyin", gameId: nav.gameId, amount:"", selected});
  };
  const payboxBtn = app.querySelector("[data-paybox-transfer]");
  if (payboxBtn) payboxBtn.onclick = () => {
    const g = getGame(nav.gameId);
    const active = g.players.filter(p => !(p.id in g.cashouts));
    openModal({type:"paybox", gameId: nav.gameId, playerId: (active[0]||g.players[0]||{}).id, amount:""});
  };

  const addExtraBtn = app.querySelector("[data-add-extra-player]");
  if (addExtraBtn) addExtraBtn.onclick = () => openModal({type:"addExisting", gameId: nav.gameId});

  app.querySelectorAll("[data-seat]").forEach(el => {
    let drag = null;
    el.addEventListener("pointerdown", (e) => {
      const g = getGame(nav.gameId);
      const seats = g.seats || new Array(9).fill(null);
      const idx = parseInt(el.dataset.seat);
      if (!seats[idx]) return; // only occupied seats can be dragged
      drag = { fromIdx: idx, startX: e.clientX, startY: e.clientY, moved: false };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) drag.moved = true;
      if (drag.moved) {
        el.style.transform = `translate(-50%,-50%) translate(${dx}px, ${dy}px)`;
        el.style.zIndex = "50";
        el.style.opacity = "0.85";
      }
    });
    el.addEventListener("pointerup", (e) => {
      if (!drag) return;
      const wasMoved = drag.moved;
      const fromIdx = drag.fromIdx;
      el.style.transform = "";
      el.style.zIndex = "";
      el.style.opacity = "";
      drag = null;
      if (wasMoved) {
        el.style.pointerEvents = "none";
        const under = document.elementFromPoint(e.clientX, e.clientY);
        el.style.pointerEvents = "";
        const targetEl = under ? under.closest("[data-seat]") : null;
        if (targetEl) {
          const toIdx = parseInt(targetEl.dataset.seat);
          if (toIdx !== fromIdx) {
            const g = getGame(nav.gameId);
            if (!g.seats) g.seats = new Array(9).fill(null);
            const tmp = g.seats[toIdx];
            g.seats[toIdx] = g.seats[fromIdx];
            g.seats[fromIdx] = tmp;
            saveState();
            render();
          }
        }
        return;
      }
      const g = getGame(nav.gameId);
      const seats = g.seats || new Array(9).fill(null);
      const pid = seats[fromIdx];
      if (pid) openModal({type:"seatDetail", gameId: nav.gameId, playerId: pid, seatIndex: fromIdx});
    });
    el.addEventListener("pointercancel", () => {
      el.style.transform = "";
      el.style.zIndex = "";
      el.style.opacity = "";
      drag = null;
    });
    el.onclick = () => {
      const g = getGame(nav.gameId);
      const idx = parseInt(el.dataset.seat);
      const seats = g.seats || new Array(9).fill(null);
      if (!seats[idx]) openModal({type:"pickSeat", gameId: nav.gameId, seatIndex: idx});
    };
  });

  // modal-level handlers
  const overlay = app.querySelector("[data-close-overlay]");
  if (overlay) overlay.onclick = () => closeModal();
  const closeBtn = app.querySelector("[data-close-modal]");
  if (closeBtn) closeBtn.onclick = () => closeModal();

  if (modal && modal.type === "roster") {
    app.querySelectorAll("[data-view-stats]").forEach(el => el.onclick = () => openModal({type:"stats", communityId: modal.communityId, playerId: el.dataset.viewStats}));
    app.querySelectorAll("[data-edit-player]").forEach(el => el.onclick = () => updateModal({editingId: el.dataset.editPlayer}));
    app.querySelectorAll("[data-remove-player]").forEach(el => el.onclick = () => {
      const c = getCommunity(modal.communityId);
      c.roster = c.roster.filter(p => p.id !== el.dataset.removePlayer);
      saveState();
      updateModal({});
    });
    const cancelEdit = app.querySelector("[data-cancel-edit]");
    if (cancelEdit) cancelEdit.onclick = () => updateModal({editingId:null});
    const saveEdit = app.querySelector("[data-save-edit]");
    if (saveEdit) saveEdit.onclick = () => {
      const input = document.getElementById("edit-name-input");
      const name = input.value.trim();
      if (name) {
        const c = getCommunity(modal.communityId);
        const p = c.roster.find(pl=>pl.id===saveEdit.dataset.saveEdit);
        p.name = name; saveState();
      }
      updateModal({editingId:null});
    };
    const addRosterBtn = app.querySelector("[data-add-roster]");
    if (addRosterBtn) addRosterBtn.onclick = () => {
      const input = document.getElementById("new-roster-name");
      const name = input.value.trim();
      if (name) {
        const c = getCommunity(modal.communityId);
        c.roster.push({id:uid(), name});
        saveState();
      }
      updateModal({});
    };
  }

  if (modal && modal.type === "newGame") {
    const dateInput = document.getElementById("new-game-date");
    if (dateInput) dateInput.onchange = (e) => { modal.date = e.target.value; };
    const createBtn = app.querySelector("[data-create-game]");
    if (createBtn) createBtn.onclick = () => {
      const c = getCommunity(modal.communityId);
      const dateVal = document.getElementById("new-game-date").value || modal.date;
      const g = {id:uid(), communityId:c.id, date:dateVal, players: [], buyins:[], cashouts:{}, payboxPayments:[], seats:new Array(9).fill(null), liveChips:{}, closed:false};
      state.games.push(g);
      saveState();
      go("table", {gameId:g.id, communityId:c.id});
    };
  }

  if (modal && modal.type === "editCashout") {
    const confirmEdit = app.querySelector("[data-confirm-edit-cashout]");
    if (confirmEdit) confirmEdit.onclick = () => {
      const amt = parseFloat(document.getElementById("edit-cashout-amount").value);
      if (isNaN(amt) || amt < 0) return;
      const g = getGame(modal.gameId);
      g.cashouts[modal.playerId].amount = amt;
      saveState();
      closeModal();
    };
  }

  if (modal && modal.type === "removeFromGame") {
    const confirmRemove = app.querySelector("[data-confirm-remove-from-game]");
    if (confirmRemove) confirmRemove.onclick = () => {
      const g = getGame(modal.gameId);
      g.players = g.players.filter(p => p.id !== modal.playerId);
      g.buyins = g.buyins.filter(b => b.playerId !== modal.playerId);
      if (g.payboxPayments) g.payboxPayments = g.payboxPayments.filter(b => b.playerId !== modal.playerId);
      delete g.cashouts[modal.playerId];
      if (g.seats) { const si = g.seats.indexOf(modal.playerId); if (si !== -1) g.seats[si] = null; }
      if (g.liveChips) delete g.liveChips[modal.playerId];
      // clean up any other player's arrangement that pointed at this player
      Object.values(g.cashouts).forEach(co => {
        if (co.arrangedWith) co.arrangedWith = co.arrangedWith.filter(id => id !== modal.playerId);
      });
      if (g.closed && g.players.some(p => !(p.id in g.cashouts))) g.closed = false;
      maybeAutoCloseNight(g);
      saveState();
      closeModal();
    };
  }

  if (modal && modal.type === "chipPhotoCount") {
    const readStackValue = (s) => {
      const selectInp = document.querySelector(`[data-stack-value-select="${s.id}"]`);
      const manualInp = document.querySelector(`[data-stack-value="${s.id}"]`);
      if (selectInp && selectInp.value !== "custom") return parseFloat(selectInp.value);
      return manualInp ? parseFloat(manualInp.value) : NaN;
    };
    const recalcChipTotals = () => {
      let grand = 0;
      modal.stacks.forEach(s => {
        const countInp = document.querySelector(`[data-stack-count="${s.id}"]`);
        const cnt = countInp ? parseFloat(countInp.value) : NaN;
        const val = readStackValue(s);
        const subtotal = (!isNaN(cnt) && !isNaN(val)) ? cnt*val : 0;
        const subtotalEl = document.querySelector(`[data-stack-subtotal="${s.id}"]`);
        if (subtotalEl) subtotalEl.textContent = "₪" + (Math.round(subtotal*100)/100);
        grand += subtotal;
      });
      const grandEl = app.querySelector("[data-stack-grand-total]");
      if (grandEl) grandEl.textContent = "₪" + (Math.round(grand*100)/100);
    };
    const handleChipCountFile = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        updateModal({imageSrc: reader.result, stacks: [], analyzing: false, analyzeError: null});
      };
      reader.readAsDataURL(file);
    };
    const cameraInput = app.querySelector("#chip-count-camera-input");
    if (cameraInput) cameraInput.onchange = handleChipCountFile;
    const uploadInput = app.querySelector("#chip-count-upload-input");
    if (uploadInput) uploadInput.onchange = handleChipCountFile;
    const analyzeStacksBtn = app.querySelector("[data-analyze-chip-stacks]");
    if (analyzeStacksBtn) analyzeStacksBtn.onclick = async () => {
      updateModal({analyzing: true, analyzeError: null});
      try {
        const c0 = getCommunity(modal.communityId);
        const known = (c0.chipValues||[]).map(cv=>cv.name).filter(Boolean);
        const allowed = known.length ? known : CHIP_COLOR_OPTIONS;
        const prompt = `זו תמונה של מגדלי ציפי פוקר של שחקן אחד, עומדים זקוף. לכל מגדל נראה לעין בתמונה: זהו את הצבע (רק מתוך הרשימה: ${allowed.join(", ")}; אם אף אחד לא מתאים - "unknown") ותנו גם צבע hex משוער, וספרו כמה ציפים יש במגדל לפי הפסים/החלוקות הנראות. החזירו תשובה בפורמט JSON בלבד, בלי טקסט נוסף ובלי markdown, במבנה הזה בדיוק: [{"color":"<name or unknown>","hex":"#rrggbb","count":<integer>}]`;
        const result = await callClaudeVision(modal.imageSrc, prompt);
        const c = getCommunity(modal.communityId);
        const stacks = (result||[]).filter(r => r && r.count).map(r => {
          const hex = (r.hex && /^#[0-9a-fA-F]{6}$/.test(r.hex)) ? r.hex : "#888888";
          let match = (c.chipValues||[]).find(cv => cv.name && cv.name === r.color);
          if (!match) match = nearestChipValue(hex, c.chipValues);
          return {id: uid(), name: r.color, color: match ? toHexColor(match.color) : hex, count: r.count, matchedValue: match ? match.value : null};
        });
        if (!stacks.length) throw new Error("no stacks found");
        updateModal({stacks, analyzing: false});
      } catch(e) {
        console.error(e);
        updateModal({analyzing: false, analyzeError: "הניתוח נכשל - נסו שוב, או הוסיפו מגדל ידנית."});
      }
    };
    app.querySelectorAll("[data-duplicate-stack]").forEach(el => el.onclick = () => {
      const src = modal.stacks.find(s => s.id === el.dataset.duplicateStack);
      if (!src) return;
      const copy = {id: uid(), name: src.name, color: src.color, count: 1, matchedValue: src.matchedValue};
      const idx = modal.stacks.findIndex(s => s.id === src.id);
      const stacks = modal.stacks.slice();
      stacks.splice(idx+1, 0, copy);
      updateModal({stacks});
    });
    app.querySelectorAll("[data-remove-stack]").forEach(el => el.onclick = () => {
      updateModal({stacks: modal.stacks.filter(s => s.id !== el.dataset.removeStack)});
    });
    app.querySelectorAll("[data-stack-value-select]").forEach(el => el.onchange = () => {
      const manualInp = document.querySelector(`[data-stack-value="${el.dataset.stackValueSelect}"]`);
      if (manualInp) manualInp.style.display = el.value === "custom" ? "" : "none";
      recalcChipTotals();
    });
    app.querySelectorAll("[data-stack-count],[data-stack-value]").forEach(el => el.oninput = recalcChipTotals);
    if (modal.stacks.length) recalcChipTotals();
    const retakeChipPhotoBtn = app.querySelector("[data-retake-chip-photo]");
    if (retakeChipPhotoBtn) retakeChipPhotoBtn.onclick = () => updateModal({imageSrc: null, analyzing:false, analyzeError:null, stacks: []});
    const confirmChipCount = app.querySelector("[data-confirm-chip-count]");
    if (confirmChipCount) confirmChipCount.onclick = () => {
      let total = 0;
      modal.stacks.forEach(s => {
        const countInp = document.querySelector(`[data-stack-count="${s.id}"]`);
        const cnt = countInp ? parseFloat(countInp.value) : NaN;
        const val = readStackValue(s);
        if (!isNaN(cnt) && !isNaN(val)) total += cnt * val;
      });
      const g = getGame(modal.gameId);
      if (!g.liveChips) g.liveChips = {};
      g.liveChips[modal.playerId] = Math.round(total * 100) / 100;
      saveState();
      openModal({type:"seatDetail", gameId: modal.gameId, playerId: modal.playerId});
    };
  }

  if (modal && modal.type === "chipSetup") {
    const handleChipSetupFile = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { updateModal({imageSrc: reader.result, points: modal.points, analyzeError: null}); };
      reader.readAsDataURL(file);
    };
    const cameraInput = app.querySelector("#chip-camera-input");
    if (cameraInput) cameraInput.onchange = handleChipSetupFile;
    const uploadInput = app.querySelector("#chip-upload-input");
    if (uploadInput) uploadInput.onchange = handleChipSetupFile;
    const analyzeBtn = app.querySelector("[data-analyze-chip-colors]");
    if (analyzeBtn) analyzeBtn.onclick = async () => {
      updateModal({analyzing: true, analyzeError: null});
      try {
        const prompt = `זו תמונה של ציפי פוקר, ציפ אחד מכל צבע. זהה כל צבע ציפ מובחן בתמונה. השתמשו רק בשמות האלה (באנגלית, בדיוק כמו שכתובים): ${CHIP_COLOR_OPTIONS.join(", ")}. החזירו תשובה בפורמט JSON בלבד, בלי טקסט נוסף ובלי markdown, במבנה הזה בדיוק: [{"color":"<one of the allowed names>","hex":"#rrggbb"}]. כל צבע רק פעם אחת.`;
        const result = await callClaudeVision(modal.imageSrc, prompt);
        const points = (result||[]).filter(r => r && r.color).map(r => ({id: uid(), name: r.color, color: r.hex || "#888888", value: ""}));
        if (!points.length) throw new Error("no colors found");
        updateModal({points, analyzing: false});
      } catch(e) {
        console.error(e);
        updateModal({analyzing: false, analyzeError: "הניתוח נכשל - נסו שוב, או הוסיפו צבע ידנית."});
      }
    };
    app.querySelectorAll("[data-point-color]").forEach(el => el.oninput = () => {
      // Direct DOM update only - avoid re-render so other rows' unsaved edits aren't lost mid-typing.
    });
    app.querySelectorAll("[data-remove-chip-point]").forEach(el => el.onclick = () => {
      updateModal({points: modal.points.filter(pt => pt.id !== el.dataset.removeChipPoint)});
    });
    const addManualBtn = app.querySelector("[data-add-chip-manual]");
    if (addManualBtn) addManualBtn.onclick = () => {
      updateModal({points: modal.points.concat([{id: uid(), name: null, color: "#888888", value: ""}])});
    };
    const retakeBtn = app.querySelector("[data-retake-photo]");
    if (retakeBtn) retakeBtn.onclick = () => updateModal({imageSrc: null, analyzing:false, analyzeError:null});
    const saveBtn = app.querySelector("[data-save-chip-values]");
    if (saveBtn) saveBtn.onclick = () => {
      const c = getCommunity(modal.communityId);
      const values = [];
      modal.points.forEach(pt => {
        const valInp = document.querySelector(`[data-chip-value-input="${pt.id}"]`);
        const colorInp = document.querySelector(`[data-point-color="${pt.id}"]`);
        const v = valInp ? parseFloat(valInp.value) : NaN;
        const colorHex = colorInp ? colorInp.value : pt.color;
        if (!isNaN(v) && v >= 0) values.push({name: pt.name, color: colorHex, value: v});
      });
      if (!values.length) { alert("צריך להזין ערך לפחות לצבע אחד."); return; }
      c.chipValues = values;
      saveState();
      closeModal();
    };
  }

  if (modal && modal.type === "newCommunity") {
    const confirmBtn = app.querySelector("[data-confirm-new-community]");
    if (confirmBtn) confirmBtn.onclick = async () => {
      const name = document.getElementById("new-community-name").value.trim();
      const creatorName = document.getElementById("new-community-creator").value.trim();
      if (!name) { alert("צריך להזין שם לקבוצה."); return; }
      if (!creatorName) { alert("צריך להזין את השם שלך."); return; }
      myIdentity.name = creatorName;
      saveIdentity();
      state.communities.push({ id: uid(), name, roster: [], createdBy: myIdentity.id, createdByName: creatorName });
      saveState();
      closeModal();
    };
  }

  if (modal && modal.type === "deleteCommunity") {
    const confirmBtn = app.querySelector("[data-confirm-delete-community]");
    if (confirmBtn) confirmBtn.onclick = () => {
      state.games = state.games.filter(g => g.communityId !== modal.communityId);
      state.communities = state.communities.filter(c => c.id !== modal.communityId);
      saveState();
      go("home");
    };
  }

  if (modal && modal.type === "deleteGame") {
    const confirmDel = app.querySelector("[data-confirm-delete-game]");
    if (confirmDel) confirmDel.onclick = () => {
      const g = getGame(modal.gameId);
      const communityId = g.communityId;
      state.games = state.games.filter(gm => gm.id !== modal.gameId);
      saveState();
      go("community", {communityId});
    };
  }

  if (modal && modal.type === "history") {
    app.querySelectorAll("[data-delete-buyin]").forEach(el => el.onclick = () => {
      openModal({type:"deleteBuyin", gameId: modal.gameId, playerId: modal.playerId, buyinId: el.dataset.deleteBuyin, returnTo: modal});
    });
    app.querySelectorAll("[data-delete-paybox]").forEach(el => el.onclick = () => {
      openModal({type:"deletePaybox", gameId: modal.gameId, playerId: modal.playerId, paymentId: el.dataset.deletePaybox, returnTo: modal});
    });
  }

  if (modal && modal.type === "deleteBuyin") {
    const confirmDelBuyin = app.querySelector("[data-confirm-delete-buyin]");
    if (confirmDelBuyin) confirmDelBuyin.onclick = () => {
      const g = getGame(modal.gameId);
      g.buyins = g.buyins.filter(b => b.id !== modal.buyinId);
      saveState();
      openModal(modal.returnTo);
    };
  }

  if (modal && modal.type === "deletePaybox") {
    const confirmDelPaybox = app.querySelector("[data-confirm-delete-paybox]");
    if (confirmDelPaybox) confirmDelPaybox.onclick = () => {
      const g = getGame(modal.gameId);
      g.payboxPayments = (g.payboxPayments||[]).filter(b => b.id !== modal.paymentId);
      saveState();
      openModal(modal.returnTo);
    };
  }

  if (modal && modal.type === "addExisting") {
    app.querySelectorAll("[data-add-to-game]").forEach(el => el.onclick = () => {
      const g = getGame(modal.gameId);
      const c = getCommunity(g.communityId);
      const p = c.roster.find(pl=>pl.id===el.dataset.addToGame);
      if (p && !g.players.some(gp=>gp.id===p.id)) {
        g.players.push({id:p.id, name:p.name});
        if (!g.seats) g.seats = new Array(9).fill(null);
        while (g.seats.length < 10) g.seats.push(null);
        if (g.seats[9] == null) g.seats[9] = p.id;
      }
      saveState();
      closeModal();
    });
  }

  if (modal && modal.type === "buyin") {
    app.querySelectorAll("[data-chip]").forEach(el => el.onclick = () => { document.getElementById("buyin-amount").value = el.dataset.chip; });
    const confirmBtn = app.querySelector("[data-confirm-buyin]");
    if (confirmBtn) confirmBtn.onclick = () => {
      const amt = parseFloat(document.getElementById("buyin-amount").value);
      if (!amt || amt <= 0) return;
      const g = getGame(modal.gameId);
      g.buyins.push({id:uid(), playerId: modal.playerId, amount: amt, ts: Date.now()});
      saveState();
      closeModal();
    };
  }

  if (modal && modal.type === "paybox") {
    app.querySelectorAll("[data-paybox-chip]").forEach(el => el.onclick = () => { document.getElementById("paybox-amount").value = el.dataset.payboxChip; });
    const confirmPaybox = app.querySelector("[data-confirm-paybox]");
    if (confirmPaybox) confirmPaybox.onclick = () => {
      const amt = parseFloat(document.getElementById("paybox-amount").value);
      const playerId = document.getElementById("paybox-player").value;
      if (!amt || amt <= 0 || !playerId) return;
      const g = getGame(modal.gameId);
      if (!g.payboxPayments) g.payboxPayments = [];
      g.payboxPayments.push({id:uid(), playerId, amount: amt, ts: Date.now()});
      saveState();
      closeModal();
    };
  }

  if (modal && modal.type === "pickSeat") {
    app.querySelectorAll("[data-pick-player]").forEach(el => el.onclick = () => {
      const g = getGame(modal.gameId);
      const c = getCommunity(g.communityId);
      const p = c.roster.find(pl => pl.id === el.dataset.pickPlayer);
      if (!p) return;
      if (!g.seats) g.seats = new Array(9).fill(null);
      g.seats[modal.seatIndex] = p.id;
      if (!g.players.some(gp => gp.id === p.id)) g.players.push({id:p.id, name:p.name});
      if (!g.liveChips) g.liveChips = {};
      if (g.liveChips[p.id] === undefined) g.liveChips[p.id] = 0;
      saveState();
      closeModal();
    });
  }

  if (modal && modal.type === "seatDetail") {
    const openChipPhoto = app.querySelector("[data-open-chip-photo]");
    if (openChipPhoto) openChipPhoto.onclick = () => {
      const g = getGame(modal.gameId);
      openModal({type:"chipPhotoCount", gameId: modal.gameId, playerId: modal.playerId, communityId: g.communityId, imageSrc: null, stacks: [], analyzing: false, analyzeError: null, noPhoto: false});
    };
    const openChipManual = app.querySelector("[data-open-chip-manual]");
    if (openChipManual) openChipManual.onclick = () => {
      const g = getGame(modal.gameId);
      const c = getCommunity(g.communityId);
      const stacks = (c.chipValues||[]).map(cv => ({id: uid(), name: cv.name, color: toHexColor(cv.color), count: "", matchedValue: cv.value}));
      if (!stacks.length) { alert("אין עדיין הגדרת ציפים לקבוצה הזו - הגדירו קודם ממסך הבית."); return; }
      openModal({type:"chipPhotoCount", gameId: modal.gameId, playerId: modal.playerId, communityId: g.communityId, imageSrc: null, stacks, analyzing: false, analyzeError: null, noPhoto: true});
    };
    app.querySelectorAll("[data-seat-instant-chip]").forEach(el => el.onclick = () => {
      const amt = parseFloat(el.dataset.seatInstantChip);
      const g = getGame(modal.gameId);
      g.buyins.push({id:uid(), playerId: modal.playerId, amount: amt, ts: Date.now()});
      saveState();
      closeModal();
    });
    const otherToggle = app.querySelector("[data-seat-other-toggle]");
    if (otherToggle) otherToggle.onclick = () => {
      updateModal({otherOpen: true});
      const inp = document.getElementById("seat-buyin-amount");
      if (inp) inp.focus();
    };
    const confirmSeatBuyin = app.querySelector("[data-confirm-seat-buyin]");
    if (confirmSeatBuyin) confirmSeatBuyin.onclick = () => {
      const amt = parseFloat(document.getElementById("seat-buyin-amount").value);
      if (!amt || amt <= 0) return;
      const g = getGame(modal.gameId);
      g.buyins.push({id:uid(), playerId: modal.playerId, amount: amt, ts: Date.now()});
      saveState();
      closeModal();
    };
    const seatHistoryBtn = app.querySelector("[data-seat-history]");
    if (seatHistoryBtn) seatHistoryBtn.onclick = () => openModal({type:"history", gameId: modal.gameId, playerId: modal.playerId});
    const quickEndBtn = app.querySelector("[data-quick-end]");
    if (quickEndBtn) quickEndBtn.onclick = () => {
      const g = getGame(modal.gameId);
      const chips = (g.liveChips||{})[modal.playerId] || 0;
      g.cashouts[modal.playerId] = {amount: chips, ts: Date.now(), arrangedWith: []};
      maybeAutoCloseNight(g);
      saveState();
      closeModal();
    };
    const confirmChips = app.querySelector("[data-confirm-seat-chips]");
    if (confirmChips) confirmChips.onclick = () => {
      const v = parseFloat(document.getElementById("seat-chips").value);
      if (isNaN(v) || v < 0) return;
      const g = getGame(modal.gameId);
      if (!g.liveChips) g.liveChips = {};
      g.liveChips[modal.playerId] = v;
      saveState();
      closeModal();
    };
    const clearSeat = app.querySelector("[data-clear-seat]");
    if (clearSeat) clearSeat.onclick = () => {
      const g = getGame(modal.gameId);
      if (g.seats) {
        const idx = g.seats.indexOf(modal.playerId);
        if (idx !== -1) g.seats[idx] = null;
      }
      saveState();
      closeModal();
    };
  }

  if (modal && modal.type === "bulkBuyin") {
    app.querySelectorAll("[data-bulk-chip]").forEach(el => el.onclick = () => { document.getElementById("bulk-buyin-amount").value = el.dataset.bulkChip; });
    app.querySelectorAll("[data-bulk-select]").forEach(el => el.onclick = () => {
      const sel = Object.assign({}, modal.selected);
      sel[el.dataset.bulkSelect] = !sel[el.dataset.bulkSelect];
      updateModal({selected: sel});
    });
    const confirmBulkBuyin = app.querySelector("[data-confirm-bulk-buyin]");
    if (confirmBulkBuyin) confirmBulkBuyin.onclick = () => {
      const amt = parseFloat(document.getElementById("bulk-buyin-amount").value);
      if (!amt || amt <= 0) return;
      const g = getGame(modal.gameId);
      const ids = Object.keys(modal.selected).filter(k => modal.selected[k]);
      const now = Date.now();
      ids.forEach(pid => { g.buyins.push({id:uid(), playerId: pid, amount: amt, ts: now}); });
      saveState();
      closeModal();
    };
  }

  if (modal && modal.type === "leave") {
    const confirmBtn = app.querySelector("[data-confirm-leave]");
    if (confirmBtn) confirmBtn.onclick = () => {
      const raw = parseFloat(document.getElementById("leave-amount").value);
      if (isNaN(raw) || raw < 0) return;
      const multEl = document.getElementById("leave-multiplier");
      const multRaw = multEl ? parseInt(multEl.value) : 1;
      const multiplier = (!multRaw || multRaw < 1) ? 1 : (multRaw > 99 ? 99 : multRaw);
      const amt = Math.round((raw / multiplier) * 100) / 100;
      const g = getGame(modal.gameId);
      g.cashouts[modal.playerId] = {amount: amt, ts: Date.now(), arrangedWith: []};
      if (!g.liveChips) g.liveChips = {};
      g.liveChips[modal.playerId] = amt;
      maybeAutoCloseNight(g);
      saveState();
      closeModal();
    };
  }

  if (modal && modal.type === "endNight") {
    function getMultiplier(){
      const el = document.getElementById("chip-multiplier");
      const v = el ? parseInt(el.value) : 1;
      return (!v || v < 1) ? 1 : (v > 99 ? 99 : v);
    }
    function updateLiveBalance(){
      const box = document.getElementById("live-balance-box");
      if (!box) return;
      const totalBuyins = parseFloat(box.dataset.totalBuyins) || 0;
      const alreadyOut = parseFloat(box.dataset.alreadyOut) || 0;
      const multiplier = getMultiplier();
      let enteredSum = 0, allFilled = true;
      app.querySelectorAll("[data-end-amount]").forEach(inp => {
        const v = parseFloat(inp.value);
        if (isNaN(v)) allFilled = false; else enteredSum += v / multiplier;
      });
      const totalOut = alreadyOut + enteredSum;
      const diff = Math.round((totalBuyins - totalOut) * 100) / 100;
      const balancedNow = allFilled && Math.abs(diff) < 0.5;
      box.innerHTML = `
        <div class="row-between" style="flex-wrap:wrap;gap:10px 16px;">
          <div><div class="pot-label">סה"כ הכנסות</div><div class="pot-val">₪${totalBuyins}</div></div>
          <div style="text-align:center;"><div class="pot-label">סה"כ ציפים בשולחן</div><div class="pot-val">₪${Math.round(totalOut*100)/100}</div></div>
          <div style="text-align:left;"><div class="pot-label">נשאר לשלם</div><div class="pot-val">₪${diff}</div></div>
          ${allFilled ? `<div class="badge ${balancedNow?'badge-ok':'badge-bad'}" style="width:100%;text-align:center;">${balancedNow?'מאוזן ✓':'לא מאוזן'}</div>` : ""}
        </div>
      `;
    }
    const multiplierInput = document.getElementById("chip-multiplier");
    if (multiplierInput) multiplierInput.oninput = () => { modal.multiplier = getMultiplier(); updateLiveBalance(); };
    app.querySelectorAll("[data-end-amount]").forEach(el => el.oninput = (e) => {
      modal.amounts = modal.amounts || {};
      modal.amounts[el.dataset.endAmount] = e.target.value;
      updateLiveBalance();
    });
    updateLiveBalance();
    const confirmBulkBtn = app.querySelector("[data-confirm-end-bulk]");
    if (confirmBulkBtn) confirmBulkBtn.onclick = () => {
      const g = getGame(modal.gameId);
      const active = g.players.filter(p => !(p.id in g.cashouts));
      const multiplier = getMultiplier();
      const inputs = app.querySelectorAll("[data-end-amount]");
      let allFilled = true;
      const values = {};
      inputs.forEach(inp => {
        const v = parseFloat(inp.value);
        if (isNaN(v) || v < 0) allFilled = false;
        values[inp.dataset.endAmount] = v / multiplier;
      });
      if (!allFilled) { alert("צריך למלא סכום תקין לכל שחקן פעיל."); return; }
      if (!g.liveChips) g.liveChips = {};
      active.forEach(p => {
        const amt = Math.round(values[p.id]*100)/100;
        g.cashouts[p.id] = {amount: amt, ts: Date.now(), arrangedWith: []};
        g.liveChips[p.id] = amt;
      });
      g.closed = true;
      const c = getCommunity(g.communityId);
      c.lastParticipants = g.players.map(p=>p.id);
      saveState();
      openModal({type:"summary", gameId: g.id});
    };
    const confirmBtn = app.querySelector("[data-confirm-end]");
    if (confirmBtn) confirmBtn.onclick = () => {
      const g = getGame(modal.gameId);
      g.closed = true;
      const c = getCommunity(g.communityId);
      c.lastParticipants = g.players.map(p=>p.id);
      saveState();
      openModal({type:"summary", gameId: g.id});
    };
  }
}

(async function init(){
  document.getElementById("app").innerHTML =
    '<div style="padding:60px 20px;text-align:center;color:#a8a29e;font-size:14px;">טוען נתונים משותפים...</div>';
  [state, myIdentity] = await Promise.all([loadState(), loadIdentity()]);
  // One-time cleanup: remove legacy communities that weren't created via the "new community"
  // button (they have no createdBy - e.g. the two starter communities from an earlier version
  // of this app), along with any of their games.
  const keepIds = new Set(state.communities.filter(c => c.createdBy).map(c => c.id));
  const hadLegacy = keepIds.size !== state.communities.length;
  state.communities = state.communities.filter(c => c.createdBy);
  state.games = state.games.filter(g => keepIds.has(g.communityId));
  if (hadLegacy) saveState();
  render();
})();
</script>
</body>
</html>
