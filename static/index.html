<body>
<div id="app"></div>

<script>
// ---------- Real persistence: backed by the app's own server + database ----------
function uid(){ return Math.random().toString(36).slice(2,10); }

// A stable per-browser id so the server knows which "personal identity" bucket belongs
// to this device. Not a login - just lets each browser keep its own typed-in name.
function getClientId(){
  let id = localStorage.getItem("poker-tracker-client-id");
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : (uid()+uid()+uid()));
    localStorage.setItem("poker-tracker-client-id", id);
  }
  return id;
}

// ---------- AI vision helper (calls our server, which calls Claude with the real API key) ----------
async function callClaudeVisionMulti(dataUrls, promptText){
  const response = await fetch("/api/vision", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ dataUrls, promptText })
  });
  if (!response.ok) throw new Error("vision request failed");
  return await response.json();
}
// ---------- Poker equity calculator (exact deck simulation - no LLM math involved) ----------
// Claude's only job for this feature is reading the cards off the photo into structured
// JSON (fast, reliable - the same kind of task the chip-counting feature already does).
// The actual percentages come from dealing the unknown cards thousands of times here and
// tallying outcomes - deterministic, instant, and always correct, unlike asking an LLM to
// reason through combinatorics (which proved slow and unreliable in practice).
const CARD_RANKS = "23456789TJQKA";
function parsePokerCard(s){
  const rank = CARD_RANKS.indexOf(s[0].toUpperCase()) + 2;
  const suit = s[1].toLowerCase();
  return {rank, suit};
}
function fullPokerDeck(){
  const deck = [];
  for (let r = 2; r <= 14; r++) for (const s of "cdhs") deck.push({rank:r, suit:s});
  return deck;
}
function pokerCardKey(c){ return c.rank + c.suit; }
function evaluate5(cards){
  const ranks = cards.map(c=>c.rank).sort((a,b)=>b-a);
  const suits = cards.map(c=>c.suit);
  const isFlush = new Set(suits).size === 1;
  const uniqueRanks = Array.from(new Set(ranks)).sort((a,b)=>b-a);
  let isStraight = false, straightHigh = null;
  if (uniqueRanks.length === 5) {
    if (uniqueRanks[0]-uniqueRanks[4] === 4) { isStraight = true; straightHigh = uniqueRanks[0]; }
    else if (uniqueRanks.join(",") === "14,5,4,3,2") { isStraight = true; straightHigh = 5; }
  }
  const counts = {};
  ranks.forEach(r => counts[r] = (counts[r]||0)+1);
  const countItems = Object.entries(counts).map(([r,c])=>[Number(r),c]).sort((a,b)=> b[1]-a[1] || b[0]-a[0]);
  const pattern = countItems.map(x=>x[1]).join(",");
  const orderedRanks = countItems.map(x=>x[0]);

  if (isStraight && isFlush) return [8, straightHigh];
  if (pattern === "4,1") return [7, orderedRanks[0], orderedRanks[1]];
  if (pattern === "3,2") return [6, orderedRanks[0], orderedRanks[1]];
  if (isFlush) return [5, ...ranks];
  if (isStraight) return [4, straightHigh];
  if (pattern === "3,1,1") return [3, orderedRanks[0], ...orderedRanks.slice(1)];
  if (pattern === "2,2,1") return [2, orderedRanks[0], orderedRanks[1], orderedRanks[2]];
  if (pattern === "2,1,1,1") return [1, orderedRanks[0], ...orderedRanks.slice(1)];
  return [0, ...ranks];
}
function compareHandRank(a, b){
  for (let i=0;i<Math.max(a.length,b.length);i++){
    const av = a[i]===undefined?-1:a[i], bv = b[i]===undefined?-1:b[i];
    if (av !== bv) return av - bv;
  }
  return 0;
}
function kCombinations5(arr){
  // all 5-card subsets of a 6 or 7 card array
  const results = [];
  function helper(start, combo){
    if (combo.length === 5) { results.push(combo.slice()); return; }
    for (let i=start;i<arr.length;i++){ combo.push(arr[i]); helper(i+1, combo); combo.pop(); }
  }
  helper(0, []);
  return results;
}
function bestHandRank(cards){
  let best = null;
  for (const combo of kCombinations5(cards)) {
    const r = evaluate5(combo);
    if (best === null || compareHandRank(r, best) > 0) best = r;
  }
  return best;
}
function simulatePokerOdds(hands, board, iterations){
  const parsedHands = hands.map(h => h.map(parsePokerCard));
  const parsedBoard = board.map(parsePokerCard);
  const usedKeys = new Set([...parsedBoard, ...parsedHands.flat()].map(pokerCardKey));
  const remaining = fullPokerDeck().filter(c => !usedKeys.has(pokerCardKey(c)));
  const needed = 5 - parsedBoard.length;
  const n = parsedHands.length;

  const winCount = new Array(n).fill(0);
  const tieCount = new Array(n).fill(0);
  const bothRunsCount = new Array(n).fill(0);
  const oneRunCount = new Array(n).fill(0);
  const neitherRunCount = new Array(n).fill(0);

  function sampleCards(deck, k){
    const arr = deck.slice();
    for (let i=0;i<k;i++){
      const j = i + Math.floor(Math.random()*(arr.length-i));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr.slice(0,k);
  }
  function resolveRun(boardExtra){
    const fullBoard = parsedBoard.concat(boardExtra);
    const ranks = parsedHands.map(h => bestHandRank(h.concat(fullBoard)));
    let best = ranks[0];
    for (let i=1;i<n;i++) if (compareHandRank(ranks[i], best) > 0) best = ranks[i];
    const winners = [];
    for (let i=0;i<n;i++) if (compareHandRank(ranks[i], best) === 0) winners.push(i);
    return winners;
  }

  for (let iter=0; iter<iterations; iter++){
    const sample = needed > 0 ? sampleCards(remaining, needed*2) : [];
    const run1Extra = sample.slice(0, needed);
    const run2Extra = sample.slice(needed, needed*2);

    const winners1 = resolveRun(run1Extra);
    if (winners1.length === 1) winCount[winners1[0]]++;
    else winners1.forEach(i => tieCount[i]++);

    const winners2 = resolveRun(run2Extra);
    const set1 = new Set(winners1), set2 = new Set(winners2);
    for (let i=0;i<n;i++){
      const w1 = set1.has(i), w2 = set2.has(i);
      if (w1 && w2) bothRunsCount[i]++;
      else if (w1 || w2) oneRunCount[i]++;
      else neitherRunCount[i]++;
    }
  }

  return parsedHands.map((h,i) => ({
    winPct: winCount[i]/iterations*100,
    tiePct: tieCount[i]/iterations*100,
    bothRunsPct: bothRunsCount[i]/iterations*100,
    oneRunPct: oneRunCount[i]/iterations*100,
    neitherRunPct: neitherRunCount[i]/iterations*100,
  }));
}
// Resize to Claude's own vision cap before sending, so any pixel coordinates it
// returns line up exactly with the image we display (no separate resize on their end).
function resizeImageDataUrl(dataUrl, maxDim, callback){
  const img = new Image();
  img.onload = () => {
    let w = img.naturalWidth, h = img.naturalHeight;
    if (Math.max(w,h) > maxDim) {
      const scale = maxDim / Math.max(w,h);
      w = Math.round(w*scale); h = Math.round(h*scale);
    }
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL("image/jpeg", 0.85), w, h);
  };
  img.src = dataUrl;
}
// The poker-odds photo is always laid out wide (hands in a row above the board) - if the
// phone captured it in portrait, rotate it 90deg so the display and what Claude sees both
// match that layout instead of showing a tall, mostly-empty box.
function ensureLandscapeDataUrl(dataUrl, callback){
  const img = new Image();
  img.onload = () => {
    const w = img.naturalWidth, h = img.naturalHeight;
    if (h <= w) { callback(dataUrl); return; }
    const canvas = document.createElement("canvas");
    canvas.width = h; canvas.height = w;
    const ctx = canvas.getContext("2d");
    ctx.translate(h, 0);
    ctx.rotate(Math.PI/2);
    ctx.drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL("image/jpeg", 0.9));
  };
  img.src = dataUrl;
}

function defaultState(){
  return { communities: [], games: [] };
}

// Throws on any failure (network error, non-2xx) instead of silently returning empty
// defaults - a fresh install already gets {communities:[],games:[]} from the server itself
// (200 OK), so a thrown error here always means the fetch genuinely failed. Every caller
// must handle that by keeping whatever's already in memory, never by falling back to
// defaultState() - doing so and then saving would wipe real data with an empty snapshot.
async function loadState(){
  const res = await fetch("/api/state");
  if (!res.ok) throw new Error("failed to load state: " + res.status);
  return await res.json();
}

let saveInFlight = null;
async function saveState(){
  // Serialize saves so overlapping calls don't race each other.
  const run = async () => {
    try {
      await fetch("/api/state", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(state)
      });
    }
    catch(e){ console.error("save failed", e); alert("שמירה נכשלה - בדוק את החיבור לאינטרנט ונסה שוב."); }
  };
  saveInFlight = (saveInFlight || Promise.resolve()).then(run);
  return saveInFlight;
}

// ---------- Keep the shared data fresh without the user having to do anything ----------
// Primary path is instant: the server pushes a "changed" event over SSE the moment anyone
// saves (see connectLiveSync below), so other open tabs refetch within about a second.
// Periodic polling stays underneath as a fallback for when SSE is unsupported/blocked or
// the connection drops - same safety net as before, just now a backup instead of the
// primary mechanism. Skip a refresh whenever a modal is open so we never yank away
// something someone's mid-typing; render() re-draws whatever nav/modal already are, so this
// never navigates anyone away from the screen (e.g. table) they're currently looking at.
async function doRefreshNow(){
  if (modal) return;
  try {
    // If a save from something the user just did is still in flight, fetching now would
    // race it - the GET can land before that POST commits and return stale data that then
    // overwrites the local (correct, newer) state, making the change flicker away for a
    // few seconds until the next refresh catches up. Wait for it to finish first so the
    // fetch is always at least as fresh as anything already saved.
    if (saveInFlight) await saveInFlight;
    const fresh = await loadState();
    state = fresh;
    const scrollY = window.scrollY;
    render();
    window.scrollTo(0, scrollY);
  } catch(e) { /* offline or a hiccup - next refresh will retry */ }
}
// Interval itself lives in shared state (refreshIntervalSec) so Super Admin can change it
// from any device and every other device picks up the new cadence on its next tick.
function scheduleAutoRefresh(){
  const sec = (state.refreshIntervalSec > 0) ? state.refreshIntervalSec : 6;
  setTimeout(tickAutoRefresh, sec * 1000);
}
async function tickAutoRefresh(){
  await doRefreshNow();
  scheduleAutoRefresh();
}
// EventSource reconnects on its own after a drop (network hiccup, server restart, phone
// backgrounded) - nothing extra needed here for that. visibilitychange below covers the
// case where the tab was backgrounded long enough to miss events entirely.
function connectLiveSync(){
  try {
    const es = new EventSource("/api/events");
    es.onmessage = () => { doRefreshNow(); };
  } catch(e) { /* SSE unsupported/blocked - periodic polling still covers us */ }
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) doRefreshNow();
});

// ---------- "Who am I" - private per-browser identity, used only to tag who created a community ----------
// Not a real login: it's a name each user types once, remembered for their own browser via
// a per-device id. It lets us show/allow "delete" only to the creator, but someone could
// still type someone else's name - it's a courtesy, not security.
async function loadIdentity(){
  try {
    const res = await fetch("/api/identity?clientId=" + encodeURIComponent(getClientId()));
    if (res.ok) {
      const data = await res.json();
      if (data) return data;
    }
  } catch(e) { /* not set yet */ }
  return { id: uid(), name: null };
}
async function loadVersion(){
  try {
    const res = await fetch("/api/version");
    if (res.ok) return (await res.json()).version;
  } catch(e) { /* not critical - Settings just won't show a version */ }
  return null;
}
async function saveIdentity(){
  try {
    await fetch("/api/identity?clientId=" + encodeURIComponent(getClientId()), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(myIdentity)
    });
  }
  catch(e){ console.error("identity save failed", e); }
}

// Seat a player into the first open slot (main 9, then the 10th overflow slot),
// growing g.seats to hold it if needed. Shared by autoSeatSelf and autoJoinViaInvite.
function seatPlayerIfRoom(g, playerId, p){
  if (!g.seats) g.seats = new Array(9).fill(null);
  if (g.seats.includes(playerId)) return true;
  let emptyIdx = g.seats.findIndex((s,i) => i < 9 && !s);
  if (emptyIdx === -1) {
    while (g.seats.length < 10) g.seats.push(null);
    if (g.seats[9] == null) emptyIdx = 9;
  }
  if (emptyIdx === -1) return false; // table full (10/10)
  g.seats[emptyIdx] = playerId;
  if (!g.players.some(gp => gp.id === playerId)) g.players.push({id:p.id, name:p.name});
  if (!g.liveChips) g.liveChips = {};
  if (g.liveChips[playerId] === undefined) g.liveChips[playerId] = 0;
  return true;
}
// If this device is remembered as a specific roster player in this game's community
// (see data-pick-player below), and that player isn't seated yet in this game, seat
// them automatically - so returning players don't have to pick their name every night.
function autoSeatSelf(gameId){
  const g = getGame(gameId);
  if (!g || g.closed) return;
  const playerId = myIdentity.myPlayers && myIdentity.myPlayers[g.communityId];
  if (!playerId) return;
  const c = getCommunity(g.communityId);
  const p = c && c.roster.find(pl => pl.id === playerId);
  if (!p) return;
  if (seatPlayerIfRoom(g, playerId, p)) saveState();
}
// For someone opening a game via a shared invite link: if this device isn't already
// linked to a roster player in this community, find one by matching name (so the same
// person re-clicking a link doesn't get duplicated) or create a new roster entry for
// them, then seat them - up to the table's 10-seat capacity.
async function autoJoinViaInvite(gameId){
  // Re-fetch the latest shared state right before mutating and saving, to shrink the
  // window for a lost-update race against a concurrent save from another device (e.g.
  // the community admin's own phone saving a snapshot from before this join happened,
  // silently wiping the new roster entry/seat back out on the shared blob).
  try { state = await loadState(); } catch(e) { /* fall back to what's already in memory */ }
  const g = getGame(gameId);
  if (!g || g.closed) return;
  const c = getCommunity(g.communityId);
  if (!c) return;
  let playerId = myIdentity.myPlayers && myIdentity.myPlayers[g.communityId];
  let p = playerId ? c.roster.find(pl => pl.id === playerId) : null;
  if (!p) {
    if (!myIdentity.name) return; // no name yet to identify/create with (forced onboarding will ask, then retry)
    p = c.roster.find(pl => pl.name === myIdentity.name);
    if (!p) { p = {id: uid(), name: myIdentity.name}; c.roster.push(p); }
    if (!myIdentity.myPlayers) myIdentity.myPlayers = {};
    myIdentity.myPlayers[g.communityId] = p.id;
    saveIdentity();
  }
  seatPlayerIfRoom(g, p.id, p);
  await saveState();
  render();
}
function openModal(m){ modal = m; render(); }
function closeModal(){ modal = null; render(); }
function updateModal(partial){
  // Toggling a checkbox shouldn't jump the scroll back to the top - capture and
  // restore scroll positions of the modal and any inner scrollable list around the re-render.
  const modalEl = document.querySelector(".modal");
  const listEl = document.querySelector(".scroll-list");
  const modalScroll = modalEl ? modalEl.scrollTop : null;
  const listScroll = listEl ? listEl.scrollTop : null;
  modal = Object.assign({}, modal, partial);
  render();
  const modalEl2 = document.querySelector(".modal");
  const listEl2 = document.querySelector(".scroll-list");
  if (modalEl2 && modalScroll != null) modalEl2.scrollTop = modalScroll;
  if (listEl2 && listScroll != null) listEl2.scrollTop = listScroll;
}

// ---------- Data helpers ----------
function getCommunity(id){ return state.communities.find(c => c.id === id); }
// A community can save several PayBox groups (e.g. different sub-groups); exactly one is
// "active" at a time - this is the single source of truth every paybox-opening button reads.
// Falls back to the old single-link field so a community set up before this existed keeps working.
function getActivePayboxLink(c){
  if (c && c.payboxLinks && c.payboxLinks.length) {
    const active = c.payboxLinks.find(pl => pl.id === c.activePayboxLinkId) || c.payboxLinks[0];
    return active ? active.link : null;
  }
  return (c && c.payboxLink) || null;
}
function getGame(id){ return state.games.find(g => g.id === id); }
function maybeAutoCloseNight(g){
  const seated = (g.seats || []).filter(Boolean);
  if (g.players.length > 0 && seated.every(pid => pid in g.cashouts)) g.closed = true;
}
function gamesForCommunity(id){ return state.games.filter(g => g.communityId === id).sort((a,b)=> a.date < b.date ? 1 : -1); }

// ---------- Player selfie photos (double-tap a seated player's circle) ----------
let selfieInput = null;
function processSelfieFile(file, callback){
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 240;
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - side) / 2;
      const sy = (img.naturalHeight - side) / 2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      callback(canvas.toDataURL("image/jpeg", 0.75));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function openFilePicker(communityId, playerId, useCamera){
  if (!selfieInput) {
    selfieInput = document.createElement("input");
    selfieInput.type = "file";
    selfieInput.accept = "image/*";
    selfieInput.style.display = "none";
    document.body.appendChild(selfieInput);
  }
  if (useCamera) selfieInput.capture = "user"; else selfieInput.removeAttribute("capture");
  selfieInput.value = "";
  selfieInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    processSelfieFile(file, (dataUrl) => {
      const c = getCommunity(communityId);
      const rp = c && c.roster.find(pl => pl.id === playerId);
      if (rp) { rp.photo = dataUrl; saveState(); render(); }
    });
  };
  selfieInput.click();
  closeModal();
}

// Admin-created avatars (state.customAvatars: {id, name, category, image}) merge into these
// built-in groups by matching category label, or form new groups of their own.
function getAvatarGroups(){
  const hidden = new Set(state.hiddenAvatarKeys||[]);
  const labelOverrides = state.avatarCategoryLabelOverrides || {};
  const nameOverrides = state.avatarNameOverrides || {};
  const groups = AVATAR_CATEGORIES.map(cat => ({
    key: "builtin-cat:" + cat.folder,
    label: labelOverrides[cat.folder] || cat.label,
    items: cat.items.map((name,i) => {
      const pickKey = "builtin:" + cat.folder + "/" + (i+1);
      return {name: nameOverrides[pickKey] || name, pickKey, src: `/static/avatars/${cat.folder}/${i+1}.jpg`};
    }).filter(it => !hidden.has(it.pickKey))
  }));
  (state.customAvatars||[]).forEach(av => {
    const key = "custom-cat:" + av.category;
    let grp = groups.find(g => g.key === key);
    if (!grp) { grp = {key, label: av.category, items: []}; groups.push(grp); }
    grp.items.push({name: av.name, pickKey: "custom:" + av.id, src: av.image});
  });
  const visible = groups.filter(g => g.items.length);
  const order = state.avatarCategoryOrder;
  if (order && order.length) {
    visible.sort((a,b) => {
      const ia = order.indexOf(a.key); const ib = order.indexOf(b.key);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
  }
  return visible;
}

function playerNetProfit(communityId, playerId){
  let net = 0, count = 0;
  gamesForCommunity(communityId).forEach(g => {
    const co = g.cashouts[playerId];
    if (!co) return;
    const buyins = g.buyins.filter(b=>b.playerId===playerId).reduce((s,b)=>s+b.amount,0);
    net += (co.amount - buyins);
    count++;
  });
  return { net, count };
}
function netBadge(stat){
  const { net, count } = stat;
  if (count === 0) return `<span class="balance-line balance-neutral" style="margin-top:0;">עדיין לא שיחק</span>`;
  const cls = net>0.5?"balance-pos":(net<-0.5?"balance-neg":"balance-neutral");
  const gamesText = count === 1 ? "ממשחק אחד" : `מ-${count} משחקים`;
  return `<span class="balance-line ${cls}" style="margin-top:0;">${net>=0?"+":""}₪${Math.round(net)} ${gamesText}</span>`;
}

// ---------- Settlement algorithm ----------
function computeBalances(game){
  const balances = {};
  game.players.forEach(p => {
    const buyins = game.buyins.filter(b => b.playerId === p.id).reduce((s,b)=>s+b.amount,0);
    const cashout = (game.cashouts[p.id] || {}).amount ?? 0;
    balances[p.id] = { buyins, cashedOut: p.id in game.cashouts, profit: cashout - buyins };
  });
  return balances;
}
function settleTransactions(balances, players){
  const creditors = [], debtors = [];
  Object.entries(balances).forEach(([id,b])=>{
    if (b.profit > 0.005) creditors.push({id, amt:b.profit});
    else if (b.profit < -0.005) debtors.push({id, amt:-b.profit});
  });
  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);
  const nameOf = id => (players.find(p=>p.id===id)||{}).name || "?";
  const txns = [];
  let ci=0, di=0;
  while(ci<creditors.length && di<debtors.length){
    const c=creditors[ci], d=debtors[di];
    const amt = Math.min(c.amt, d.amt);
    if (amt > 0.005) txns.push({from:d.id, fromName:nameOf(d.id), to:c.id, toName:nameOf(c.id), amount:Math.round(amt*100)/100});
    c.amt -= amt; d.amt -= amt;
    if (c.amt <= 0.005) ci++;
    if (d.amt <= 0.005) di++;
  }
  return txns;
}

// A player who left mid-game and arranged payment directly with active counterpart(s)
// already moved real cash with those specific people. That must count toward the
// final settlement - otherwise the app would ask for transfers that ignore money
// that already changed hands, or ask people to pay twice.
function computeArrangementAdjustments(game){
  const raw = computeBalances(game);
  const adjusted = {};
  Object.keys(raw).forEach(id => { adjusted[id] = raw[id].profit; });
  const excluded = new Set();
  const entries = Object.entries(game.cashouts).sort((a,b) => (a[1].ts||0) - (b[1].ts||0));
  entries.forEach(([playerId, co]) => {
    if (co.arrangedWith && co.arrangedWith.length > 0) {
      const share = adjusted[playerId] / co.arrangedWith.length;
      co.arrangedWith.forEach(cid => { if (adjusted[cid] !== undefined) adjusted[cid] += share; });
      excluded.add(playerId);
    }
  });
  return { adjusted, excluded };
}

function computeFinalBalances(game){
  const { adjusted, excluded } = computeArrangementAdjustments(game);
  const finalBalances = {};
  Object.keys(adjusted).forEach(id => { if (!excluded.has(id)) finalBalances[id] = {profit: adjusted[id]}; });
  return finalBalances;
}

function render(){
  const app = document.getElementById("app");
  let html = "";
  if (nav.screen === "home") html = renderHome();
  else if (nav.screen === "community") html = renderCommunity(nav.communityId);
  else if (nav.screen === "table") html = renderTable(nav.gameId);
  const screenTag = `<div class="screen-tag">${esc(SCREEN_NAMES[nav.screen] || nav.screen)}</div>`;
  html = screenTag + html;
  if (modal) html += renderModal(modal);
  app.innerHTML = html;
  attachHandlers();
}

function renderTable(gameId){
  const SEAT_POS = [
    [50,8],[74,18],[85,43],[80,71],[65,90],[35,90],[12,71],[7,43],[22,18],[2,90]
  ];
  const g = getGame(gameId);
  if (!g) return `<div class="empty">משחק לא נמצא</div>`;
  const c = getCommunity(g.communityId) || {name:"קבוצה", roster:[]};
  const seats = g.seats || new Array(9).fill(null);
  const buyinTotals = {};
  g.buyins.forEach(b => { buyinTotals[b.playerId] = (buyinTotals[b.playerId]||0) + b.amount; });
  const liveChips = g.liveChips || {};

  const seatsHtml = seats.map((pid, i) => {
    const [x,y] = SEAT_POS[i];
    if (!pid) {
      if (i === 9) return ""; // the 10th slot's empty state is handled by the dedicated "add extra player" button instead
      if (hideEmptySeats) return "";
      return `<div class="seat-wrap" style="left:${x}%;top:${y}%;" data-seat="${i}"><div class="seat-circle empty">+</div></div>`;
    }
    const p = g.players.find(pl => pl.id === pid);
    const name = p ? p.name : "?";
    const cashedOut = pid in g.cashouts;
    const buyin = buyinTotals[pid] || 0;
    const chips = liveChips[pid] || 0;
    const rosterP = c.roster.find(rp => rp.id === pid);
    const photo = rosterP && rosterP.photo;
    let caption = `קנייה ₪${buyin}`;
    if (cashedOut) {
      const profit = chips - buyin;
      const sign = profit > 0 ? "+" : "";
      const isZero = Math.abs(profit) < 0.5;
      const profitColor = profit > 0.5 ? "#6ee7b7" : (profit < -0.5 ? "#fda4af" : "inherit");
      const settled = !!(g.cashouts[pid] && g.cashouts[pid].settled);
      caption = `<span style="color:${profitColor};font-weight:700;">${sign}₪${Math.round(profit)}</span>` +
        (isZero ? "" : `<br><span data-toggle-settled="${pid}" style="cursor:pointer;font-size:9px;color:${settled?'#6ee7b7':'#fbbf24'};">${settled?'✓ הוסדר':'ממתין להסדר'}</span>`);
    }
    const circleStyle = (photo && !cashedOut) ? ` style="background-image:url('${photo}');background-size:cover;background-position:center;"` : "";
    const doorIconBig = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>';
    const circleInner = cashedOut ? doorIconBig : (photo ? "" : esc((name||"?").slice(0,2)));
    return `<div class="seat-wrap" style="left:${x}%;top:${y}%;" data-seat="${i}">
      <div class="seat-circle filled ${cashedOut?'cashed-out':''}"${circleStyle}>${circleInner}</div>
      <div class="seat-info" data-seat-info>
        <div class="seat-name">${esc(name)}</div>
        <div class="seat-caption">${caption}</div>
      </div>
    </div>`;
  }).join("");

  const seatedIds = seats.filter(Boolean);
  const totalBuyinAll = seatedIds.reduce((s,pid)=>s+(buyinTotals[pid]||0),0);
  const totalChipsAll = seatedIds.reduce((s,pid)=>s+(liveChips[pid]||0),0);
  const diff = totalChipsAll - totalBuyinAll;
  const diffLabel = diff > 0.5 ? "קופה בחוסר" : (diff < -0.5 ? "קופה בעודף" : "קופה מאוזנת");
  const diffColor = diff > 0.5 ? "#fda4af" : (diff < -0.5 ? "#6ee7b7" : "var(--muted)");

  return `
    <div class="top row" style="padding-top:14px;padding-bottom:6px;">
      <button class="back-arrow" data-back-community="${g.communityId}">${icon('back')}</button>
      <div class="flex1">
        <h1 class="serif sm" style="color:var(--gold);">${esc(c.name)}</h1>
        <div class="meta" style="color:#6ee7b7;font-size:12px;display:flex;align-items:center;gap:5px;">${icon('cal')}${esc(g.date)}</div>
        ${seats.slice(0,9).some(s=>!s) ? `
          <button class="icon-btn" data-toggle-empty-seats title="${hideEmptySeats?'הצג מקומות פנויים':'הסתר מקומות פנויים'}" style="margin-top:6px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.05);color:var(--muted);opacity:.6;display:inline-flex;align-items:center;justify-content:center;">${icon(hideEmptySeats?'eyeOff':'eye')}</button>
        ` : ""}
      </div>
      <button class="icon-btn gold" data-open-poker-odds title="מה הסיכויים שלי" style="flex-shrink:0;width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;">${icon('percent')}</button>
    </div>
    <div class="poker-table-wrap">
      <div class="poker-table-felt"></div>
      <img src="/static/logo-watermark.png" style="position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);width:46%;opacity:.6;pointer-events:none;">
      ${seatsHtml}
      <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateY(70px);text-align:center;z-index:3;">
        <div style="color:var(--muted);font-size:12px;">סה"כ קנייה ₪${totalBuyinAll}</div>
        <div style="color:var(--muted);font-size:12px;">סה"כ ציפים ₪${totalChipsAll}</div>
        <div style="color:${diffColor};font-weight:700;font-size:13px;margin-top:4px;">${diffLabel}${Math.abs(diff)>=0.5?` ₪${Math.abs(Math.round(diff))}`:""}</div>
      </div>
      ${(seats.slice(0,9).filter(Boolean).length >= 9 && seats[9] == null) ? `
        <div style="position:absolute;left:2%;top:${SEAT_POS[5][1]}%;transform:translateY(-50%);">
          <button class="icon-btn gold" data-add-extra-player title="הוסף שחקן נוסף" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;justify-content:center;">${icon('plus')}</button>
        </div>
      ` : ""}
    </div>
  `;
}

        const suit = cardStr[1].toLowerCase();

            ${m.results.map((r,i) => `
              <div style="background:rgba(255,255,255,.05);border-radius:10px;padding:10px 12px;margin-bottom:8px;">

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:13px;color:var(--muted2);margin-bottom:6px;">
                  <div>ניצחון: <b>${r.winPct.toFixed(1)}%</b></div>
                  <div>תיקו: <b>${r.tiePct.toFixed(1)}%</b></div>
                </div>
                <div style="font-size:11px;color:var(--muted);margin-bottom:3px;">ריצה כפולה</div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:13px;color:var(--muted2);">
                  <div>פעמיים ניצחון: <b>${r.bothRunsPct.toFixed(1)}%</b></div>
                  <div>חלוקה שווה: <b>${r.oneRunPct.toFixed(1)}%</b></div>
                </div>
              </div>
            `).join("")}
          </div>
        ` : ""}
      `;
    }
  } else if (m.type === "chipPhotoCount") {
    title = m.noPhoto ? "ספירת ציפים ידנית" : "ספירת ציפים מתמונה";

    const stackRow = (s) => {
      const value = s.matchedValue != null ? s.matchedValue : "";
      return `
        <div class="roster-row">

            <span>ציפים × ₪${value}</span>
            <input type="hidden" data-stack-value="${s.id}" value="${value}">
          </div>
          <span data-stack-subtotal="${s.id}" style="font-weight:700;">₪0</span>
        </div>`;
    };
    const pickButtons = `
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <div style="position:relative;flex:1;">
          <button type="button" class="btn btn-ghost btn-block" style="pointer-events:none;">${icon('plus')} צלם</button>
          <input type="file" accept="image/*" capture="environment" id="chip-count-camera-input" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;">
        </div>
        <div style="position:relative;flex:1;">
          <button type="button" class="btn btn-primary btn-block" style="pointer-events:none;">${icon('plus')} העלה תמונה</button>
          <input type="file" accept="image/*" id="chip-count-upload-input" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;">
        </div>
      </div>

      body = `
        <div class="scroll-list" style="margin:10px 0;">${m.stacks.map(stackRow).join("")}</div>
        <div class="roster-row" style="font-weight:700;"><span class="flex1">סה"כ</span><span data-stack-grand-total>₪0</span></div>
        <button class="btn btn-primary btn-block" data-confirm-chip-count>אשר</button>
      `;
    } else if (!m.imageSrc) {
      body = `
        <p style="color:var(--muted);font-size:13px;">צלמו/העלו תמונה של כל מגדלי הציפים של השחקן, עומדים זקוף - Claude יזהה צבע וכמות בשבילכם (הערכה - כדאי לבדוק ולתקן).</p>
        <div style="background:rgba(255,255,255,.05);border-radius:10px;padding:10px 12px;margin-bottom:12px;">
          <p style="color:var(--muted);font-size:11px;font-weight:700;margin:0 0 4px;">לספירה מדויקת יותר:</p>

          <p style="color:var(--muted);font-size:11px;margin:0 0 2px;">• אם יש כמה מגדלים באותו צבע, רק אחד מהם לא מלא</p>
          <p style="color:var(--muted);font-size:11px;margin:0;">• מגדלים באותו צבע - זה לצד זה</p>
        </div>
        ${pickButtons}
      `;
    } else if (m.analyzing) {
      body = `
        <div style="width:100%;margin-bottom:10px;"><img src="${m.imageSrc}" style="width:100%;border-radius:12px;display:block;opacity:.5;"></div>
        <p style="color:var(--muted);font-size:13px;text-align:center;">מנתח את התמונה...</p>
      `;
    } else if (!m.stacks.length) {
      body = `
        <div style="width:100%;margin-bottom:10px;"><img src="${m.imageSrc}" style="width:100%;border-radius:12px;display:block;"></div>
        ${m.analyzeError ? `<p style="color:#fda4af;font-size:12px;">${esc(m.analyzeError)}</p>` : ""}

    } else {
      const boxedStacks = m.stacks.filter(s => s.box);
      let baselinePct = null;
      if (m.imageW && m.imageH && boxedStacks.length) {
        const maxY2 = Math.max(...boxedStacks.map(s => s.box[3]));
        baselinePct = (maxY2 / m.imageH) * 100;
      }
      const overlays = (baselinePct != null) ? boxedStacks.map(s => {
        const [x1,,x2] = s.box;
        const leftPct = ((x1+x2)/2 / m.imageW) * 100;
        const subtotal = (parseFloat(s.count)||0) * (s.matchedValue!=null?s.matchedValue:0);
        return `
          <div style="position:absolute;left:${leftPct}%;top:${baselinePct}%;transform:translate(-50%,0);background:rgba(0,0,0,.82);border-radius:8px;padding:4px 6px;text-align:center;">
            <input type="number" inputmode="numeric" data-stack-count="${s.id}" value="${s.count}" style="width:38px;background:transparent;border:none;color:#fff;font-weight:700;font-size:13px;text-align:center;padding:0;">
            <input type="number" inputmode="decimal" data-stack-value="${s.id}" value="${s.matchedValue!=null?s.matchedValue:''}" placeholder="ערך" style="width:38px;display:block;background:transparent;border:none;border-top:1px solid rgba(255,255,255,.35);color:#a7f3d0;font-size:11px;text-align:center;padding:1px 0 0;margin-top:1px;">
            <div data-stack-subtotal="${s.id}" style="border-top:1px solid rgba(255,255,255,.35);color:#fbbf24;font-size:11px;font-weight:700;margin-top:1px;padding-top:1px;">₪${Math.round(subtotal*100)/100}</div>
          </div>`;
      }).join("") : "";
      const byChip = {};
      m.stacks.forEach(s => {
        const key = s.chipId || "unknown";
        if (!byChip[key]) byChip[key] = {value: s.matchedValue, image: s.image};
        if (byChip[key].value == null) byChip[key].value = s.matchedValue;
        if (!byChip[key].image) byChip[key].image = s.image;
      });
      const colorRows = Object.entries(byChip).map(([key, cg]) => {
        const qty = m.stacks.filter(s=>(s.chipId||'unknown')===key).reduce((sum,s)=>sum+(parseFloat(s.count)||0),0);
        const sub = qty * (cg.value!=null?cg.value:0);
        return `
          <div class="roster-row">
            <div class="row" style="gap:10px;">
              ${cg.image
                ? `<img src="${cg.image}" style="width:28px;height:28px;object-fit:cover;border-radius:6px;border:1px solid rgba(255,255,255,.3);flex-shrink:0;">`
                : `<div style="width:28px;height:28px;border-radius:6px;border:1px dashed var(--muted);flex-shrink:0;"></div>`}
              <span><span data-color-qty="${esc(key)}">${qty}</span> ציפים × ₪${cg.value!=null?cg.value:'?'}</span>
            </div>
            <span data-color-subtotal="${esc(key)}" style="font-weight:700;">₪${Math.round(sub*100)/100}</span>
          </div>`;
      }).join("");
      body = `
        <div style="width:100%;margin-bottom:10px;position:relative;">
          <img src="${m.imageSrc}" style="width:100%;border-radius:12px;display:block;">
          ${overlays}
        </div>
        <div class="scroll-list" style="margin:10px 0;">${colorRows}</div>
        <div class="roster-row" style="font-weight:700;"><span class="flex1">סה"כ ערך הציפים</span><span data-stack-grand-total>₪0</span></div>
        <p style="color:var(--muted);font-size:11px;margin:6px 0 14px;">הכמות היא הערכה של Claude - בדקו ותקנו על גבי התמונה אם צריך.</p>
        <button class="btn btn-primary btn-block" data-confirm-chip-count>אשר</button>
      `;
    }
  } else if (m.type === "chipSetup") {
    const c = getCommunity(m.communityId);
    title = `הגדרת ציפים — ${esc(c.name)}`;
    const editableList = m.points.length ? `
      <div class="section-title" style="padding:0;margin:0 0 6px;">זוטונים וערכים</div>
      <div class="scroll-list" style="margin-bottom:14px;">
        ${m.points.map((pt,i) => `
          <div class="roster-row">
            <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;">
              <button class="icon-btn" data-move-chip-up="${pt.id}" ${i===0?"disabled":""} style="width:22px;height:18px;padding:0;align-items:center;justify-content:center;${i===0?"opacity:.35;":""}">${icon('up')}</button>
              <button class="icon-btn" data-move-chip-down="${pt.id}" ${i===m.points.length-1?"disabled":""} style="width:22px;height:18px;padding:0;align-items:center;justify-content:center;${i===m.points.length-1?"opacity:.35;":""}">${icon('down')}</button>
            </div>
            ${pt.image
              ? `<img data-point-image="${pt.id}" src="${pt.image}" style="width:40px;height:40px;object-fit:cover;border-radius:8px;flex-shrink:0;border:1px solid rgba(255,255,255,.2);">`
              : `<div data-point-image="${pt.id}" style="width:40px;height:40px;border-radius:8px;flex-shrink:0;border:1px dashed var(--muted);"></div>`}
            <input type="number" inputmode="decimal" placeholder="ערך (למשל 10)" value="${esc(pt.value||'')}" data-chip-value-input="${pt.id}" style="flex:1;">
            <button class="icon-btn danger" data-remove-chip-point="${pt.id}">${icon('trash')}</button>
          </div>
        `).join("")}
      </div>
    ` : "";
    const pickButtons = `
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <div style="position:relative;flex:1;">
          <button type="button" class="btn btn-ghost btn-block" style="pointer-events:none;">${icon('plus')} צלם</button>
          <input type="file" accept="image/*" capture="environment" id="chip-camera-input" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;">
        </div>
        <div style="position:relative;flex:1;">
          <button type="button" class="btn btn-primary btn-block" style="pointer-events:none;">${icon('plus')} העלה תמונה</button>
          <input type="file" accept="image/*" id="chip-upload-input" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;">
        </div>
      </div>
    `;
    if (!m.imageSrc) {
      body = `
        ${editableList}
        <p style="color:var(--muted);font-size:13px;">כדי להוסיף זוטונים: צלמו/העלו תמונה עם זיטון אחד מכל סוג, ואז הקישו על כל זיטון בתמונה כדי לסמן אותו כדוגמה. אפשר לגרור את המסגרת ולשנות את גודלה כדי שתקיף בדיוק את הזיטון. או, הוסיפו זיטון ידנית בלי תמונה בכלל.</p>
        ${pickButtons}
        <button class="btn btn-ghost btn-block" style="margin-bottom:10px;" data-add-chip-manual>${icon('plus')} הוסף צבע ידנית</button>
        ${m.points.length ? `<button class="btn btn-primary btn-block" data-save-chip-values>שמור שינויים</button>` : ""}
      `;
    } else {
      const markers = (m.imageW && m.imageH) ? m.points.filter(pt => pt.x != null).map(pt => {
        const size = pt.size || 20;
        const leftPct = (pt.x / m.imageW) * 100;
        const topPct = (pt.y / m.imageH) * 100;
        const wPct = (size / m.imageW) * 100;
        const hPct = (size / m.imageH) * 100;
        return `
          <div data-color-marker="${pt.id}" style="position:absolute;left:${leftPct}%;top:${topPct}%;width:${wPct}%;height:${hPct}%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);cursor:grab;touch-action:none;">
            <div data-color-marker-resize="${pt.id}" style="position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;cursor:nwse-resize;touch-action:none;display:flex;align-items:center;justify-content:center;"><div style="width:6px;height:6px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.6);"></div></div>
          </div>`;
      }).join("") : "";
      body = `
        <div style="width:100%;margin-bottom:10px;position:relative;">
          <img src="${m.imageSrc}" data-chip-photo style="width:100%;border-radius:12px;display:block;cursor:crosshair;">
          ${markers}
        </div>
        <p style="color:var(--muted);font-size:12px;margin-top:0;">הקישו על זיטון בתמונה כדי להוסיף מסגרת דוגמה - אפשר לגרור אותה למיקום מדויק, ולגרור את הנקודה הלבנה כדי לשנות את הגודל שיקיף בדיוק את הזיטון. התמונה בטבלה מתעדכנת תוך כדי הגרירה.</p>
        ${editableList}
        <button class="btn btn-ghost btn-block" style="margin-bottom:10px;" data-retake-photo>${icon('plus')} תמונה אחרת</button>
        <button class="btn btn-ghost btn-block" style="margin-bottom:10px;" data-add-chip-manual>${icon('plus')} הוסף צבע ידנית</button>
        <button class="btn btn-primary btn-block" data-save-chip-values ${m.points.length===0?"disabled":""}>שמור הגדרות ציפים</button>
      `;
    }
  } else if (m.type === "newCommunity") {
    title = "קבוצה חדשה";
    body = `
      <div style="margin-bottom:12px;">
        <label style="display:block;color:#059669;font-size:11px;margin-bottom:4px;">שם הקבוצה</label>
        <input type="text" id="new-community-name" placeholder="לדוגמה: טקסס בישראל" style="width:100%;" autofocus>
      </div>
      <button class="btn btn-primary btn-block" data-confirm-new-community>צור קבוצה</button>
    `;
  } else if (m.type === "duplicateCommunity") {
    const c = getCommunity(m.communityId);
    title = "שכפול קבוצה";
    body = `
      <p style="color:var(--muted);font-size:13px;">תיווצר קבוצה חדשה עם עותק של השחקנים וההגדרות של הזוטונים מ-<b>${esc(c.name)}</b>. ערבי משחק לא ישוכפלו.</p>
      <div style="margin-bottom:12px;">
        <label style="display:block;color:#059669;font-size:11px;margin-bottom:4px;">שם הקבוצה החדשה</label>
        <input type="text" id="duplicate-community-name" value="${esc(c.name)} - עותק" style="width:100%;" autofocus>
      </div>
      <button class="btn btn-primary btn-block" data-confirm-duplicate-community>שכפל קבוצה</button>
    `;
  } else if (m.type === "deleteCommunity") {
    const c = getCommunity(m.communityId);
    const gameCount = gamesForCommunity(m.communityId).length;
    title = "מחיקת קבוצה";
    body = `
      <p style="color:#6ee7b7;font-size:13px;">למחוק לגמרי את הקבוצה <b>${esc(c.name)}</b>?${gameCount ? ` יימחקו גם ${gameCount} ערבי המשחק שלה.` : ""} הפעולה בלתי הפיכה.</p>
      <button class="btn btn-block" style="background:#be123c;color:#fff;margin-top:8px;" data-confirm-delete-community>מחק קבוצה</button>
    `;
  } else if (m.type === "roster") {
    const c = getCommunity(m.communityId);
    title = `שחקנים ב${esc(c.name)}`;
    const rows = c.roster.map(p => {
      if (m.editingId === p.id) {
        return `<div class="roster-row">
          <input type="text" id="edit-name-input" value="${esc(p.name)}" style="flex:1;margin-left:8px;" autofocus>
          <div class="row" style="gap:4px;">
            <button class="icon-btn ok" data-save-edit="${p.id}">${icon('check')}</button>
            <button class="icon-btn" data-cancel-edit>${icon('x')}</button>
          </div>
        </div>`;
      }
      return `<div class="roster-row">
        <div class="row" style="gap:8px;"><span>${esc(p.name)}</span>${netBadge(playerNetProfit(m.communityId, p.id))}</div>
        <div class="row" style="gap:4px;">
          <button class="icon-btn gold" data-view-stats="${p.id}">${icon('bar')}</button>
          <button class="icon-btn" data-edit-player="${p.id}">${icon('pencil')}</button>
          <button class="icon-btn danger" data-remove-player="${p.id}">${icon('trash')}</button>
        </div>
      </div>`;
    }).join("");
    body = `
      <div class="scroll-list" style="margin-bottom:16px;">${rows || '<div class="empty" style="padding:10px 0;">אין עדיין שחקנים ברשימה</div>'}</div>
      <div class="row">
        <input type="text" id="new-roster-name" placeholder="שם שחקן חדש" style="flex:1;">
        <button class="btn btn-primary" data-add-roster style="padding:11px 16px;">${icon('plus')}</button>
      </div>
    `;
  } else if (m.type === "stats") {
    const c = getCommunity(m.communityId);
    const player = c.roster.find(p=>p.id===m.playerId);
    title = `סטטיסטיקות — ${esc(player.name)}`;
    const allGames = gamesForCommunity(m.communityId);
    const totalCommunityGames = allGames.length;
    const participatedGames = allGames.filter(g => g.players.some(p=>p.id===player.id));
    const profits = [];
    let best=null, worst=null;
    participatedGames.forEach(g => {
      const co = g.cashouts[player.id];
      if (!co) return;
      const buyins = g.buyins.filter(b=>b.playerId===player.id).reduce((s,b)=>s+b.amount,0);
      const profit = co.amount - buyins;
      profits.push(profit);
      if (!best || profit > best.profit) best = {date:g.date, profit};
      if (!worst || profit < worst.profit) worst = {date:g.date, profit};
    });
    const net = profits.reduce((s,p)=>s+p,0);
    const wins = profits.filter(p=>p>0);
    const losses = profits.filter(p=>p<0);
    const avgWin = wins.length ? wins.reduce((s,p)=>s+p,0)/wins.length : null;
    const avgLoss = losses.length ? losses.reduce((s,p)=>s+p,0)/losses.length : null;
    const avgOverall = profits.length ? net/profits.length : null;
    if (profits.length === 0) {
      body = `<div class="empty" style="padding:20px 0;">${esc(player.name)} עדיין לא סיים אף ערב משחק.</div>`;
    } else {
      body = `
        <div class="stats-net ${net>=0?'pos':'neg'}"><div class="pot-label">מאזן כולל</div><div class="val">${net>=0?"+":""}₪${Math.round(net)}</div></div>
        <div class="stats-grid" style="margin-bottom:10px;">
          <div class="box"><div class="l">ערבים ששוחקו (בקבוצה)</div><div class="v">${totalCommunityGames}</div></div>
          <div class="box"><div class="l">סה"כ ערבים שהשתתף בהם</div><div class="v">${participatedGames.length}</div></div>
          <div class="box"><div class="l">ממוצע נצחונות</div><div class="v" style="color:#6ee7b7;">${avgWin!=null?`+₪${Math.round(avgWin)}`:"—"}</div></div>
          <div class="box"><div class="l">ממוצע הפסדים</div><div class="v" style="color:#fda4af;">${avgLoss!=null?`₪${Math.round(avgLoss)}`:"—"}</div></div>

      .map(([id,b]) => ({ id, name: (g.players.find(pl=>pl.id===id)||{}).name || "?", remaining: b.profit + (alreadyPaid[id]||0), buyin: buyinTotals[id]||0, paid: alreadyPaid[id]||0 }))
      .filter(r => Math.abs(r.remaining) > 0.005)
      .sort((a,b) => b.remaining - a.remaining);
    title = "סיכום תשלומים לקבוצת פייבוקס";
    body = "";
    if (rows.length === 0) {
      body += `<div class="empty" style="padding:20px 0;">✓ הכל מאוזן — אין תשלומים נדרשים.</div>`;
    } else {
      body += rows.map(r => `
        <div class="roster-row">
          <span><span style="font-weight:700;">${esc(r.name)}</span> <span style="color:var(--muted);font-size:11px;">קנה ₪${r.buyin}${r.paid?` · העביר ₪${r.paid}`:""}</span></span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span style="font-weight:700;color:${r.remaining>0?'#6ee7b7':'#fda4af'};">${r.remaining>0?"+":"-"}₪${Math.round(Math.abs(r.remaining)*100)/100}</span>
            ${r.remaining < -0.005 ? `<button class="icon-btn gold" data-open-paybox-row="${r.id}" data-paybox-amount="${Math.round(Math.abs(r.remaining)*100)/100}" title="פתח פייבוקס עם הסכום">${icon('share')}</button>` : ""}
          </span>
        </div>
      `).join("");
    }
    body += `<div class="note">* ירוק = מקבל מקבוצת פייבוקס, אדום = מעביר לקבוצת פייבוקס.${Object.keys(alreadyPaid).length ? " הסכומים שכבר הועברו לפייבוקס במהלך הערב כבר נלקחו בחשבון." : ""}</div>`;
    if (rows.length) {
      body += `<button class="btn btn-primary btn-block" data-open-paybox-from-summary style="margin-top:14px;">${icon('share')} פייבוקס</button>`;
    }
  } else if (m.type === "history") {
    const g = getGame(m.gameId);
    const p = g.players.find(pl=>pl.id===m.playerId);
    title = `היסטוריה — ${esc(p.name)}`;
    const buyins = g.buyins.filter(b=>b.playerId===m.playerId);
    const totalBuyin = buyins.reduce((s,b)=>s+b.amount,0);
    let rows = `<div class="roster-row"><span>מספר תשלומים שהכניס</span><span style="font-weight:700;">${buyins.length}</span></div>`;
    rows += `<div class="roster-row"><span>סה"כ הכניס</span><span style="font-weight:700;">₪${totalBuyin}</span></div>`;
    if (buyins.length) {
      rows += `<div class="section-title" style="padding:0;margin:10px 0 6px;">פירוט התשלומים</div>`;
      rows += buyins.map((b,i) => `<div class="roster-row"><span>תשלום ${i+1}${b.ts?` · ${fmtTime(b.ts)}`:""}</span><span style="display:flex;align-items:center;gap:10px;">₪${b.amount}<button class="icon-btn" style="color:#fda4af;" data-delete-buyin="${b.id}" title="ביטול תשלום">${icon('trash')}</button></span></div>`).join("");
    }
    const paybox = (g.payboxPayments||[]).filter(b=>b.playerId===m.playerId);
    if (paybox.length) {
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">העברות לקבוצת פייבוקס</div>`;
      rows += paybox.map((b,i) => `<div class="roster-row"><span>העברה ${i+1}${b.ts?` · ${fmtTime(b.ts)}`:""}</span><span style="display:flex;align-items:center;gap:10px;">₪${b.amount}<button class="icon-btn" style="color:#fda4af;" data-delete-paybox="${b.id}" title="ביטול העברה">${icon('trash')}</button></span></div>`).join("");
    }
    const myOut = g.cashouts[m.playerId];
    if (myOut) {
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">יציאה מהמשחק</div>`;
      rows += `<div class="roster-row"><span>יצא עם${myOut.ts?` (בשעה ${fmtTime(myOut.ts)})`:""}</span><span style="font-weight:700;">₪${myOut.amount}</span></div>`;
      if (myOut.arrangedWith && myOut.arrangedWith.length) {
        const myProfit = computeArrangementAdjustments(g).adjusted[m.playerId];
        const share = Math.round((myProfit / myOut.arrangedWith.length) * 100) / 100;
        rows += myOut.arrangedWith.map(id => {
          const name = (g.players.find(pl=>pl.id===id)||{}).name || "?";
          return `<div class="roster-row"><span>${share>=0 ? "קיבל מ-" : "העביר ל-"}${esc(name)}</span><span style="font-weight:700;">₪${Math.abs(share)}</span></div>`;
        }).join("");
      }
    }
    // incoming arrangements: other players who left and named this player as their counterpart
    const adj = computeArrangementAdjustments(g).adjusted;
    const incoming = [];
    Object.entries(g.cashouts).forEach(([otherId, co]) => {
      if (otherId === m.playerId) return;
      if (!co.arrangedWith || !co.arrangedWith.includes(m.playerId)) return;
      const otherName = (g.players.find(pl=>pl.id===otherId)||{}).name || "?";
      const otherProfit = adj[otherId];
      const share = Math.round((Math.abs(otherProfit) / co.arrangedWith.length) * 100) / 100;
      incoming.push({ otherName, received: otherProfit < 0, share }); // if the other player owed money, this player received from them
    });
    if (incoming.length) {
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">סידורים עם שחקנים שיצאו</div>`;
      rows += incoming.map(x => `<div class="roster-row"><span>${x.received ? "קיבל מ-" : "העביר ל-"}${esc(x.otherName)}</span><span style="font-weight:700;">₪${x.share}</span></div>`).join("");
    }
    if (g.closed) {
      const finalBalances = computeFinalBalances(g);
      const alreadyPaid = (g.payboxPayments||[]).filter(pp=>pp.playerId===m.playerId).reduce((s,pp)=>s+pp.amount,0);
      const fb = finalBalances[m.playerId];
      rows += `<div class="section-title" style="padding:0;margin:14px 0 6px;">חלק בסיכום הסופי</div>`;
      if (!fb) {
        rows += `<div class="roster-row"><span>לא נכלל בסיכום הסופי (סודר ישירות עם שחקן אחר)</span></div>`;
      } else {
        const remaining = fb.profit + alreadyPaid;
        if (Math.abs(remaining) < 0.005) {
          rows += `<div class="roster-row"><span>מאוזן — אין תשלום נדרש לקבוצת פייבוקס</span></div>`;
        } else {
          rows += `<div class="roster-row"><span>${remaining>0?"מקבל מקבוצת פייבוקס":"מעביר לקבוצת פייבוקס"}</span><span style="font-weight:700;color:${remaining>0?'#6ee7b7':'#fda4af'};">₪${Math.round(Math.abs(remaining)*100)/100}</span></div>`;
        }
      }
    }
    body = rows;
  }

  const dismissable = !(m.type === "identityName" && m.forced);
  return `
    <div class="overlay">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head"><h3 class="serif">${title}</h3>${dismissable ? `<button class="close-x" data-close-modal>${icon('x')}</button>` : ""}</div>
        ${body}
      </div>
    </div>
  `;
}

// ---------- Event handling (delegated) ----------
function attachHandlers(){
  const app = document.getElementById("app");

  app.querySelectorAll("[data-edit-identity-name]").forEach(el => el.onclick = () => openModal({type:"identityName", forced:false}));
  app.querySelectorAll("[data-open-admin-settings]").forEach(el => el.onclick = () => openModal({type:"adminSettings"}));
  app.querySelectorAll("[data-open-community]").forEach(el => el.onclick = () => go("community", {communityId: el.dataset.openCommunity}));
  app.querySelectorAll("[data-delete-community]").forEach(el => el.onclick = (e) => { e.stopPropagation(); openModal({type:"deleteCommunity", communityId: el.dataset.deleteCommunity}); });
  app.querySelectorAll("[data-duplicate-community]").forEach(el => el.onclick = (e) => { e.stopPropagation(); openModal({type:"duplicateCommunity", communityId: el.dataset.duplicateCommunity}); });
  app.querySelectorAll("[data-open-chip-setup]").forEach(el => el.onclick = (e) => {
    e.stopPropagation();
    const c = getCommunity(el.dataset.openChipSetup);
    const existing = (c.chipValues||[]).map(cv => ({id: cv.id || uid(), image: cv.image || null, value: String(cv.value)}));
    openModal({type:"chipSetup", communityId: el.dataset.openChipSetup, imageSrc: null, points: existing});
  });
  const newCommunityBtn = app.querySelector("[data-new-community]");
  if (newCommunityBtn) newCommunityBtn.onclick = () => openModal({type:"newCommunity"});
  app.querySelectorAll("[data-open-game]").forEach(el => el.onclick = () => go("table", {gameId: el.dataset.openGame, communityId: getGame(el.dataset.openGame).communityId}));
  app.querySelectorAll("[data-delete-game]").forEach(el => el.onclick = (e) => { e.stopPropagation(); openModal({type:"deleteGame", gameId: el.dataset.deleteGame}); });
  app.querySelectorAll("[data-invite-game]").forEach(el => el.onclick = async (e) => {
    e.stopPropagation();
    const g = getGame(el.dataset.inviteGame);
    const c = g && getCommunity(g.communityId);
    if (!g || !c) return;
    const url = location.origin + location.pathname + "?game=" + encodeURIComponent(g.id);
    const text = `הצטרפו אליי למשחק פוקר ב${c.name} - ${g.date}`;
    if (navigator.share) {
      try { await navigator.share({title: "הזמנה למשחק פוקר", text, url}); } catch(err) { /* user cancelled the share sheet */ }
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      try { await navigator.clipboard.writeText(url); alert("הקישור הועתק! שלחו אותו לשחקן."); }
      catch(err) { alert(url); }
    } else {
      alert(url);
    }
  });
  const backHome = app.querySelector("[data-back-home]"); if (backHome) backHome.onclick = () => go("home");
  const backCommunity = app.querySelector("[data-back-community]"); if (backCommunity) backCommunity.onclick = () => go("community", {communityId: backCommunity.dataset.backCommunity});

  const showRoster = app.querySelector("[data-show-roster]");
  if (showRoster) showRoster.onclick = () => openModal({type:"roster", communityId: nav.communityId, editingId:null});

  const openPayboxSettings = app.querySelector("[data-open-paybox-settings]");
  if (openPayboxSettings) openPayboxSettings.onclick = () => {
    const c = getCommunity(openPayboxSettings.dataset.openPayboxSettings);
    // First time opening settings for a community still on the old single-link field -
    // fold it into the new list so it isn't silently lost.
    if ((!c.payboxLinks || !c.payboxLinks.length) && c.payboxLink) {
      const entry = {id: uid(), name: "פייבוקס", link: c.payboxLink};
      c.payboxLinks = [entry];
      c.activePayboxLinkId = entry.id;
      delete c.payboxLink;
      saveState();
    }
    openModal({type:"payboxSettings", communityId: openPayboxSettings.dataset.openPayboxSettings});
  };

  const newGameBtn = app.querySelector("[data-new-game]");
  if (newGameBtn) newGameBtn.onclick = () => {
    openModal({type:"newGame", communityId: nav.communityId, date: new Date().toISOString().slice(0,10)});
  };

  app.querySelectorAll("[data-buyin]").forEach(el => el.onclick = () => openModal({type:"buyin", gameId: nav.gameId, playerId: el.dataset.buyin, amount:""}));
  app.querySelectorAll("[data-leave]").forEach(el => el.onclick = () => openModal({type:"leave", gameId: nav.gameId, playerId: el.dataset.leave, amount:""}));
  app.querySelectorAll("[data-history]").forEach(el => el.onclick = () => openModal({type:"history", gameId: nav.gameId, playerId: el.dataset.history}));
  app.querySelectorAll("[data-edit-cashout]").forEach(el => el.onclick = () => openModal({type:"editCashout", gameId: nav.gameId, playerId: el.dataset.editCashout}));
  app.querySelectorAll("[data-return-to-game]").forEach(el => el.onclick = () => {
    const g = getGame(nav.gameId);
    delete g.cashouts[el.dataset.returnToGame];
    if (g.closed) g.closed = false; // a night with an active player again can't stay "closed"
    saveState();
    closeModal();
  });
  app.querySelectorAll("[data-remove-from-game]").forEach(el => el.onclick = () => openModal({type:"removeFromGame", gameId: nav.gameId, playerId: el.dataset.removeFromGame}));

  const endNightBtn = app.querySelector("[data-end-night]");
  if (endNightBtn) endNightBtn.onclick = () => openModal({type:"endNight", gameId: nav.gameId, amounts:{}});
  const viewSummaryBtn = app.querySelector("[data-view-summary]");
  if (viewSummaryBtn) viewSummaryBtn.onclick = () => openModal({type:"summary", gameId: nav.gameId});
  const addExistingBtn = app.querySelector("[data-add-existing]");
  if (addExistingBtn) addExistingBtn.onclick = () => openModal({type:"addExisting", gameId: nav.gameId});
  const bulkBuyinBtn = app.querySelector("[data-bulk-buyin]");
  if (bulkBuyinBtn) bulkBuyinBtn.onclick = () => {
    const g = getGame(nav.gameId);
    const active = g.players.filter(p => !(p.id in g.cashouts));
    const selected = {};
    active.forEach(p => { selected[p.id] = true; });
    openModal({type:"bulkBuyin", gameId: nav.gameId, amount:"", selected});
  };
  const payboxBtn = app.querySelector("[data-paybox-transfer]");
  if (payboxBtn) payboxBtn.onclick = () => {
    const g = getGame(nav.gameId);
    const active = g.players.filter(p => !(p.id in g.cashouts));
    openModal({type:"paybox", gameId: nav.gameId, playerId: (active[0]||g.players[0]||{}).id, amount:""});
  };

  const addExtraBtn = app.querySelector("[data-add-extra-player]");
  if (addExtraBtn) addExtraBtn.onclick = () => openModal({type:"addExisting", gameId: nav.gameId});

  const toggleEmptyBtn = app.querySelector("[data-toggle-empty-seats]");
  if (toggleEmptyBtn) toggleEmptyBtn.onclick = () => { hideEmptySeats = !hideEmptySeats; render(); };

  const openOddsBtn = app.querySelector("[data-open-poker-odds]");
  if (openOddsBtn) openOddsBtn.onclick = () => openModal({type:"pokerOdds", imageSrc: null, reading: false, error: null, results: null, hands: null, board: null});

  app.querySelectorAll("[data-seat]").forEach(el => {
    const dragHandle = el.querySelector(".seat-circle") || el;
    let drag = null;
    dragHandle.addEventListener("pointerdown", (e) => {
      const g = getGame(nav.gameId);
      const seats = g.seats || new Array(9).fill(null);
      const idx = parseInt(el.dataset.seat);
      if (!seats[idx]) return; // only occupied seats can be dragged
      drag = { fromIdx: idx, startX: e.clientX, startY: e.clientY, moved: false };
      dragHandle.setPointerCapture(e.pointerId);
    });
    dragHandle.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.abs(dx) > 14 || Math.abs(dy) > 14) drag.moved = true;
      if (drag.moved) {
        el.style.transform = `translate(-50%,-50%) translate(${dx}px, ${dy}px)`;
        el.style.zIndex = "50";
        el.style.opacity = "0.85";
      }
    });
    dragHandle.addEventListener("pointerup", (e) => {
      if (!drag) return;
      const wasMoved = drag.moved;
      const fromIdx = drag.fromIdx;
      el.style.transform = "";
      el.style.zIndex = "";
      el.style.opacity = "";
      drag = null;
      if (!wasMoved) {
        // A plain tap opens the seat menu, same as tapping the info text below.
        const g = getGame(nav.gameId);
        const seats = g.seats || new Array(9).fill(null);
        const pid = seats[fromIdx];
        if (pid) openModal({type:"seatMenu", gameId: nav.gameId, playerId: pid, seatIndex: fromIdx});
        return;
      }
      el.style.pointerEvents = "none";
      const under = document.elementFromPoint(e.clientX, e.clientY);
      el.style.pointerEvents = "";
      const targetEl = under ? under.closest("[data-seat]") : null;
      if (targetEl) {
        const toIdx = parseInt(targetEl.dataset.seat);
        if (toIdx !== fromIdx) {
          const g = getGame(nav.gameId);
          if (!g.seats) g.seats = new Array(9).fill(null);
          const tmp = g.seats[toIdx];
          g.seats[toIdx] = g.seats[fromIdx];
          g.seats[fromIdx] = tmp;
          saveState();
          render();
        }
      }
    });
    dragHandle.addEventListener("pointercancel", () => {
      el.style.transform = "";
      el.style.zIndex = "";
      el.style.opacity = "";
      drag = null;
    });
    el.onclick = () => {
      const g = getGame(nav.gameId);
      const idx = parseInt(el.dataset.seat);
      const seats = g.seats || new Array(9).fill(null);
      if (!seats[idx]) openModal({type:"pickSeat", gameId: nav.gameId, seatIndex: idx});
    };
    const infoEl = el.querySelector("[data-seat-info]");
    if (infoEl) infoEl.onclick = (e) => {
      e.stopPropagation();
      const g = getGame(nav.gameId);
      const idx = parseInt(el.dataset.seat);
      const seats = g.seats || new Array(9).fill(null);
      const pid = seats[idx];
      if (pid) openModal({type:"seatMenu", gameId: nav.gameId, playerId: pid, seatIndex: idx});
    };
    const settledEl = el.querySelector("[data-toggle-settled]");
    if (settledEl) settledEl.onclick = (e) => {
      e.stopPropagation();
      const g = getGame(nav.gameId);
      const co = g.cashouts[settledEl.dataset.toggleSettled];
      if (co) { co.settled = !co.settled; saveState(); render(); }
    };
  });

  // modal-level handlers
  // Clicking the dark overlay behind a modal does nothing on purpose - it was too
  // easy to accidentally dismiss a modal (and lose in-progress input) with a stray
  // tap near its edge. Only the explicit X button closes/backs out of a modal.
  const closeModalOrBack = () => {
    if (modal && modal.type === "chipPhotoCount") openModal({type:"seatChips", gameId: modal.gameId, playerId: modal.playerId});
    else closeModal();
  };
  const closeBtn = app.querySelector("[data-close-modal]");
  if (closeBtn) closeBtn.onclick = closeModalOrBack;

  if (modal && modal.type === "identityName") {
    const confirmBtn = app.querySelector("[data-confirm-identity-name]");
    if (confirmBtn) confirmBtn.onclick = async () => {
      const name = document.getElementById("identity-name-input").value.trim();
      if (!name) { alert("צריך להזין שם."); return; }
      myIdentity.name = name;
      saveIdentity();
      // A first-time visitor via an invite link has no name yet when autoJoinViaInvite
      // first runs in init(), so it bails out - retry now that we have one.
      if (nav.screen === "table" && nav.gameId) await autoJoinViaInvite(nav.gameId);
      closeModal();
    };
  }

  if (modal && modal.type === "photoSource") {
    const camBtn = app.querySelector("[data-photo-camera]");
    if (camBtn) camBtn.onclick = () => openFilePicker(modal.communityId, modal.playerId, true);
    const galBtn = app.querySelector("[data-photo-gallery]");
    if (galBtn) galBtn.onclick = () => openFilePicker(modal.communityId, modal.playerId, false);
    app.querySelectorAll("[data-pick-avatar]").forEach(el => el.onclick = () => {
      const c = getCommunity(modal.communityId);
      const rp = c && c.roster.find(pl => pl.id === modal.playerId);
      const key = el.dataset.pickAvatar;
      let photo = null;
      if (key.startsWith("builtin:")) photo = "/static/avatars/" + key.slice(8) + ".jpg";
      else if (key.startsWith("custom:")) {
        const av = (state.customAvatars||[]).find(a => a.id === key.slice(7));
        photo = av ? av.image : null;
      }
      if (rp && photo) { rp.photo = photo; saveState(); }
      closeModal();
    });
  }

  if (modal && modal.type === "adminSettings") {
    const openCreatorBtn = app.querySelector("[data-open-avatar-creator]");
    if (openCreatorBtn) openCreatorBtn.onclick = () => openModal({type:"avatarCreator", imageSrc: null, points: []});
    const openManageBtn = app.querySelector("[data-open-avatar-manage]");
    if (openManageBtn) openManageBtn.onclick = () => openModal({type:"avatarManage"});
    const saveSettingsBtn = app.querySelector("[data-save-admin-settings]");
    if (saveSettingsBtn) saveSettingsBtn.onclick = () => {
      const v = parseInt(document.getElementById("refresh-interval-input").value, 10);
      if (!v || v < 2) { alert("קצב הרענון צריך להיות לפחות 2 שניות."); return; }
      state.refreshIntervalSec = v;
      saveState();
      closeModal();
    };
  }

  if (modal && modal.type === "avatarManage") {
    app.querySelectorAll("[data-delete-avatar]").forEach(el => el.onclick = (e) => {
      e.stopPropagation();
      const key = el.dataset.deleteAvatar;
      if (!confirm("למחוק את האווטר?")) return;
      if (key.startsWith("custom:")) {
        const id = key.slice(7);
        state.customAvatars = (state.customAvatars||[]).filter(a => a.id !== id);
      } else {
        if (!state.hiddenAvatarKeys) state.hiddenAvatarKeys = [];
        if (!state.hiddenAvatarKeys.includes(key)) state.hiddenAvatarKeys.push(key);
      }
      saveState();
      render();
    });
    app.querySelectorAll("[data-move-avatar-cat-up]").forEach(el => el.onclick = () => {
      const groups = getAvatarGroups();
      const i = groups.findIndex(g => g.key === el.dataset.moveAvatarCatUp);
      if (i > 0) {
        const order = groups.map(g => g.key);
        [order[i-1], order[i]] = [order[i], order[i-1]];
        state.avatarCategoryOrder = order;
        saveState();
        render();
      }
    });
    app.querySelectorAll("[data-move-avatar-cat-down]").forEach(el => el.onclick = () => {
      const groups = getAvatarGroups();
      const i = groups.findIndex(g => g.key === el.dataset.moveAvatarCatDown);
      if (i >= 0 && i < groups.length - 1) {
        const order = groups.map(g => g.key);
        [order[i], order[i+1]] = [order[i+1], order[i]];
        state.avatarCategoryOrder = order;
        saveState();
        render();
      }
    });
    const saveManageBtn = app.querySelector("[data-save-avatar-manage]");
    if (saveManageBtn) saveManageBtn.onclick = () => {
      const groups = getAvatarGroups();
      groups.forEach(grp => {
        const nameInp = document.querySelector(`[data-avatar-cat-name="${grp.key}"]`);
        const newLabel = nameInp ? nameInp.value.trim() : grp.label;
        if (newLabel && newLabel !== grp.label) {
          if (grp.key.startsWith("builtin-cat:")) {
            const folder = grp.key.slice(12);
            if (!state.avatarCategoryLabelOverrides) state.avatarCategoryLabelOverrides = {};
            state.avatarCategoryLabelOverrides[folder] = newLabel;
          } else if (grp.key.startsWith("custom-cat:")) {
            const oldLabel = grp.key.slice(11);
            (state.customAvatars||[]).forEach(av => { if (av.category === oldLabel) av.category = newLabel; });
          }
        }
      });
      groups.forEach(grp => {

      const px = Math.round((e.clientX - rect.left) * scaleX);
      const py = Math.round((e.clientY - rect.top) * scaleY);
      const targetDisplayPx = 1.5 * 37.795; // ~1.5cm on the user's screen
      const defaultSize = Math.round(targetDisplayPx * scaleX);
      const image = cropAvatarImage(buildAvatarSourceCanvas(), px, py, defaultSize);
      updateModal({points: modal.points.concat([{id: uid(), name: "", category: "", x: px, y: py, size: defaultSize, image}])});
    };
    app.querySelectorAll("[data-avatar-marker]").forEach(markerEl => {
      const ptId = markerEl.dataset.avatarMarker;
      const pt = modal.points.find(p => p.id === ptId);
      if (!pt) return;
      let drag = null;
      markerEl.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        drag = {canvas: buildAvatarSourceCanvas()};
        markerEl.setPointerCapture(e.pointerId);
      });
      markerEl.addEventListener("pointermove", (e) => {
        if (!drag) return;
        e.stopPropagation();
        const rect = avatarPhotoEl.getBoundingClientRect();
        const scaleX = avatarPhotoEl.naturalWidth / rect.width;
        const scaleY = avatarPhotoEl.naturalHeight / rect.height;
        const px = Math.round((e.clientX - rect.left) * scaleX);
        const py = Math.round((e.clientY - rect.top) * scaleY);
        pt.x = Math.max(0, Math.min(avatarPhotoEl.naturalWidth, px));
        pt.y = Math.max(0, Math.min(avatarPhotoEl.naturalHeight, py));
        pt.image = cropAvatarImage(drag.canvas, pt.x, pt.y, pt.size || 20);
        markerEl.style.left = (pt.x/avatarPhotoEl.naturalWidth*100) + "%";
        markerEl.style.top = (pt.y/avatarPhotoEl.naturalHeight*100) + "%";
        updateAvatarPointDisplay(pt);
      });
      markerEl.addEventListener("pointerup", () => { if (drag) { drag = null; updateModal({}); } });
      markerEl.addEventListener("pointercancel", () => { drag = null; });
      const resizeEl = markerEl.querySelector("[data-avatar-marker-resize]");
      if (resizeEl) {
        let rdrag = null;
        resizeEl.addEventListener("pointerdown", (e) => {
          e.stopPropagation();
          rdrag = {canvas: buildAvatarSourceCanvas()};
          resizeEl.setPointerCapture(e.pointerId);
        });
        resizeEl.addEventListener("pointermove", (e) => {
          if (!rdrag) return;
          e.stopPropagation();
          const rect = avatarPhotoEl.getBoundingClientRect();
          const scaleX = avatarPhotoEl.naturalWidth / rect.width;
          const px = Math.round((e.clientX - rect.left) * scaleX);
          const newSize = Math.max(8, Math.round((px - pt.x) * 2));
          pt.size = newSize;
          pt.image = cropAvatarImage(rdrag.canvas, pt.x, pt.y, pt.size);
          markerEl.style.width = (newSize/avatarPhotoEl.naturalWidth*100) + "%";
          markerEl.style.height = (newSize/avatarPhotoEl.naturalHeight*100) + "%";
          updateAvatarPointDisplay(pt);
        });
        resizeEl.addEventListener("pointerup", () => { if (rdrag) { rdrag = null; updateModal({}); } });
        resizeEl.addEventListener("pointercancel", () => { rdrag = null; });
      }
    });
    const syncAvatarPointFields = () => {
      modal.points.forEach(pt => {
        const nameInp = document.querySelector(`[data-avatar-name-input="${pt.id}"]`);
        if (nameInp) pt.name = nameInp.value;

      const canvas = buildAvatarSourceCanvas();

      else if (dir === "right") pt.x = Math.min(avatarPhotoEl.naturalWidth, pt.x + step);
      else if (dir === "up") pt.y = Math.max(0, pt.y - step);
      else if (dir === "down") pt.y = Math.min(avatarPhotoEl.naturalHeight, pt.y + step);
      else if (dir === "plus") pt.size = pt.size + step;
      else if (dir === "minus") pt.size = Math.max(8, pt.size - step);
      pt.image = cropAvatarImage(canvas, pt.x, pt.y, pt.size);
      updateModal({});
    });
    app.querySelectorAll("[data-remove-avatar-point]").forEach(el => el.onclick = () => {

      state.customAvatars = (state.customAvatars||[]).concat(newAvatars);

      return (!v || v < 1) ? 1 : (v > 99 ? 99 : v);
    }
    function updateLiveBalance(){
      const box = document.getElementById("live-balance-box");
      if (!box) return;
      const totalBuyins = parseFloat(box.dataset.totalBuyins) || 0;
      const alreadyOut = parseFloat(box.dataset.alreadyOut) || 0;
      const multiplier = getMultiplier();
      let enteredSum = 0, allFilled = true;
      app.querySelectorAll("[data-end-amount]").forEach(inp => {
        const v = parseFloat(inp.value);
        if (isNaN(v)) allFilled = false; else enteredSum += v / multiplier;
      });
      const totalOut = alreadyOut + enteredSum;
      const diff = Math.round((totalBuyins - totalOut) * 100) / 100;
      const balancedNow = allFilled && Math.abs(diff) < 0.5;
      box.innerHTML = `
        <div class="row-between" style="flex-wrap:wrap;gap:10px 16px;">
          <div><div class="pot-label">סה"כ הכנסות</div><div class="pot-val">₪${totalBuyins}</div></div>
          <div style="text-align:center;"><div class="pot-label">סה"כ ציפים בשולחן</div><div class="pot-val">₪${Math.round(totalOut*100)/100}</div></div>
          <div style="text-align:left;"><div class="pot-label">נשאר לשלם</div><div class="pot-val">₪${diff}</div></div>
          ${allFilled ? `<div class="badge ${balancedNow?'badge-ok':'badge-bad'}" style="width:100%;text-align:center;">${balancedNow?'מאוזן ✓':'לא מאוזן'}</div>` : ""}
        </div>
      `;
    }
    const multiplierInput = document.getElementById("chip-multiplier");
    if (multiplierInput) multiplierInput.oninput = () => { modal.multiplier = getMultiplier(); updateLiveBalance(); };
    app.querySelectorAll("[data-end-amount]").forEach(el => el.oninput = (e) => {
      modal.amounts = modal.amounts || {};
      modal.amounts[el.dataset.endAmount] = e.target.value;
      updateLiveBalance();
    });
    updateLiveBalance();
    const confirmBulkBtn = app.querySelector("[data-confirm-end-bulk]");
    if (confirmBulkBtn) confirmBulkBtn.onclick = () => {
      const g = getGame(modal.gameId);
      const active = g.players.filter(p => !(p.id in g.cashouts));
      const multiplier = getMultiplier();
      const inputs = app.querySelectorAll("[data-end-amount]");
      let allFilled = true;
      const values = {};
      inputs.forEach(inp => {
        const v = parseFloat(inp.value);
        if (isNaN(v) || v < 0) allFilled = false;
        values[inp.dataset.endAmount] = v / multiplier;
      });
      if (!allFilled) { alert("צריך למלא סכום תקין לכל שחקן פעיל."); return; }
      if (!g.liveChips) g.liveChips = {};
      active.forEach(p => {
        const amt = Math.round(values[p.id]*100)/100;
        g.cashouts[p.id] = {amount: amt, ts: Date.now(), arrangedWith: []};
        g.liveChips[p.id] = amt;
      });
      g.closed = true;
      const c = getCommunity(g.communityId);
      c.lastParticipants = g.players.map(p=>p.id);
      saveState();
      openModal({type:"summary", gameId: g.id});
    };
    const confirmBtn = app.querySelector("[data-confirm-end]");
    if (confirmBtn) confirmBtn.onclick = () => {
      const g = getGame(modal.gameId);
      g.closed = true;
      const c = getCommunity(g.communityId);
      c.lastParticipants = g.players.map(p=>p.id);
      saveState();
      openModal({type:"summary", gameId: g.id});
    };
  }
}

// ---------- Guard against accidentally leaving the app via the browser/device back button ----------
history.pushState({pokerManagerGuard: true}, "");
window.addEventListener("popstate", () => {
  if (confirm("לצאת מהאפליקציה?")) {
    history.back();
  } else {
    history.pushState({pokerManagerGuard: true}, "");
  }
});

(async function init(){
  document.getElementById("app").innerHTML =
    '<div style="padding:60px 20px;text-align:center;color:#a8a29e;font-size:14px;">טוען נתונים משותפים...</div>';
  {
    const [stateResult, identityResult, versionResult] = await Promise.allSettled([loadState(), loadIdentity(), loadVersion()]);
    // A failed initial load must never be treated as "no data yet" - only fall back to
    // defaultState() here (the one legitimate use of it), never after a save is possible.
    state = stateResult.status === "fulfilled" ? stateResult.value : defaultState();
    myIdentity = identityResult.status === "fulfilled" ? identityResult.value : { id: uid(), name: null };
    appVersion = versionResult.status === "fulfilled" ? versionResult.value : null;
  }
  // One-time cleanup: remove legacy communities that weren't created via the "new community"
  // button (they have no createdBy - e.g. the two starter communities from an earlier version
  // of this app), along with any of their games.
  const keepIds = new Set(state.communities.filter(c => c.createdBy).map(c => c.id));
  const hadLegacy = keepIds.size !== state.communities.length;
  state.communities = state.communities.filter(c => c.createdBy);
  state.games = state.games.filter(g => keepIds.has(g.communityId));
  if (hadLegacy) saveState();
  const inviteGameId = new URLSearchParams(location.search).get("game");
  if (inviteGameId) {
    let invitedGame = getGame(inviteGameId);
    if (!invitedGame) {
      // Our initial load may have caught a stale shared-state snapshot (a race with
      // someone else's concurrent save) and missed a game that genuinely exists -
      // try once more with a fresh fetch before giving up and falling back to home.
      try { state = await loadState(); } catch(e) { /* keep the state we already have */ }
      invitedGame = getGame(inviteGameId);
    }
    if (invitedGame) {
      nav = { screen: "table", gameId: invitedGame.id, communityId: invitedGame.communityId };
      await autoJoinViaInvite(invitedGame.id);
    } else {
      // The linked game genuinely doesn't exist (most likely its host deleted that
      // evening) - say so instead of silently landing on the home screen with no
      // explanation for why the link didn't work.
      modal = {type:"inviteGone"};
    }
  }
  if (!myIdentity.name) modal = {type:"identityName", forced:true};
  render();
  scheduleAutoRefresh();
  connectLiveSync();
})();
</script>
