<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temp upload</title>
<style>
  body { font-family: sans-serif; padding: 24px; background: #111; color: #eee; }
  input, button { font-size: 16px; padding: 10px; margin-top: 12px; display: block; width: 100%; }
  #status { margin-top: 16px; font-size: 14px; }
  img { max-width: 100%; margin-top: 12px; border-radius: 8px; }
</style>
</head>
<body>
  <h3>Upload PayBox image</h3>
  <input type="file" id="file" accept="image/*">
  <button id="go">Upload</button>
  <div id="status"></div>
  <img id="preview" style="display:none;">
  <script>
    document.getElementById("go").onclick = () => {
      const f = document.getElementById("file").files[0];
      if (!f) { document.getElementById("status").textContent = "בחר תמונה קודם"; return; }
      const reader = new FileReader();
      reader.onload = async () => {
        document.getElementById("preview").src = reader.result;
        document.getElementById("preview").style.display = "block";
        document.getElementById("status").textContent = "מעלה...";
        try {
          const res = await fetch("/api/_debug_save_asset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dataUrl: reader.result, filename: "paybox-source-upload.png" })
          });
          const j = await res.json();
          document.getElementById("status").textContent = j.ok ? "הועלה בהצלחה!" : "שגיאה: " + JSON.stringify(j);
        } catch(e) {
          document.getElementById("status").textContent = "שגיאה: " + e;
        }
      };
      reader.readAsDataURL(f);
    };
  </script>
</body>
</html>
